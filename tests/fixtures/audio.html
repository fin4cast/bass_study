<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>P4: реальный аудиодвижок</title>
<body>
  <h1>Изолированная проверка аудиодвижка</h1>
  <button id="start">Старт</button>
  <button id="pause">Пауза</button>
  <button id="resume">Продолжить</button>
  <button id="stop">Стоп</button>
  <button id="start-pause">Старт и немедленная пауза</button>
  <script type="module">
    import { createPlayer, renderSequenceOffline } from '/src/audio/engine.ts';
    import { annotatePositions, createStructure, getPosition } from '/src/music/index.ts';
    import { buildTimeline } from '/src/exercises/rhythm.ts';
    const notes = annotatePositions([0, 1, 3, 5].map(fret => getPosition('E', fret)), createStructure('C', 'major'));
    const player = createPlayer();
    const makeConfig = (overrides = {}) => ({
      notes, bpm: 120, duration: 'quarter', countIn: false, repeat: 'once',
      metronome: { enabled: false, mode: 'all', subdivision: 'quarter' }, ...overrides,
    });
    // Амплитуды гармоник по окну Ханна (корреляция на точных частотах k·f0), измеренные по отсчётам PCM.
    function harmonicLevels(samples, sampleRate, hz, from, to, count = 3) {
      const start = Math.round(from * sampleRate), length = Math.round(to * sampleRate) - start;
      return Array.from({ length: count }, (_, index) => {
        const frequency = hz * (index + 1); let re = 0, im = 0, weights = 0;
        for (let offset = 0; offset < length; offset++) {
          const weight = .5 - .5 * Math.cos(2 * Math.PI * offset / (length - 1)); const value = samples[start + offset] * weight; const phase = 2 * Math.PI * frequency * offset / sampleRate;
          re += value * Math.cos(phase); im -= value * Math.sin(phase); weights += weight;
        }
        return 2 * Math.hypot(re, im) / weights;
      });
    }
    /** Продуктовый голос последовательности в OfflineAudioContext: отдельный проигрыватель, канал баса. */
    async function bassSpectrum(fret) {
      const position = getPosition('E', fret);
      const { buffer } = await renderSequenceOffline(makeConfig({ notes: annotatePositions([position], createStructure('C', 'major')), bpm: 60 }),
        { durationSeconds: 1.2, volumes: { bass: 1, click: 0 } });
      const samples = buffer.getChannelData(0).slice(); const sampleRate = buffer.sampleRate;
      let peak = 0; for (const value of samples) peak = Math.max(peak, Math.abs(value));
      const levels = harmonicLevels(samples, sampleRate, position.frequency, .15, .65);
      return { fret, hz: position.frequency, peak, levels, ratios: levels.slice(1).map(level => level / levels[0]) };
    }
    /** Аккорды в PCM канала 3: уровни голосов, посторонней высоты (D4) и «хвоста» G4 прошлого аккорда. 60 BPM: такт — 4 с, окно аккорда 0,3–3,5 с. */
    async function chordSpectrum() {
      const { buffer } = await renderSequenceOffline(makeConfig({ steps: [{ note: 0, grids: 16 }, { note: 1, grids: 16 }], bpm: 60, chords: { mode: 'hold', bars: [[60, 64, 67], [57, 60, 64]] } }),
        { durationSeconds: 8.5, volumes: { bass: 0, click: 0, groove: 0, chords: 1 } });
      const samples = buffer.getChannelData(3).slice(); const sampleRate = buffer.sampleRate;
      const hz = midi => 440 * 2 ** ((midi - 69) / 12);
      const level = (midi, from, to) => harmonicLevels(samples, sampleRate, hz(midi), from, to, 1)[0];
      return [
        { voices: [60, 64, 67].map(midi => level(midi, .3, 3.5)), control: level(62, .3, 3.5) },
        { voices: [57, 60, 64].map(midi => level(midi, 4.3, 7.5)), gone: level(67, 4.3, 7.5) },
      ];
    }
    /**
     * «Держать» и смена темпа посреди такта: проход в 1,5 такта, второй проход вдвое быстрее. Аккорд A–C–E второго такта первого прохода
     * (60 BPM, 4–8 с по своей длине) обязан замолчать на границе прохода (6 с), где начинается C–E–G; A3 (MIDI 57) есть только в A–C–E.
     */
    async function chordCutAtTempoChange() {
      const { buffer } = await renderSequenceOffline(makeConfig({ steps: [{ note: 0, grids: 16 }, { note: 1, grids: 8 }], bpm: 60, repeat: { kind: 'ladder', start: 60, end: 120, step: 60, repeatsPerTempo: 1 }, chords: { mode: 'hold', bars: [[60, 64, 67], [57, 60, 64]] } }),
        { durationSeconds: 9.5, volumes: { bass: 0, click: 0, groove: 0, chords: 1 } });
      const samples = buffer.getChannelData(3).slice(); const sampleRate = buffer.sampleRate;
      const a3 = (from, to) => harmonicLevels(samples, sampleRate, 440 * 2 ** ((57 - 69) / 12), from, to, 1)[0];
      return { before: a3(4.3, 5.7), after: a3(6.3, 7.7) };
    }
    /** Длительность звучания (A3) в PCM баса: СКЗ в окнах внутри шага; 60 BPM, четверть — 1 с. Шаги: gate 1, gate 0,5, без gate. */
    async function gateWindows() {
      const { buffer } = await renderSequenceOffline(makeConfig({ steps: [{ note: 0, grids: 4, gate: 1 }, { note: 0, grids: 4, gate: 0.5 }, { note: 0, grids: 4 }], bpm: 60 }),
        { durationSeconds: 3.5, volumes: { bass: 1, click: 0, groove: 0, chords: 0 } });
      const samples = buffer.getChannelData(0); const sampleRate = buffer.sampleRate;
      const rms = (from, to) => { let sum = 0; const a = Math.round(from * sampleRate), b = Math.round(to * sampleRate); for (let i = a; i < b; i++) sum += samples[i] * samples[i]; return Math.sqrt(sum / (b - a)); };
      const window = (step, from, to) => rms(step + from, step + to);
      return {
        long: { at90: window(0, .88, .92), late: window(0, .95, .985) },
        short: { early: window(1, .15, .45), gap: window(1, .6, .95) },
        plain: { early: window(2, .15, .6), gap: window(2, .8, .95) },
      };
    }
    /** Шаги настоящей шкалы прохода для `count` нот без тоники: ритмический рисунок → шаги звука. */
    const rhythmSteps = (pattern, count) => buildTimeline(
      { spec: { templateId: 'chromatic-position' }, notes: Array.from({ length: count }, () => ({ degree: null, segment: 0, midi: 40 })), segments: [], cadence: 'none' }, { pattern },
    ).steps.map(({ note, grids, audible, tie }) => ({ note, grids, audible, tie }));
    window.p4 = { player, makeConfig, bassSpectrum, chordSpectrum, chordCutAtTempoChange, gateWindows, rhythmSteps, config: makeConfig(), ready: true, action: null };
    for (const name of ['start', 'pause', 'resume', 'stop']) {
      document.getElementById(name).addEventListener('click', async () => {
        window.p4.action = { name, done: false, error: null };
        try { await player[name](...(name === 'start' ? [window.p4.config] : [])); }
        catch (error) { window.p4.action.error = error.message; }
        finally { window.p4.action.done = true; }
      });
    }
    document.getElementById('start-pause').addEventListener('click', async () => {
      window.p4.action = { name: 'start-pause', done: false, error: null };
      try { await player.start(window.p4.config); player.pause(); }
      catch (error) { window.p4.action.error = error.message; }
      finally { window.p4.action.done = true; }
    });
    window.addEventListener('pagehide', () => player.dispose(), { once: true });
  </script>
</body>
</html>
