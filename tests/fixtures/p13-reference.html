<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>P13: «Справочник» (VIS-12)</title>
<style>
  body { margin: 0; }
  .fx-app { display: grid; grid-template-columns: 190px minmax(0, 1fr); height: 100vh; }
  .fx-nav { background: var(--surface-navigation); border-right: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--text-secondary); }
  .fx-nav button { font: inherit; }
  .fx-main { min-width: 0; min-height: 0; overflow: auto; padding: 14px 26px 18px; display: flex; flex-direction: column; gap: 12px; }
  #reference-mount { flex: 1 1 auto; min-height: 0; }
  .fx-play { display: flex; flex-direction: column; gap: 12px; max-width: 760px; }
  .fx-play h1 { font-size: 24px; letter-spacing: -.5px; }
  .fx-play p { line-height: 1.7; }
  .fx-term { border: 0; background: none; padding: 0; font: inherit; font-weight: 600; color: var(--info-text); text-decoration: underline dotted 1.5px; text-underline-offset: 3px; cursor: pointer; }
  .fx-board { height: 220px; border-radius: 12px; background: var(--board-top); }
  @media (max-width: 1100px) { .fx-app { grid-template-columns: 72px minmax(0, 1fr); } .fx-nav span { display: none; } .fx-main { padding: 14px 18px; } }
</style>
<body>
  <div class="fx-app">
    <nav class="fx-nav" aria-label="Фикстура">
      <strong>bass.study</strong><span>Фикстура P13 · «Справочник»</span>
      <button type="button" data-fx-mode="page">A · Страница</button>
      <button type="button" data-fx-mode="panel">B · Панель</button>
    </nav>
    <main class="fx-main">
      <div id="reference-mount"></div>
      <section class="fx-play" id="play-screen" hidden>
        <h1>Связка соседних форм · Am · A → B</h1>
        <p>Соседние формы <button type="button" class="fx-term" data-term="pentatonic">пентатоники</button> делят <button type="button" class="fx-term" data-term="shared-notes">общие ноты</button>. Тоника A звучит в двух <button type="button" class="fx-term" data-term="octave-numbers">октавах</button> — A1 и A2. Опорные <button type="button" class="fx-term" data-term="degree">ступени ♭3 и ♭7</button> — C и G.</p>
        <div class="fx-board" aria-hidden="true"></div>
        <p><button type="button" id="fx-play">▶ Продолжить</button></p>
      </section>
    </main>
  </div>
  <script type="module">
    import '/src/styles.css';
    import { mountReference, mountReferencePanel } from '/src/ui/reference/view.ts';

    const params = new URLSearchParams(location.search);
    document.documentElement.dataset.theme = params.get('theme') === 'dark' ? 'dark' : 'light';
    window.p13Log = [];
    const log = (name, value = null) => { window.p13Log.push({ name, value }); };
    const mastered = new Set(['semitone', 'accidentals', 'octave', 'unison', 'fourth', 'fifth', 'pentatonic']);
    const common = {
      mastered,
      onMastered: (id, value) => { log('mastered', { id, value }); if (value) mastered.add(id); else mastered.delete(id); },
      onPlayTemplate: id => log('template', id),
      onOpenSection: section => log('section', section),
      onListen: params.get('listen') === '1' ? concept => log('listen', concept.id) : undefined,
    };
    const pageHost = document.getElementById('reference-mount');
    const playScreen = document.getElementById('play-screen');
    const page = mountReference(pageHost, { ...common, initialConcept: params.get('concept') ?? 'octave-numbers', backLabel: '← Основы · уровень 2', onBack: () => log('back') });
    const panel = mountReferencePanel(document.body, {
      ...common,
      footnote: 'Игра на паузе под панелью',
      onOpenFull: id => { log('full', id); setMode('page'); page.open(id); },
    });
    function setMode(mode) {
      page.setVisible(mode === 'page');
      playScreen.hidden = mode !== 'panel';
    }
    playScreen.addEventListener('click', event => {
      const term = event.target.closest('[data-term]');
      if (term) panel.open(term.dataset.term, term, `из экрана игры · «${term.textContent.trim()}»`);
    });
    document.querySelectorAll('[data-fx-mode]').forEach(button => button.addEventListener('click', () => setMode(button.dataset.fxMode)));
    setMode(params.get('mode') === 'panel' ? 'panel' : 'page');
    if (params.get('mode') === 'panel' && params.get('open') !== '0') {
      const term = playScreen.querySelector('[data-term="shared-notes"]');
      panel.open('shared-notes', term, 'из экрана игры · «общие ноты»');
    }
    window.p13Page = page;
    window.p13Panel = panel;
  </script>
</body>
</html>
