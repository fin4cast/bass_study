<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>P5: настоящее локальное хранилище</title>
<body>
  <h1>Изолированная проверка IndexedDB</h1>
  <script type="module">
    import { createStudyStore, DEFAULT_PREFERENCES, emptySnapshot, makeManualHistory, makeRouteHistory, makeScreenHistory, previewImport, validateSnapshot } from '/src/storage/index.ts';
    import { annotatePositions, createStructure, getPosition } from '/src/music/index.ts';
    import { createManualPracticeResult, nextQuestion, startQuiz, submitAnswer } from '/src/training/index.ts';
    import { advanceRouteSession, createRouteMaterial, startRouteSession } from '/src/route/index.ts';
    const structure = createStructure('A', 'minor-pentatonic');
    const positions = annotatePositions([getPosition('E', 0), getPosition('E', 12)], structure);
    const context = { scope: 'structure', root: 'A', structureId: 'minor-pentatonic', positionIds: ['E:0', 'E:12'] };
    const metadata = { occurredAt: '2026-11-08T22:30:00.000Z', timeZone: 'Europe/Moscow' };
    function screen(id = 'fixture-screen') {
      let session = startQuiz({ positions, structure, mode: 'name-note', scope: 'structure', seed: 100 }, 1);
      session = submitAnswer(session, 'F', 350);
      session = nextQuestion(submitAnswer(session, 'E', 600));
      return makeScreenHistory(session, { ...metadata, id });
    }
    function manual(id = 'fixture-manual', note = 'Ручная отметка; не измеренная точность.') {
      return makeManualHistory(createManualPracticeResult({ context, material: { kind: 'sequence', pattern: 'ascending', routePositionIds: ['E:0', 'E:12'], duration: 'quarter', fragment: { from: 0, toExclusive: 2 }, box: null }, comfortableBpm: 72, durationMs: 300000, note }), { ...metadata, id });
    }
    function route(id, atMs = 2500) {
      const session = startRouteSession({ id: `session-${id}`, material: createRouteMaterial() });
      return makeRouteHistory(advanceRouteSession(session, atMs), { ...metadata, id });
    }
    function seedSnapshot() {
      const preferences = structuredClone(DEFAULT_PREFERENCES);
      preferences.study = { root: 'C', structureId: 'major', labelMode: 'degrees', strings: ['E'], fretMin: 0, fretMax: 3, box: null, showFingers: false };
      preferences.training.mode = 'sequence'; preferences.training.sequenceScope = 'chromatic';
      preferences.player.bpm = 96; preferences.player.countIn = false;
      return validateSnapshot({ ...emptySnapshot(), profile: { theme: 'system', onboarding: { version: 1, choice: 'free', completed: false } }, preferences,
        presets: [
          { id: 'fixture-preset-a', name: 'Нижняя струна', createdAt: metadata.occurredAt, preferences },
          { id: 'fixture-preset-b', name: 'Исходная область', createdAt: metadata.occurredAt, preferences: DEFAULT_PREFERENCES },
        ], history: [screen(), manual()] });
    }
    function draft(id = 'native-draft') {
      const area = { root: 'C', structureId: 'major-triad', scope: 'structure', positionIds: ['E:8', 'A:7', 'A:10', 'D:10'] };
      return { id, createdAt: metadata.occurredAt, updatedAt: metadata.occurredAt, timeZone: metadata.timeZone, localDate: '2026-11-09', context: area,
        material: { kind: 'sequence', pattern: 'ascending', routePositionIds: area.positionIds, duration: 'quarter', fragment: { from: 0, toExclusive: 4 }, box: null }, routeRef: null,
        totalReferenceMs: 1200, recordedThroughMs: 0, suggestedBpm: 60, comfortableBpm: 64, note: 'Нативный черновик', editRevision: 1 };
    }
    // Fixture-only fault injection through the store's write observer: counts successful
    // write requests of the latest observed transaction and may abort it after the N-th one.
    const faults = (() => {
      let abortAfter = null, last = { successfulWrites: 0, aborted: false }, current = null;
      const states = new WeakMap(), connections = new WeakSet();
      return {
        observeWrite(request, transaction) {
          if (transaction !== current) {
            current = transaction; last = { successfulWrites: 0, aborted: false }; states.set(transaction, last);
            // The store sets transaction.onabort before its first write, and target listeners run in
            // registration order. The abort event bubbles to the connection, so a capture listener there
            // marks the abort before the store rejects and the test reads last().
            if (!connections.has(transaction.db)) {
              connections.add(transaction.db);
              transaction.db.addEventListener('abort', event => { const state = states.get(event.target); if (state) state.aborted = true; }, { capture: true });
            }
          }
          const observed = last;
          request.addEventListener('success', () => {
            observed.successfulWrites++;
            if (abortAfter !== null && observed.successfulWrites === abortAfter) { abortAfter = null; transaction.abort(); }
          });
        },
        arm(count) { if (!Number.isInteger(count) || count < 1) throw new Error('Fixture abort point must be a positive integer'); abortAfter = count; },
        last: () => ({ ...last }),
      };
    })();
    const createStore = () => createStudyStore({ observeWrite: faults.observeWrite });
    const store = createStore();
    async function seed() {
      const snapshot = seedSnapshot();
      await store.savePreferences(snapshot.preferences); await store.saveProfile(snapshot.profile);
      for (const preset of snapshot.presets) await store.savePreset(preset);
      for (const entry of snapshot.history) await store.addHistory(entry);
      return store.readSnapshot({ fresh: true });
    }
    async function readRaw() {
      const db = await new Promise((resolve, reject) => {
        const request = indexedDB.open('bass-study'); request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error);
      });
      try {
        const transaction = db.transaction(['preferences', 'presets', 'history', 'profile', 'practiceDrafts', 'rhythmProjects'], 'readonly');
        const complete = new Promise((resolve, reject) => { transaction.oncomplete = resolve; transaction.onabort = () => reject(transaction.error); });
        const get = request => new Promise((resolve, reject) => { request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error); });
        const [preferences, presets, history, profile, practiceDrafts, rhythmProjects, activeRhythmProjectId] = await Promise.all([
          get(transaction.objectStore('preferences').get('current')), get(transaction.objectStore('presets').getAll()), get(transaction.objectStore('history').getAll()),
          get(transaction.objectStore('profile').get('current')), get(transaction.objectStore('practiceDrafts').getAll()),
          get(transaction.objectStore('rhythmProjects').getAll()), get(transaction.objectStore('preferences').get('rhythm-selection')),
        ]);
        await complete; return { version: db.version, preferences: preferences ?? null, presets, history, profile, practiceDrafts, rhythmProjects, activeRhythmProjectId: activeRhythmProjectId ?? null };
      } finally { db.close(); }
    }
    window.p5 = { store, faults, seed, seedSnapshot, screen, manual, route, draft, emptySnapshot, previewImport, readRaw, createStore, defaults: DEFAULT_PREFERENCES, ready: true };
  </script>
</body>
</html>
