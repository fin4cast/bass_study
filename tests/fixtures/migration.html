<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>P6: миграция настоящей базы</title>
<body>
<h1>Независимая база версии 1</h1>
<script type="module">
  // Deliberately no production import before seedV1 has created the old schema.
  const requestValue = request => new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error);
  });
  const complete = transaction => new Promise((resolve, reject) => {
    transaction.oncomplete = resolve; transaction.onabort = () => reject(transaction.error);
  });
  async function readLegacyBackup(version = 1) {
    if (![1, 2, 3, 4, 5].includes(version)) throw new Error('Only actual v1/v2/v3/v4/v5 fixtures are supported');
    const response = await fetch(`/tests/fixtures/v${version}-backup.json`, { cache: 'no-store' });
    if (!response.ok) throw new Error(`Literal v${version} fixture unavailable: ${response.status}`);
    return response.json();
  }
  const readV1Backup = () => readLegacyBackup(1);
  async function rawRead() {
    const db = await requestValue(indexedDB.open('bass-study'));
    try {
      const names = ['preferences', 'presets', 'history', ...(['profile', 'practiceDrafts'].filter(name => db.objectStoreNames.contains(name)))];
      const transaction = db.transaction(names, 'readonly');
      const done = complete(transaction);
      const [preferences, presets, history, profile, practiceDrafts] = await Promise.all([
        requestValue(transaction.objectStore('preferences').get('current')),
        requestValue(transaction.objectStore('presets').getAll()),
        requestValue(transaction.objectStore('history').getAll()),
        names.includes('profile') ? requestValue(transaction.objectStore('profile').get('current')) : Promise.resolve(undefined),
        names.includes('practiceDrafts') ? requestValue(transaction.objectStore('practiceDrafts').getAll()) : Promise.resolve(undefined),
      ]);
      await done; return { version: db.version, preferences, presets, history, ...(profile ? { profile, practiceDrafts } : {}) };
    } finally { db.close(); }
  }
  async function seedLegacy(version = 1, { invalid = false } = {}) {
    const literal = await readLegacyBackup(version);
    const input = structuredClone(literal);
    if (invalid) {
      const entry = input.history.find(entry => entry.result.kind === 'screen');
      if (!entry) throw new Error('Literal v1 fixture needs a real screen result');
      entry.result.questions[0].firstResponseMs = -1;
    }
    const request = indexedDB.open('bass-study', version);
    request.onupgradeneeded = () => {
      const db = request.result;
      db.createObjectStore('preferences'); db.createObjectStore('presets', { keyPath: 'id' }); db.createObjectStore('history', { keyPath: 'id' });
    };
    const db = await requestValue(request);
    try {
      const transaction = db.transaction(['preferences', 'presets', 'history'], 'readwrite');
      const done = complete(transaction);
      transaction.objectStore('preferences').put(input.preferences, 'current');
      for (const item of input.presets) transaction.objectStore('presets').put(item);
      for (const item of input.history) transaction.objectStore('history').put(item);
      await done;
    } finally { db.close(); }
    return { literal, raw: await rawRead() };
  }
  const seedV1 = options => seedLegacy(1, options);
  async function loadCurrent() {
    const module = await import('/src/storage/index.ts');
    window.p6.store = module.createStudyStore();
    return window.p6.store;
  }
  window.p6 = { ready: true, seedV1, seedLegacy, readV1Backup, readLegacyBackup, rawRead, loadCurrent, store: null };
</script>
</body>
</html>
