    box.innerHTML = `
      <div class="v10a-plan-head"><h2>План на сегодня · ${total} мин</h2><span class="lr-sub">${plan.length} ${plural(plan.length, 'шаг', 'шага', 'шагов')}</span></div>
      ${A.state === 'cont' ? `<div><div class="lr-meter"><i style="width:${total ? Math.round(done / total * 100) : 0}%"></i></div><span class="v10-demo">Сыграно ${done} из ${total} мин</span></div>` : '<span class="v10-demo">Готовый план для первого раза — поменяй, если хочешь.</span>'}
      <ol class="v10a-steps">${plan.map((s, i) => `
        <li class="v10a-step is-${s.status}">
          <span class="v10a-dot" aria-hidden="true">${s.status === 'done' ? '✓' : s.status === 'current' ? '▶' : i + 1}</span>
          <div style="min-width:0"><div class="v10a-step-title">${esc(s.title)}</div>
            <div class="v10a-step-meta"><span>${esc(s.meta)}</span>${s.status === 'done' ? '<span>· выполнено</span>' : s.status === 'current' ? '<span>· сейчас</span>' : ''}${'ear' in s ? `<button type="button" class="v10-opt" data-a-ear="${i}" aria-pressed="${s.ear}" title="Опция: сначала прозвучит ступень, потом ищешь её">+ слух</button>` : ''}</div></div>
          <div class="v10a-step-side"><span class="v10a-min">${s.min} мин</span><span class="v10a-edit"><button type="button" class="v10-mini" data-a-up="${i}" aria-label="Выше"${i === 0 ? ' disabled' : ''}>↑</button><button type="button" class="v10-mini" data-a-del="${i}" aria-label="Убрать из плана">✕</button></span></div>
        </li>`).join('') || '<li class="v10a-empty">План пуст — добавь упражнение из библиотеки.</li>'}
      </ol>
      <div class="v10a-picker${A.picker ? ' is-open' : ''}"><span class="v10-demo">Добавить из библиотеки</span>${pool.length ? pool.map((p, i) => `<button type="button" data-a-pick="${i}"><span>+ ${esc(p.title)} <small>· ${esc(p.meta)}</small></span><small>${p.min} мин</small></button>`).join('') : '<span class="v10a-empty">Подсказки закончились — остальное в библиотеке.</span>'}</div>
      <div class="v10a-plan-tools">
        <button type="button" class="lr-btn v10-btn-s" data-a-edit aria-pressed="${A.editing}">${A.editing ? 'Готово' : 'Изменить план'}</button>
        <button type="button" class="lr-btn v10-btn-s" data-a-picker aria-expanded="${A.picker}">+ из библиотеки</button>
      </div>`;
    const heroStep = $('[data-a-hero-step]');
    if (heroStep) { const i = plan.findIndex(s => s.id === 'link'); heroStep.textContent = i >= 0 ? `Продолжить · шаг ${i + 1} из ${plan.length} плана` : 'Продолжить · с прошлого занятия'; }
  }

  function renderA() {
    $$('[data-a-state]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.aState === A.state)));
    $('[data-a-sub]').textContent = A.state === 'cont' ? 'Сел с басом — вот что играть сейчас.' : 'Первый раз здесь — начнём с короткого плана.';
    $('[data-a-foot]').textContent = A.state === 'cont'
      ? 'Демонстрационные данные прогресса. Темп и отметку «чисто / с ошибками / не успевал» ставишь ты — приложение не оценивает игру.'
      : 'Прогресс появится после первого упражнения: лучший удобный темп и твоя отметка.';
    renderAHero(); renderARecs(); renderAPlan();
  }

  root.addEventListener('click', event => {
    const t = event.target;
    const state = t.closest('[data-a-state]');
    if (state) { A.state = state.dataset.aState; A.editing = false; A.picker = false; renderA(); return; }
    if (t.closest('[data-a-edit]')) { A.editing = !A.editing; renderAPlan(); return; }
    if (t.closest('[data-a-picker]')) { A.picker = !A.picker; renderAPlan(); return; }
    const plan = A.plans[A.state];
    const ear = t.closest('[data-a-ear]');
    if (ear) { const s = plan[Number(ear.dataset.aEar)]; s.ear = !s.ear; renderAPlan(); return; }
    const up = t.closest('[data-a-up]');
    if (up) { const i = Number(up.dataset.aUp); [plan[i - 1], plan[i]] = [plan[i], plan[i - 1]]; renderAPlan(); return; }
    const del = t.closest('[data-a-del]');
    if (del) { const [removed] = plan.splice(Number(del.dataset.aDel), 1); if (removed.status === 'current') { const next = plan.find(s => s.status === 'next'); if (next) next.status = 'current'; } renderAPlan(); renderARecs(); toast(`Убрано из плана: ${removed.title}`); return; }
    const pick = t.closest('[data-a-pick]');
    if (pick) { const [item] = A.pool[A.state].splice(Number(pick.dataset.aPick), 1); plan.push({ ...item, status: plan.some(s => s.status === 'current') ? 'next' : 'current' }); renderAPlan(); toast(`Добавлено в план: ${item.title}`); return; }
    const rec = t.closest('[data-a-rec]');
    if (rec) { const r = RECS[A.state][Number(rec.dataset.aRec)]; plan.push({ ...r.add, status: plan.some(s => s.status === 'current') ? 'next' : 'current' }); renderAPlan(); renderARecs(); toast(`Добавлено в план: ${r.add.title} · ${r.add.meta}`); }
  });
  renderA();

  /* ================= B · Библиотека ================= */
  const B = { cat: 'all', tonic: 'A', structure: 'any', concepts: new Set(), status: 'all', sort: 'work', plan: ['link', 'arp'] };
  function filtered() {
    let list = EXERCISES.filter(e => (B.cat === 'all' || e.cat === B.cat)
      && (B.structure === 'any' || e.fits.includes('*') || e.fits.includes(B.structure))
      && (!B.concepts.size || e.concepts.some(c => B.concepts.has(c)))
      && (B.status === 'all' || e.status === B.status));
    if (B.sort === 'work') list = [...list.filter(e => e.status === 'work'), ...list.filter(e => e.status !== 'work')];
    return list;
  }
  function renderBCats() {
    $('[data-b-cats]').innerHTML = `<button type="button" class="v10b-cat" data-b-cat="all" aria-pressed="${B.cat === 'all'}"><span>Все упражнения</span><small>${EXERCISES.length}</small></button><div class="v10b-cat-sep"></div>`
      + CATS.map(([id, t], i) => `<button type="button" class="v10b-cat" data-b-cat="${id}" aria-pressed="${B.cat === id}"><span>${i + 1}. ${esc(t)}</span><small>${EXERCISES.filter(e => e.cat === id).length}</small></button>`).join('');
  }
  function card(e) {
    const inPlan = B.plan.includes(e.id);
    const preview = e.preview ? `${board(PREVIEWS[e.preview]())}<span class="v10b-real">превью рассчитано из модели</span>` : sketch(EXERCISES.indexOf(e));
    return `<article class="lr-card v10b-card${inPlan ? ' in-plan' : ''}">
      <div><h3>${esc(e.title)}</h3><p class="v10b-meta">${esc(CAT_TITLE[e.cat])} · ${esc(e.mat(B.tonic))}</p></div>
      <div>${preview}</div>
      <div class="v10-chips">${e.concepts.map(c => `<span class="lr-chip lr-chip-concept">${esc(c)}</span>`).join('')}<span class="lr-chip">${e.min} мин</span></div>
      <div class="v10b-card-foot">
        <span class="v10b-best">${e.status === 'work' ? `лучший темп <b>${e.best}</b>` : 'ещё не играл'}</span>
        <span class="v10b-card-btns"><button type="button" class="lr-btn lr-btn-primary v10-btn-s" data-toast="${esc(`Демо: откроется экран игры — ${e.title}`)}">▶ Играть</button><button type="button" class="lr-btn v10-btn-s v10b-add" data-b-add="${e.id}" aria-pressed="${inPlan}">${inPlan ? '✓ в плане' : '+ в план'}</button></span>
      </div>
    </article>`;
  }
  function renderBGrid() {
    const list = filtered();
    $('[data-b-count]').textContent = `Показано ${list.length} из ${EXERCISES.length}${B.cat === 'all' ? '' : ` · ${CAT_TITLE[B.cat]}`}`;
    $('[data-b-grid]').innerHTML = list.map(card).join('') || '<div class="v10b-none">Под эти фильтры ничего нет. Сбрось фильтры или выбери другую категорию.</div>';
  }
  function renderBBar() {
    const items = B.plan.map(id => EX[id]);
    const total = items.reduce((s, e) => s + e.min, 0);
    $('[data-b-bar]').innerHTML = items.length
      ? `<strong>План: ${items.length} ${plural(items.length, 'упражнение', 'упражнения', 'упражнений')} · ${total} мин</strong><span class="v10b-bar-list">${items.map(e => esc(e.title)).join(' → ')}</span><span class="v10b-bar-btns"><button type="button" class="lr-btn v10-btn-s" data-b-clear>Очистить</button><button type="button" class="lr-btn lr-btn-primary" data-toast="Демо: начнётся занятие с первого упражнения плана">Начать →</button></span>`
      : `<strong>План пуст</strong><span class="v10b-bar-list">Добавь упражнения кнопкой «+ в план» или сразу нажми «Играть».</span><span class="v10b-bar-btns"><button type="button" class="lr-btn lr-btn-primary" disabled>Начать →</button></span>`;
  }
  function renderB() {
    renderBCats(); renderBGrid(); renderBBar();
    $$('[data-b-status]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.bStatus === B.status)));
    $$('[data-b-concept]').forEach(b => b.setAttribute('aria-pressed', String(B.concepts.has(b.dataset.bConcept))));
    $('[data-b-tonic]').value = B.tonic; $('[data-b-structure]').value = B.structure; $('[data-b-sort]').value = B.sort;
  }
  root.addEventListener('click', event => {
    const t = event.target;
    const cat = t.closest('[data-b-cat]'); if (cat) { B.cat = cat.dataset.bCat; renderB(); return; }
    const st = t.closest('[data-b-status]'); if (st) { B.status = st.dataset.bStatus; renderB(); return; }
    const c = t.closest('[data-b-concept]'); if (c) { const k = c.dataset.bConcept; B.concepts.has(k) ? B.concepts.delete(k) : B.concepts.add(k); renderB(); return; }
    const add = t.closest('[data-b-add]');
    if (add) { const id = add.dataset.bAdd; B.plan = B.plan.includes(id) ? B.plan.filter(x => x !== id) : [...B.plan, id]; renderBGrid(); renderBBar(); return; }
    if (t.closest('[data-b-clear]')) { B.plan = []; renderBGrid(); renderBBar(); return; }
    if (t.closest('[data-b-reset]')) { Object.assign(B, { cat: 'all', structure: 'any', status: 'all' }); B.concepts.clear(); renderB(); }
  });
  $('[data-b-tonic]').addEventListener('change', e => { B.tonic = e.target.value; renderBGrid(); });
  $('[data-b-structure]').addEventListener('change', e => { B.structure = e.target.value; renderB(); });
  $('[data-b-sort]').addEventListener('change', e => { B.sort = e.target.value; renderBGrid(); });
  renderB();

  /* ================= C · Курс ================= */
  const step = (kind, title, status = 'todo') => ({ kind, title, status });
  const LEVELS = [
    { n: 0, title: 'Ориентация на грифе', status: 'done', done: 6, steps: [step('concept', 'Струны и лады', 'done'), step('exercise', 'Одна нота по всему грифу', 'done'), step('check', 'Найди ноту на струне', 'done'), step('concept', 'Позиция и пальцы', 'done'), step('exercise', 'Хроматика 1-2-3-4 в позиции', 'done'), step('check', 'Назови лад', 'done')] },
    { n: 1, title: 'Интервалы как формы', status: 'done', done: 6, steps: [step('concept', 'Октава как форма', 'done'), step('exercise', 'Октавы: +2 струны, +2 лада', 'done'), step('check', 'Найди октаву', 'done'), step('concept', 'Квинта и кварта', 'done'), step('exercise', 'Root–5–8', 'done'), step('check', 'Покажи квинту', 'done')] },
    { n: 2, title: 'Формы и связки', status: 'current', done: 3, steps: [step('concept', 'Форма пентатоники', 'done'), step('exercise', 'Форма пентатоники вверх-вниз', 'done'), step('check', 'Ступени формы', 'done'), step('concept', 'Общие ноты соседних форм', 'current'), step('exercise', 'Связка соседних форм'), step('check', 'Найди общие ноты')] },
    { n: 3, title: 'Арпеджио и тоны аккорда', status: 'open', done: 0, steps: [step('concept', 'Тоны аккорда 1–3–5'), step('exercise', 'Арпеджио 1–3–5–8'), step('check', 'Найди терцию'), step('concept', 'Мажор и минор в форме'), step('exercise', 'Терциями по гамме'), step('check', 'Назови тон аккорда')] },
    { n: 4, title: 'Гармония и роль баса', status: 'open', done: 0, steps: [step('concept', 'Бас держит тонику аккорда'), step('exercise', 'Паттерн по квинтовому кругу'), step('check', 'Тоника в последовательности'), step('concept', 'Та же форма — другой аккорд'), step('exercise', 'Та же форма от другой тоники'), step('check', 'Смена аккорда на слух')] },
  ];
  const RHYTHM = [
    { n: 1, title: 'Доли и счёт', status: 'done', done: 3, steps: [step('concept', 'Доля и такт', 'done'), step('exercise', 'Четверти с метрономом', 'done'), step('check', 'Сыграй на «раз»', 'done')] },
    { n: 2, title: 'Восьмые', status: 'current', done: 1, steps: [step('concept', 'Счёт «раз-и»', 'done'), step('exercise', 'Восьмые на одной ноте', 'current'), step('check', 'Восьмые с паузой')] },
    { n: 3, title: 'Синкопы', status: 'open', done: 0, steps: [step('concept', 'Акцент на «и»'), step('exercise', 'Синкопа на тонике'), step('check', 'Прочитай ритм')] },
  ];
  const KIND = { concept: 'понятие', exercise: 'упражнение', check: 'проверка' };
  const STATUS = { done: 'освоено', current: 'в работе', open: 'можно открыть' };
  const C = { sel: 'main:2' };
  function levelItem(l, lane, i) {
    const key = `${lane}:${i}`;
    const sub = l.status === 'current' ? (lane === 'main' ? `${l.done} из ${l.steps.length} · в работе` : `в работе · ${l.done}/${l.steps.length}`) : STATUS[l.status];
    return `<li class="v10c-lvl is-${l.status}"><span class="v10c-node" aria-hidden="true">${l.status === 'done' ? '✓' : esc(l.n)}</span>
      <button type="button" class="v10c-lvl-btn" data-c-lvl="${key}" aria-pressed="${C.sel === key}"><b>${esc(l.title)}</b><span>${esc(sub)}</span>${l.status === 'current' && lane === 'main' ? `<div class="lr-meter"><i style="width:${Math.round(l.done / l.steps.length * 100)}%"></i></div>` : ''}</button></li>`;
  }
  function renderC() {
    $('[data-c-main]').innerHTML = LEVELS.map((l, i) => levelItem(l, 'main', i)).join('');
    $('[data-c-side]').innerHTML = RHYTHM.map((l, i) => levelItem(l, 'side', i)).join('');
    const [lane, i] = C.sel.split(':');
    const l = (lane === 'main' ? LEVELS : RHYTHM)[Number(i)];
    const name = lane === 'main' ? `Уровень ${l.n} · ${l.title}` : `Ритм · ${l.title}`;
    const action = l.status === 'open' ? `<button type="button" class="lr-btn v10-btn-s" data-toast="${esc(`Демо: откроется первый шаг — ${l.steps[0].title}`)}">Открыть уровень</button>`
      : l.status === 'done' ? `<button type="button" class="lr-btn v10-btn-s" data-toast="${esc(`Демо: повторение уровня «${l.title}»`)}">Повторить</button>` : '';
    $('[data-c-level]').innerHTML = `<div class="v10c-level-head"><h2>${esc(name)}</h2><span class="v10-head-side"><span>${l.status === 'current' ? `${l.done} из ${l.steps.length} шагов` : esc(STATUS[l.status])}</span>${action}</span></div>
      <ol class="v10c-strip">${l.steps.map(s => `<li class="v10c-st is-${s.status} k-${s.kind}"><small>${KIND[s.kind]}</small><span>${esc(s.title)}</span></li>`).join('')}</ol>`;
  }
  root.addEventListener('click', event => {
    const lvl = event.target.closest('[data-c-lvl]'); if (lvl) { C.sel = lvl.dataset.cLvl; renderC(); }
    if (!event.target.closest('[data-c-search]')) $('[data-c-results]').classList.remove('is-open');
    const hit = event.target.closest('[data-c-hit]');
    if (hit) { toast(`Демо: откроется «${hit.dataset.cHit}»`); $('[data-c-results]').classList.remove('is-open'); }
  });
  const SEARCHABLE = [
    ...EXERCISES.map(e => ({ title: e.title, kind: 'упражнение' })),
    ...[...new Set([...LEVELS, ...RHYTHM].flatMap(l => l.steps.filter(s => s.kind === 'concept').map(s => s.title)))].map(t => ({ title: t, kind: 'понятие' })),
  ];
  const q = $('[data-c-q]'), results = $('[data-c-results]');
  function search() {
    const text = q.value.trim().toLowerCase();
    if (!text) { results.classList.remove('is-open'); return; }
    const hits = SEARCHABLE.filter(x => x.title.toLowerCase().includes(text)).slice(0, 7);
    results.innerHTML = hits.length ? hits.map(h => `<button type="button" role="option" data-c-hit="${esc(h.title)}"><span>${esc(h.title)}</span><small>${esc(h.kind)}</small></button>`).join('') : '<p>Ничего не нашлось — попробуй «форма», «октава» или «доля».</p>';
    results.classList.add('is-open');
  }
  q.addEventListener('input', search);
  q.addEventListener('focus', search);
  q.addEventListener('keydown', e => { if (e.key === 'Escape') { results.classList.remove('is-open'); } });
  renderC();
})();
</script>
