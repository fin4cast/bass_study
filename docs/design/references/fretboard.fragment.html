  if(saved&&typeof saved==='object')for(const key of Object.keys(state))if(saved[key]&&typeof saved[key]==='object')Object.assign(state[key],saved[key]);
  state.workshop.root=state.workshop.root==='C'?'C':'A';state.workshop.scope=state.workshop.scope==='all'?'all':'form';state.workshop.labels=state.workshop.labels==='degrees'?'degrees':'notes';state.guided.step=Number.isInteger(state.guided.step)?Math.max(0,Math.min(3,state.guided.step)):0;if(!['same','octave','fifth'].includes(state.atlas.relation))state.atlas.relation='octave';
  const stages=[{title:'Найди опору формы',short:'Тоника',copy:'Две ноты A в этой форме звучат в разных октавах. Выбери каждую и сравни её положение.',target:'D:7',from:'A1',to:'A2',distance:'+12 полутонов',why:'Одна нота A · разные октавы',ids:['E:5','D:7']},{title:'Увидь малую терцию',short:'Малая терция',copy:'От A до C — три полутона. На одной струне это расстояние в три лада.',target:'E:8',from:'A1',to:'C2',distance:'+3 полутона',why:'Ступени 1 → ♭3',ids:['E:5','E:8']},{title:'Свяжи тонику и квинту',short:'Квинта',copy:'От A1 до E2 — семь полутонов. Здесь квинта находится на соседней струне.',target:'A:7',from:'A1',to:'E2',distance:'+7 полутонов',why:'Ступени 1 → 5',ids:['E:5','A:7']},{title:'Собери всю форму',short:'Вся форма',copy:'Исследуй восемь позиций. Полоса внизу связывает ноты, ступени и расстояния между ними.',target:null,from:'A1',to:'D3',distance:'8 позиций',why:'Форма A · лады 5–8',ids:null}];
  function info(string,fret,rootName='A',finger=null){const midi=open[string]+fret;const pc=rootName==='C'?0:9;const offset=(midi-pc+120)%12;const i=intervals.indexOf(offset);return{id:string+':'+fret,string,fret,midi,note:names[midi%12]+(Math.floor(midi/12)-1),pitch:names[midi%12],degree:i<0?'':degrees[i],degreeName:i<0?'Вне гаммы':degreeNames[i],finger};}
  function material(rootName='A'){const shift=rootName==='C'?3:0;return base.map(([s,f,finger])=>info(s,f+shift,rootName,finger));}
  function full(rootName='A'){return Object.keys(open).flatMap(s=>Array.from({length:13},(_,f)=>info(s,f,rootName))).filter(n=>n.degree);}
  function persist(){window.openai?.setWidgetState?.({modelContent:{screen:'VIS-01',candidates:['Мастерская','Пошаговое изучение','Атлас связей']},privateContent:state})?.catch(()=>{});}
  function chrome(id){return '<header class="fv-chrome"><span class="fv-brand">bass<span>.</span>study</span><nav class="fv-nav" aria-label="Разделы приложения"><strong aria-current="page">Гриф</strong><span>Слух</span><span>Играть</span><span>Занятия</span></nav><span class="fv-review">'+id+' · на рассмотрении</span></header>';}
  function board({rootName='A',scope='form',selected='E:5',labels='notes',fingers=false,highlight=null,related=[],target=null,atlas=false,compact=false}){
    const shift=rootName==='C'?3:0;const min=scope==='all'?0:5+shift,max=scope==='all'?12:8+shift;const notes=scope==='all'?full(rootName):material(rootName);const frets=Array.from({length:max-min+1},(_,i)=>i+min);const wide=scope==='all';
    return '<div class="fv-board '+(wide?'fv-board-wide':'')+'" style="--fv-cols:'+frets.length+'" role="group" aria-label="Гриф G D A E, лады '+min+'–'+max+'"><div class="fv-axis"><span></span>'+frets.map(f=>'<span>'+((!wide||f%2===0||f===5||f===7||f===9)?f:'')+'</span>').join('')+'</div>'+['G','D','A','E'].map((s,row)=>'<div class="fv-string"><span class="fv-string-name">'+s+'</span><div class="fv-cells" style="--fv-string-size:'+(1+row*.35)+'px">'+frets.map(f=>{const n=notes.find(n=>n.string===s&&n.fret===f);const reg=atlas&&f>=5&&f<=8;return '<div class="fv-cell '+(reg?'fv-region ':'')+(atlas&&f===5?'fv-region-edge':'')+'">'+(n?'<button type="button" class="fv-note '+(n.degree==='1'?'fv-root ':'')+(n.id===selected?'fv-selected ':'')+(related.includes(n.id)?'fv-related ':'')+(n.id===target?'fv-target ':'')+(highlight&&!highlight.includes(n.id)&&n.id!==selected?'fv-dim':'')+'" data-note="'+n.id+'" aria-label="'+n.note+', '+n.degreeName+', струна '+s+', лад '+f+'" aria-pressed="'+(n.id===selected)+'">'+(labels==='degrees'?n.degree:n.pitch)+(fingers&&n.finger?'<span class="fv-finger">'+n.finger+'</span>':'')+'</button>':'')+'</div>';}).join('')+'</div></div>').join('')+'</div>';
  }
  function chain(selected='1',rootName='A'){const pitch=rootName==='C'?['C','E♭','F','G','B♭','C']:['A','C','D','E','G','A'];const dg=['1','♭3','4','5','♭7','1'];const semis=[0,3,5,7,10,12];return '<div class="fv-scale-chain" role="img" aria-label="Минорная пентатоника: ступени 1, малая терция, кварта, квинта, малая септима; расстояния 3, 2, 2, 3, 2 полутона"><span class="fv-scale-line"></span>'+semis.map((x,i)=>'<div class="fv-scale-point '+(dg[i]===selected?'fv-current':'')+'" style="left:'+(x/12*100)+'%"><strong>'+pitch[i]+'</strong><small>'+dg[i]+'</small></div>').join('')+[3,2,2,3,2].map((x,i)=>'<span class="fv-distance" style="left:'+((semis[i]+semis[i+1])/24*100)+'%">'+x+'</span>').join('')+'</div>';}
  function overview(min=5,max=8){return '<div class="fv-overview"><div class="fv-section-label"><span>Область на полном грифе</span><span>'+min+'–'+max+'</span></div><div class="fv-neckmap" role="img" aria-label="Выбраны лады '+min+'–'+max+' на полном грифе 0–24">'+Array.from({length:25},(_,i)=>'<span class="'+(i>=min&&i<=max?'fv-active':'')+'"></span>').join('')+'</div><div class="fv-overview-axis"><span>0</span><span>12</span><span>24</span></div></div>';}
  function workshop(){const app=root.querySelector('[data-design="workshop"]');const s=state.workshop;const list=s.scope==='all'?full(s.root):material(s.root);let n=list.find(n=>n.id===s.selected);if(!n){n=material(s.root)[0];s.selected=n.id;}const min=s.root==='C'?8:5;app.innerHTML=chrome('VIS-01-A')+'<div class="fv-work-layout '+(!s.panel?'fv-closed':'')+'"><main class="fv-work-main"><div class="fv-heading"><div><span class="fv-kicker">СВОБОДНОЕ ИЗУЧЕНИЕ</span><h2>'+s.root+' · Минорная пентатоника</h2><p class="fv-subtitle">'+(s.scope==='form'?'Форма A · лады '+min+'–'+(min+3):'Свободная карта · лады 0–12')+'</p></div><button type="button" class="fv-button" data-action="panel" aria-expanded="'+s.panel+'">'+(s.panel?'Свернуть параметры':'Параметры')+'</button></div><div class="fv-toolbar"><div class="fv-group" aria-label="Подписи грифа"><button type="button" data-label="notes" aria-pressed="'+(s.labels==='notes')+'">Ноты</button><button type="button" data-label="degrees" aria-pressed="'+(s.labels==='degrees')+'">Ступени</button></div><span class="fv-toolbar-label">Выбери позицию на грифе</span></div>'+board({rootName:s.root,scope:s.scope,selected:s.selected,labels:s.labels,fingers:s.fingers})+'<div class="fv-position" aria-live="polite"><span class="fv-position-value">'+n.note+'</span><div class="fv-position-copy"><strong>'+n.degreeName+'</strong><span class="fv-muted">Струна '+n.string+' · лад '+n.fret+'</span></div><button type="button" class="fv-text-button fv-position-action" data-action="links" aria-expanded="'+s.links+'">'+(s.links?'Скрыть связи':'Связи ноты ↗')+'</button></div>'+(s.links?'<p class="fv-notice">'+(s.root==='A'&&n.id==='E:5'?'A2 на D/7 — другая октава. Та же высота A1 на A/0 находится вне формы.':'Ступень '+n.degree+' относится к тонике '+s.root+'. Одинаковое имя ноты может обозначать разные октавы.')+'</p>':'')+'<div class="fv-scale-panel"><div class="fv-section-label"><span>Ноты и ступени</span><span>Расстояния — в полутонах</span></div>'+chain(n.degree,s.root)+'</div>'+overview(s.scope==='all'?0:min,s.scope==='all'?12:min+3)+'<div class="fv-work-footer"><span>Свободное исследование · без зачёта</span><button type="button" class="fv-text-button" data-action="focus">'+(s.panel?'Освободить рабочее поле':'Вернуть параметры')+'</button></div></main><aside class="fv-settings" aria-label="Параметры материала"><h3>Материал</h3><label class="fv-field"><span class="fv-field-label">Тоника</span><select data-control="root" aria-label="Тоника"><option value="A" '+(s.root==='A'?'selected':'')+'>A · ля</option><option value="C" '+(s.root==='C'?'selected':'')+'>C · до</option></select></label><div class="fv-field"><span class="fv-field-label">Гамма</span><span class="fv-value">Минорная пентатоника</span></div><div class="fv-field"><span class="fv-field-label">Область</span><div class="fv-group"><button type="button" data-scope="form" aria-pressed="'+(s.scope==='form')+'">Форма A</button><button type="button" data-scope="all" aria-pressed="'+(s.scope==='all')+'">0–12</button></div></div><div class="fv-rule"></div><h3>Отображение</h3><label class="fv-check"><input type="checkbox" data-control="fingers" '+(s.fingers?'checked':'')+(s.scope==='all'?' disabled':'')+'><span>Номера пальцев'+(s.scope==='all'?' · только в форме':'')+'</span></label><details class="fv-details"><summary>Ступени и пальцы</summary><p>Круг показывает ноту или ступень. Маленькая отдельная цифра — рекомендуемый палец.</p></details><details class="fv-details"><summary>Как устроена форма A</summary><p>Это форма локального учебного каталога bass.study. Начальная нота — тоника. Форма содержит восемь позиций. Для тоники '+s.root+' это лады '+min+'–'+(min+3)+'.</p></details><div class="fv-rule"></div><span class="fv-field-label">Текущий контекст</span><p class="fv-value" style="margin-top:8px">4 струны · '+list.length+' позиций</p><p class="fv-notice">Параметры доступны рядом с инструментом и сворачиваются целиком.</p></aside></div>';}
  function guided(){const app=root.querySelector('[data-design="guided"]');const s=state.guided;const st=stages[s.step];const n=material().find(n=>n.id===s.selected)||material()[0];app.innerHTML=chrome('VIS-01-B')+'<div class="fv-guide-layout"><nav class="fv-steps" aria-label="Шаги изучения"><span class="fv-steps-title">РАЗБЕРИ ФОРМУ</span>'+stages.map((st,i)=>'<button type="button" class="fv-step" data-step="'+i+'" aria-pressed="'+(s.step===i)+'"><span>'+(i+1)+'</span>'+st.short+'</button>').join('')+'<p class="fv-steps-note">A · минорная пентатоника<br>Форма A · лады 5–8<br><br>Четыре шага просмотра.<br>Ответы не оцениваются.</p></nav><main class="fv-guide-main"><div class="fv-guide-material"><span class="fv-tag">A</span><span>Минорная пентатоника · форма A</span><button type="button" class="fv-text-button" data-action="material" aria-expanded="'+s.material+'">Контекст</button></div>'+(s.material?'<div class="fv-guide-extra"><p class="fv-notice">Струны G–D–A–E, лады 5–8. На всех четырёх шагах сохраняется одна форма. Смена материала — отдельное действие будущего экрана.</p></div>':'')+'<span class="fv-kicker">ШАГ '+(s.step+1)+' ИЗ 4</span><h2>'+st.title+'</h2><p class="fv-guide-prompt">'+st.copy+'</p>'+board({selected:n.id,highlight:st.ids,related:s.connection&&st.target?[st.target]:[]})+'<div class="fv-position" aria-live="polite"><span class="fv-position-value">'+n.note+'</span><div class="fv-position-copy"><strong>'+n.degreeName+'</strong><span class="fv-muted">Струна '+n.string+' · лад '+n.fret+'</span></div></div>'+(s.step===3?'<div class="fv-scale-panel"><div class="fv-section-label"><span>Пять ступеней · восемь позиций</span><span>Полутоны</span></div>'+chain(n.degree)+'</div>':s.connection?'<div class="fv-connection-strip"><div><div class="fv-big-note">'+st.from+'</div><div class="fv-note-caption">Опора</div></div><div class="fv-relation-arrow">'+st.distance+'<span></span></div><div><div class="fv-big-note">'+st.to+'</div><div class="fv-note-caption">'+st.why+'</div></div></div>':'<p class="fv-guide-status">Выбери ноту на грифе или раскрой связь с опорой.</p>')+'<div class="fv-guide-controls"><button type="button" class="fv-button" data-action="back" '+(s.step===0?'disabled':'')+'>← Назад</button>'+(s.step!==3?'<button type="button" class="fv-text-button" data-action="connection" aria-expanded="'+s.connection+'">'+(s.connection?'Скрыть связь':'Показать связь')+'</button>':'<span class="fv-muted" style="font-size:12px">Все ноты открыты</span>')+'<button type="button" class="fv-button fv-primary" data-action="next">'+(s.step===3?'К началу':'Далее →')+'</button></div><div class="fv-guide-status">Переходы свободные. Шаги показывают ход изучения, а не уровень владения басом.</div></main></div>';}
  function atlasData(){const r=state.atlas.relation;const all=full();const midi=r==='same'?33:r==='octave'?45:40;return{title:r==='same'?'Та же высота':r==='octave'?'Октава':'Квинта',distance:r==='same'?'0 полутонов':r==='octave'?'+12 полутонов':'+7 полутонов',copy:r==='same'?'A1 на открытой струне A звучит на той же высоте, что A1 на пятом ладу E. Открытая A находится вне выбранной формы.':r==='octave'?'A2 — та же нота в следующей октаве. В области 0–12 у неё три позиции; одна входит в выбранную форму.':'E2 — квинта выше A1. В области 0–12 её можно найти на трёх струнах.',targets:all.filter(n=>n.midi===midi&&n.id!=='E:5')};}
  function atlas(){const app=root.querySelector('[data-design="atlas"]');const s=state.atlas;const d=atlasData();let target=d.targets.find(n=>n.id===s.target)||d.targets[0];s.target=target.id;const related=d.targets.map(n=>n.id);app.innerHTML=chrome('VIS-01-C')+'<main class="fv-atlas-main"><div class="fv-heading"><div><span class="fv-kicker">АТЛАС МУЗЫКАЛЬНЫХ СВЯЗЕЙ</span><h2>Связи A1 на грифе</h2><p class="fv-subtitle">Опора E/5 · минорная пентатоника · форма A</p></div><div class="fv-group" aria-label="Подписи карты"><button type="button" data-label="notes" aria-pressed="'+(s.labels==='notes')+'">Ноты</button><button type="button" data-label="degrees" aria-pressed="'+(s.labels==='degrees')+'">Ступени</button></div></div><div class="fv-relation-menu" aria-label="Музыкальная связь">'+[['same','Та же высота'],['octave','Октава'],['fifth','Квинта']].map(([id,label])=>'<button type="button" data-relation="'+id+'" aria-pressed="'+(s.relation===id)+'">'+label+'</button>').join('')+'</div><div class="fv-atlas-layout"><section class="fv-local-board" aria-label="Текущая форма"><div class="fv-section-label"><span>Выбранная форма A</span><span>Лады 5–8</span></div>'+board({selected:'E:5',labels:s.labels,related:related,highlight:['E:5',...related]})+'</section><aside class="fv-inspector" aria-live="polite"><span class="fv-kicker">'+d.distance+'</span><h3>'+d.title+'</h3><div class="fv-inspector-pair">A1<span>→</span>'+target.note+'</div><p>'+d.copy+'</p><div class="fv-linked-list">'+d.targets.map(n=>'<button type="button" data-target="'+n.id+'" aria-pressed="'+(target.id===n.id)+'">'+n.string+'/'+n.fret+' · '+n.note+'</button>').join('')+'</div></aside></div><section class="fv-map-section" aria-label="Обзор связей на ладах 0–12"><div class="fv-section-label"><span>Обзор связей · лады 0–12</span><span>Учебная форма остаётся 5–8</span></div>'+board({scope:'all',selected:'E:5',labels:s.labels,related:related,target:target.id,highlight:['E:5',...related],atlas:true})+'<div class="fv-map-legend"><span><i class="fv-dot"></i>Опора A1</span><span><i class="fv-dot fv-blue-dot"></i>'+d.title+'</span><span>Полоса 5–8 — выбранная форма</span></div><p class="fv-diagram-note">Обзор показывает позиции за пределами формы. Он не меняет материал занятия.</p><p class="fv-notice" data-atlas-notice></p></section></main>';}
  function render(which){if(!which||which==='workshop')workshop();if(!which||which==='guided')guided();if(!which||which==='atlas')atlas();}
  root.addEventListener('click',event=>{const app=event.target.closest('[data-design]');const button=event.target.closest('button');if(!app||!button)return;const kind=app.dataset.design;const s=state[kind];const action=button.dataset.action;
    if(kind==='workshop'){if(button.dataset.note)s.selected=button.dataset.note;if(button.dataset.label)s.labels=button.dataset.label;if(button.dataset.scope){s.scope=button.dataset.scope;s.selected=material(s.root)[0].id;}if(action==='panel'||action==='focus')s.panel=!s.panel;if(action==='links')s.links=!s.links;}
    if(kind==='guided'){if(button.dataset.note)s.selected=button.dataset.note;if(button.dataset.step!==undefined){s.step=Number(button.dataset.step);s.connection=false;s.selected='E:5';}if(action==='next'){s.step=(s.step+1)%4;s.connection=false;s.selected='E:5';}if(action==='back'){s.step=Math.max(0,s.step-1);s.connection=false;s.selected='E:5';}if(action==='connection')s.connection=!s.connection;if(action==='material')s.material=!s.material;}
    if(kind==='atlas'){if(button.dataset.label)s.labels=button.dataset.label;if(button.dataset.relation){s.relation=button.dataset.relation;s.target='';}if(button.dataset.target)s.target=button.dataset.target;if(button.dataset.note){const id=button.dataset.note;const d=atlasData();if(d.targets.some(n=>n.id===id))s.target=id;else{const notice=app.querySelector('[data-atlas-notice]');notice.textContent=id==='E:5'?'A1 на E/5 остаётся опорой сравнения.':'Эта позиция не относится к выбранной связи с A1. Выбери синюю ноту или другую связь.';return;}}}
    const focusKey=['note','action','label','scope','step','relation','target'].find(key=>button.dataset[key]!==undefined);const focusValue=focusKey?button.dataset[focusKey]:null;render(kind);if(focusKey)app.querySelector('button[data-'+focusKey+'="'+focusValue+'"]:not(:disabled)')?.focus({preventScroll:true});persist();
  });
  root.addEventListener('change',event=>{const app=event.target.closest('[data-design]');if(!app||app.dataset.design!=='workshop')return;if(event.target.dataset.control==='root'){state.workshop.root=event.target.value;state.workshop.selected=material(event.target.value)[0].id;}if(event.target.dataset.control==='fingers')state.workshop.fingers=event.target.checked;workshop();app.querySelector('[data-control="'+event.target.dataset.control+'"]')?.focus({preventScroll:true});persist();});
  window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent;if(next){for(const key of Object.keys(state))if(next[key]&&typeof next[key]==='object')Object.assign(state[key],next[key]);render();}});
  render();
  if(globalThis.Tweak){const controls=new Tweak({container:root.querySelector('[data-design="workshop"]'),onChange:()=>workshop()});controls.addToggle(state.workshop,'panel',{label:'Панель параметров'});controls.addToggle(state.workshop,'fingers',{label:'Пальцы'});}
})();
</script>
