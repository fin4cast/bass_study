  <style>
    #bass-large-accent-clean{--page-bg:#1c2420;--sidebar-bg:#202c25;--divider:#405546;--nav-text:#bcc8b7;--nav-hover:#27382b;--strong-text:#eef2e9;--focus:#bad1a4;--theme-selected:#27362e;--scene-image:var(--scene-dark)}
    #bass-large-accent-clean[data-theme="light"]{--page-bg:#fafaf7;--sidebar-bg:#f0f2ec;--divider:#d6dfd0;--nav-text:#536050;--nav-hover:#e7ece1;--strong-text:#24452e;--focus:#355e44;--theme-selected:#fff;--scene-image:var(--scene-light)}
    #bass-large-accent-clean .bass-preview{position:relative;width:100%;aspect-ratio:1440/1300;overflow:hidden;background:var(--page-bg)}
    #bass-large-accent-clean .bass-scene{position:absolute;left:0;top:0;width:1440px;height:1300px;transform-origin:0 0;transform:scale(var(--fit,1));background:var(--page-bg) var(--scene-image) 0 0/1440px 1300px no-repeat;font-family:"Segoe UI",Arial,sans-serif;color:var(--nav-text)}
    #bass-large-accent-clean .bass-middle{position:absolute;left:25px;top:424px;width:189px;height:734px;background:var(--sidebar-bg);overflow:hidden}
    #bass-large-accent-clean .bass-divider{position:absolute;left:15px;top:18px;width:160px;height:1px;background:var(--divider)}
    #bass-large-accent-clean .bass-utility{position:absolute;left:15px;top:34px;width:160px;display:flex;flex-direction:column;gap:4px}
    #bass-large-accent-clean .bass-utility button{box-sizing:border-box;display:block;width:160px;height:42px;padding:0 12px;border:0;background:transparent;text-align:left;color:var(--nav-text);font:400 13px/1.4 "Segoe UI",Arial,sans-serif;border-radius:6px}
    #bass-large-accent-clean .bass-utility button:hover{background:var(--nav-hover);color:var(--strong-text)}
    #bass-large-accent-clean button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
    #bass-large-accent-clean .bass-photo-window{position:absolute;left:0;top:128px;width:189px;height:603px;overflow:hidden;background:var(--sidebar-bg);isolation:isolate;mask-image:linear-gradient(to bottom,#000 0,#000 89%,transparent 99%)}
    #bass-large-accent-clean .bass-photo{position:absolute;left:0;top:0;width:960px;height:960px;transform-origin:0 0;filter:url(#bass-large-accent-clean-tone);mask-image:linear-gradient(to top,transparent 0,#000 140px);mask-size:960px 960px;mask-repeat:no-repeat}
    #bass-large-accent-clean .bass-photo::before{content:"";position:absolute;left:261.36px;top:0;width:437.28px;height:960px;background:var(--photo-image) 0 0/100% 100% no-repeat;mask-image:var(--photo-mask);mask-size:100% 100%;mask-repeat:no-repeat}
    #bass-large-accent-clean[data-theme="light"] .bass-photo{mix-blend-mode:multiply}
    #bass-large-accent-clean .bass-theme{position:absolute;left:40px;top:1185px;width:160px;height:40px;box-sizing:border-box;padding:3px;display:flex;align-items:stretch;gap:3px;background:var(--sidebar-bg);border:1px solid var(--divider);border-radius:8px}

  <div class="bass-preview">
    <div class="bass-scene" aria-label="Экран изучения грифа с крупной фотографией баса внизу боковой панели">
      <div class="bass-middle">
        <div class="bass-divider"></div>
        <nav class="bass-utility" aria-label="Дополнительные разделы"><button type="button">Мои занятия</button><button type="button">Введение</button></nav>
        <div class="bass-photo-window" role="img" aria-label="Крупный акцент: настоящее фото четырёхструнного баса. Головка и четыре колка целиком."><div class="bass-photo"></div></div>
      </div>
      <div class="bass-theme" role="group" aria-label="Тема оформления">
        <button type="button" data-theme-choice="light" aria-pressed="false">Светлая</button>
        <button type="button" data-theme-choice="dark" aria-pressed="true">Тёмная</button>
      </div>
    </div>
  </div>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs><filter id="bass-large-accent-clean-tone" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values=".68"/><feComponentTransfer><feFuncR type="gamma" amplitude="1" exponent="1.16" offset="0"/><feFuncG type="gamma" amplitude="1" exponent="1.16" offset="0"/><feFuncB type="gamma" amplitude="1" exponent="1.16" offset="0"/></feComponentTransfer></filter></defs></svg>
  <script>
    (()=>{
      const root=document.getElementById('bass-large-accent-clean');
      const photo=root.querySelector('.bass-photo');
      const photoWindow=root.querySelector('.bass-photo-window');
      const choices=[...root.querySelectorAll('[data-theme-choice]')];
      const state={scale:.61,angle:4,nutX:125,nutY:945};
      function place(){
        const radians=state.angle*Math.PI/180;
        const tx=state.nutX-25-state.scale*(Math.cos(radians)*520-Math.sin(radians)*600);
        const ty=state.nutY-552-state.scale*(Math.sin(radians)*520+Math.cos(radians)*600);
        photo.style.transform=`translate(${tx}px,${ty}px) rotate(${state.angle}deg) scale(${state.scale})`;
      }
      function setTheme(theme,save=false){
        if(theme!=='light'&&theme!=='dark')return;
        root.dataset.theme=theme;
        choices.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.themeChoice===theme)));
        if(save&&window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{variant:'Крупный акцент',theme},privateContent:{theme}}).catch(()=>{});
      }
      choices.forEach(button=>button.addEventListener('click',()=>setTheme(button.dataset.themeChoice,true)));
      const saved=window.openai?.widgetState;
      setTheme(saved?.privateContent?.theme||saved?.modelContent?.theme||'dark');
      window.addEventListener('openai:set_globals',event=>{
        const saved=event.detail?.globals?.widgetState;
        if(saved)setTheme(saved.privateContent?.theme||saved.modelContent?.theme);
      });
      function fit(){const width=root.getBoundingClientRect().width;root.style.setProperty('--fit',String(width/(width<=600?230:1440)));}
      new ResizeObserver(fit).observe(root);
      place();fit();
      if(globalThis.Tweak){
        const tweak=new Tweak({container:photoWindow,onChange:place});
        tweak.addSlider(state,'nutY',{label:'Положение фото по вертикали',min:915,max:975,step:5,unit:'px'});
        tweak.addSlider(state,'scale',{label:'Масштаб фото',min:.57,max:.61,step:.01});
      }
    })();
  </script>
</div>
