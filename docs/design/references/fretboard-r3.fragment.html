<style>

  @media(max-width:620px){#fretboard-readable-study .m2-app{min-height:1660px;}#fretboard-readable-study .m2-layout,#fretboard-readable-study .m2-layout.is-closed{grid-template-columns:minmax(0,1fr);min-height:1658px;}#fretboard-readable-study .m2-nav{padding:16px;gap:14px;flex-direction:row;align-items:center;flex-wrap:wrap;}#fretboard-readable-study .m2-nav-section{flex-direction:row;gap:2px;flex-wrap:wrap;}#fretboard-readable-study .m2-nav-caption,#fretboard-readable-study .m2-nav-bottom{display:none;}#fretboard-readable-study .m2-nav-item{padding:6px 7px;border-left:0;border-bottom:2px solid transparent;}#fretboard-readable-study .m2-nav-current{border-bottom-color:var(--m2-accent);}#fretboard-readable-study .m2-main{padding:22px 16px;}#fretboard-readable-study .m2-settings{border-left:0;border-top:1px solid var(--m2-line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 18px;padding:22px 18px;}#fretboard-readable-study .m2-settings h3,#fretboard-readable-study .m2-settings .m2-divider,#fretboard-readable-study .m2-settings details{grid-column:1/-1;margin:0;}#fretboard-readable-study .m2-settings .m2-field{margin:0;}#fretboard-readable-study .m2-board-caption{font-size:11px;}#fretboard-readable-study .m2-coordinate{margin-left:0;}#fretboard-readable-study .m2-selection{flex-wrap:wrap;}#fretboard-readable-study .m2-pitch-strip{gap:2px;}#fretboard-readable-study .m2-pitch{min-width:20px;font-size:14px;}#fretboard-readable-study .m2-pitch-distance{font-size:10px;}#fretboard-readable-study .m2-modes{gap:11px;flex-wrap:wrap;}#fretboard-readable-study .m2-layout.is-closed .m2-settings{display:none;}#fretboard-readable-study .m2-link-label{display:none;}}

  @media(max-width:850px) and (min-width:621px){#fretboard-readable-study .m2-layout{grid-template-columns:118px minmax(0,1fr);}#fretboard-readable-study .m2-nav{grid-row:1/3;}#fretboard-readable-study .m2-settings{grid-column:2;border-left:0;border-top:1px solid var(--m2-line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}#fretboard-readable-study .m2-settings h3,#fretboard-readable-study .m2-settings .m2-divider,#fretboard-readable-study .m2-settings details{grid-column:1/-1;}#fretboard-readable-study .m2-layout.is-closed .m2-settings{display:none;}}

<script>
(() => {
  const root=document.getElementById('fretboard-readable-study');
  const strings=['G','D','A','E'];
  const open={G:43,D:38,A:33,E:28};
  const notes=[['E',5,'A1','1',1],['E',8,'C2','♭3',4],['A',5,'D2','4',1],['A',7,'E2','5',3],['D',5,'G2','♭7',1],['D',7,'A2','1',3],['G',5,'C3','♭3',1],['G',7,'D3','4',3]].map(([string,fret,note,degree,finger])=>({id:string+':'+fret,string,fret,note,degree,finger,midi:open[string]+fret}));
  const degreeNames={'1':'Тоника','♭3':'Малая терция','4':'Кварта','5':'Квинта','♭7':'Малая септима'};
  const intervalNames={0:'Тоника',3:'Малая терция',5:'Кварта',7:'Квинта',10:'Малая септима',12:'Октава',15:'Малая терция через октаву',17:'Кварта через октаву'};
  const state=Object.fromEntries(['precise','instrument','connections'].map(mode=>[mode,{selected:'A:7',labels:'notes',panel:true,fingers:false,finger:'all',strings:[...strings],links:true,range:'0:12'}]));
  const saved=window.openai?.widgetState?.privateContent;if(saved?.revision==='r3')for(const key of Object.keys(state))if(saved[key])Object.assign(state[key],saved[key]);
  for(const s of Object.values(state)){s.range=['0:5','0:12','0:24','5:8'].includes(s.range)?s.range:'0:12';s.strings=Array.isArray(s.strings)?s.strings.filter(x=>strings.includes(x)):[...strings];if(!notes.some(n=>n.id===s.selected))s.selected='A:7';s.labels=s.labels==='degrees'?'degrees':'notes';}
  const observed=new WeakMap();
  function persist(){window.openai?.setWidgetState?.({modelContent:{screen:'VIS-01',base:'Мастерская',revision:'r3',fretboard:'весь выбранный диапазон, по умолчанию0–12; четыре струны; крупные ноты'},privateContent:{revision:'r3',...state}})?.catch(()=>{});}
  function menu(){return '<nav class="m2-nav" aria-label="Разделы приложения"><span class="m2-brand">bass<span>.</span>study</span><div class="m2-nav-section"><span class="m2-nav-caption">ПРАКТИКА</span><span class="m2-nav-item m2-nav-current" aria-current="page">Гриф</span><span class="m2-nav-item">Слух</span><span class="m2-nav-item">Играть</span><span class="m2-nav-item">Занятия</span></div><div class="m2-nav-section m2-nav-bottom"><span class="m2-nav-item">Инструменты</span><span class="m2-nav-item">Помощь</span></div></nav>';}
  function pitchStrip(selected){return '<div class="m2-pitch-strip" role="img" aria-label="Минорная пентатоника A: 1, малая терция, кварта, квинта, малая септима; промежутки 3, 2, 2, 3, 2 полутона">'+[['A','1'],['C','♭3'],['D','4'],['E','5'],['G','♭7'],['A','1']].map(([n,d],i)=>'<span class="m2-pitch '+(selected.degree===d?'is-current':'')+'">'+n+'<small>'+d+'</small></span>'+(i<5?'<span class="m2-pitch-distance">'+[3,2,2,3,2][i]+'</span>':'')).join('')+'</div>';}
  function detail(mode,s,n){if(mode==='instrument')return '<div class="m2-detail-row"><span class="m2-detail-label">Аппликатура по пальцам</span><div class="m2-switch" aria-label="Выделить палец">'+['all','1','3','4'].map(f=>'<button type="button" data-finger="'+f+'" aria-pressed="'+(s.finger===f)+'">'+(f==='all'?'Все':f)+'</button>').join('')+'</div></div>';if(mode==='connections')return '<div class="m2-detail-row"><span class="m2-detail-label">Связь с A1 на E/5</span><div class="m2-switch" aria-label="Рассмотреть связь">'+[['E:8','Терция'],['A:7','Квинта'],['D:7','Октава']].map(([id,label])=>'<button type="button" data-link-note="'+id+'" aria-pressed="'+(s.selected===id)+'">'+label+'</button>').join('')+'</div></div><div class="m2-detail-row" style="margin-top:5px;min-height:24px"><span class="m2-interval">A1 → '+n.note+'</span><span class="m2-detail-label">'+intervalNames[n.midi-33]+' · '+(n.midi===33?'0':'+'+(n.midi-33))+' полутонов</span></div>';return '<div class="m2-detail-row"><span class="m2-detail-label">Выбранные лады '+s.range.replace(':','–')+' · маркеры формы 5–8</span><span class="m2-detail-label">Струны и лады остаются на месте</span></div>';}
  const observer=new ResizeObserver(entries=>{for(const entry of entries){const width=Math.round(entry.contentRect.width);if(width<1||observed.get(entry.target)===width)continue;observed.set(entry.target,width);draw(entry.target,width);}});
  function render(mode){const app=root.querySelector('[data-version="'+mode+'"]');const s=state[mode];let n=notes.find(n=>n.id===s.selected);const visible=notes.filter(n=>s.strings.includes(n.string)&&n.fret>=Number(s.range.split(':')[0])&&n.fret<=Number(s.range.split(':')[1]));if(visible.length&&!visible.some(p=>p.id===n.id)){n=visible[0];s.selected=n.id;}
    const lastArea=app.querySelector('.m2-board-area');if(lastArea)observer.unobserve(lastArea);
    app.innerHTML='<div class="m2-layout '+(!s.panel?'is-closed':'')+'">'+menu()+'<main class="m2-main"><div class="m2-heading"><div><span class="m2-kicker">ГРИФ · СВОБОДНОЕ ИЗУЧЕНИЕ</span><h2>A · Минорная пентатоника</h2><p class="m2-subtitle">Форма A · материал на ладах 5–8</p></div><button type="button" class="m2-button" data-action="panel" aria-expanded="'+s.panel+'">'+(s.panel?'Свернуть параметры':'Параметры')+'</button></div><div class="m2-modes"><span class="m2-mode m2-mode-current">Изучение</span><span class="m2-mode">Задания</span><span class="m2-mode">Последовательности</span></div><div class="m2-board-toolbar"><span class="m2-board-caption">E–A–D–G · лады '+s.range.replace(':','–')+'</span><div class="m2-switch" aria-label="Подписи на грифе"><button type="button" data-label="notes" aria-pressed="'+(s.labels==='notes')+'">Ноты</button><button type="button" data-label="degrees" aria-pressed="'+(s.labels==='degrees')+'">Ступени</button></div></div><div class="m2-board-area" data-mode="'+mode+'" aria-label="Гриф 0–24, четыре струны G D A E"></div><div class="m2-legend"><span><i class="m2-swatch"></i>Тоника</span><span><i class="m2-swatch m2-swatch-note"></i>Нота формы</span><span><i class="m2-swatch m2-swatch-selected"></i>Выбранная позиция</span></div><div class="m2-selection" aria-live="polite"><span class="m2-selection-note">'+(visible.length?n.note:'—')+'</span><div class="m2-selection-copy"><strong>'+(visible.length?degreeNames[n.degree]:'Маркеры отключены')+'</strong><span class="m2-muted">'+(visible.length?'Струна '+n.string+' · лад '+n.fret+' · палец '+n.finger:'Все четыре струны и выбранные лады сохранены')+'</span></div><div class="m2-coordinate"><strong>'+n.string+'</strong><span>/</span><strong>'+n.fret+'</strong></div></div>'+(visible.length?detail(mode,s,n):'<div class="m2-detail-row"><span class="m2-detail-label">Включи маркеры хотя бы на одной струне.</span></div>')+pitchStrip(n)+'<p class="m2-footnote">'+(mode==='instrument'?'Пальцы относятся к последовательному прохождению формы.':'Пустые участки остаются частью грифа. Выбери позицию, чтобы прочитать её значение.')+'</p></main><aside class="m2-settings" aria-label="Параметры материала"><h3>Материал</h3><div class="m2-field"><label class="m2-field-label" for="m3-range-'+mode+'">Показывать лады</label><select id="m3-range-'+mode+'" data-control="range" aria-label="Показывать лады">'+['0:5','0:12','0:24','5:8'].map(value=>'<option value="'+value+'" '+(s.range===value?'selected':'')+'>'+value.replace(':','–')+'</option>').join('')+'</select></div><div class="m2-field"><span class="m2-field-label">Тоника</span><span class="m2-field-value">A · ля</span></div><div class="m2-field"><span class="m2-field-label">Структура</span><span class="m2-field-value">Минорная пентатоника</span></div><div class="m2-field"><span class="m2-field-label">Учебная область</span><span class="m2-field-value">Форма A · лады 5–8</span></div><div class="m2-divider"></div><h3>Маркеры</h3><div class="m2-field"><span class="m2-field-label">Показывать ноты на струнах</span><div class="m2-string-switches">'+strings.map(string=>'<label class="m2-string-switch"><span>'+string+'</span><input type="checkbox" data-string="'+string+'" aria-label="Ноты на струне '+string+'" '+(s.strings.includes(string)?'checked':'')+'></label>').join('')+'</div></div><label class="m2-check"><input type="checkbox" data-control="fingers" '+(s.fingers?'checked':'')+'><span>Показывать пальцы</span></label>'+(mode==='connections'?'<label class="m2-check"><input type="checkbox" data-control="links" '+(s.links?'checked':'')+'><span>Показывать связь</span></label>':'')+'<details><summary>Форма и полный гриф</summary><p>Весь выбранный диапазон и четыре струны остаются на месте. Форма и фильтры меняют только маркеры. Широкая область переносится на последовательные строки, сохраняя размер нот.</p></details></aside></div>';
    const area=app.querySelector('.m2-board-area');draw(area,area.getBoundingClientRect().width);observer.observe(area);
  }
  function draw(area,width){
    if(width<1)return;
    const mode=area.dataset.mode,s=state[mode],selected=notes.find(n=>n.id===s.selected);
    const W=Math.round(width),H=346,left=42,right=W-30,usable=right-left;
    const [min,max]=s.range.split(':').map(Number);
    const capacity=Math.max(3,Math.floor(usable/34));
    const parts=[];
    for(let from=min;from<=max;){
      const rows=Math.ceil((max-from+1)/capacity);
      let to=Math.min(max,from+Math.ceil((max-from+1)/rows)-1);
      if(to>=5&&to<8&&from<=5){
        if(8-from+1<=capacity)to=Math.min(8,max);
        else if(from<5)to=4;
      }
      parts.push({from,to});from=to+1;
    }
    const y=string=>70+strings.indexOf(string)*74;
    const shown=notes.filter(n=>s.strings.includes(n.string)&&n.fret>=min&&n.fret<=max);
    area.innerHTML=parts.map((part,partIndex)=>{
      const frets=Array.from({length:part.to-part.from+1},(_,i)=>part.from+i);
      const naturalBoundaries=frets.map(f=>1-Math.pow(2,-f/12));
      const startBoundary=part.from===0?0:1-Math.pow(2,-(part.from-1)/12);
      const endBoundary=1-Math.pow(2,-part.to/12);
      const physicalRange=endBoundary-startBoundary;
      const openWidth=part.from===0?Math.max(40,usable/frets.length):0;
      const neckLeft=left+openWidth;
      const neckLength=usable-openWidth;
      const bounds={};
      let previous=left;
      frets.forEach((f,i)=>{
        let edge;
        if(f===0)edge=left+openWidth;
        else if(mode==='instrument'&&physicalRange>0)edge=neckLeft+neckLength*(naturalBoundaries[i]-startBoundary)/physicalRange;
        else edge=part.from===0?neckLeft+neckLength*f/part.to:left+usable*(i+1)/frets.length;
        if(f===part.to)edge=right;
        bounds[f]={left:previous,right:edge,center:(previous+edge)/2};previous=edge;
      });
      const localNotes=shown.filter(n=>n.fret>=part.from&&n.fret<=part.to);
      const hasSelected=localNotes.some(n=>n.id===selected.id);
      let svg='<svg class="m2-board-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Лады '+part.from+'–'+part.to+'. Четыре струны G D A E.">';
      frets.forEach(f=>{
        const cell=bounds[f],active=f>=5&&f<=8;
        svg+='<rect data-fret-cell="'+f+'" x="'+cell.left+'" y="43" width="'+(cell.right-cell.left)+'" height="277" fill="'+(active?'#b9d0b0':'transparent')+'" opacity="'+(active?'.075':'1')+'"/>';
        if(active)svg+='<line x1="'+cell.left+'" y1="43" x2="'+cell.right+'" y2="43" stroke="#e1b778" stroke-width="2"/>';
      });
      if(mode==='precise'&&hasSelected){
        const cell=bounds[selected.fret];
        svg+='<rect x="'+cell.left+'" y="44" width="'+(cell.right-cell.left)+'" height="275" fill="#d8e5cd" opacity=".075"/><rect x="'+left+'" y="'+(y(selected.string)-25)+'" width="'+usable+'" height="50" fill="#d8e5cd" opacity=".035"/>';
      }
      for(const f of frets.filter(f=>[3,5,7,9,12,15,17,19,21,24].includes(f))){
        const cy=(y('D')+y('A'))/2;
        svg+='<circle cx="'+bounds[f].center+'" cy="'+(f%12===0?cy-10:cy)+'" r="4" fill="#bdc9ba" opacity=".28"/>'+(f%12===0?'<circle cx="'+bounds[f].center+'" cy="'+(cy+10)+'" r="4" fill="#bdc9ba" opacity=".28"/>':'');
      }
      for(const f of frets){
        const cell=bounds[f];
        svg+='<text data-fret-label="'+f+'" x="'+cell.center+'" y="25" text-anchor="middle" font-size="13" fill="'+(f===selected.fret?'#f2c689':'#c0ccbc')+'" font-weight="'+(f===selected.fret?600:400)+'">'+f+'</text><line x1="'+cell.right+'" y1="44" x2="'+cell.right+'" y2="319" stroke="'+(mode==='instrument'?'#839787':'#687f70')+'" stroke-width="'+(f===0?4:mode==='instrument'?2.4:1.2)+'"/>';
      }
      if(part.from>0)svg+='<line x1="'+left+'" y1="44" x2="'+left+'" y2="319" stroke="#687f70" stroke-width="1.2"/>';
      strings.forEach((string,i)=>{
        const gauge=mode==='instrument'?[1.5,2.1,3,4][i]:[1,1.5,2,2.6][i];
        svg+='<text x="18" y="'+(y(string)+5)+'" text-anchor="middle" fill="#e1eadb" font-size="16" font-weight="'+(string===selected.string?650:400)+'" data-string-label="'+string+'">'+string+'</text><line x1="'+left+'" y1="'+(y(string)+1)+'" x2="'+right+'" y2="'+(y(string)+1)+'" stroke="#0b150f" stroke-width="'+(gauge+2)+'"/><line x1="'+left+'" y1="'+y(string)+'" x2="'+right+'" y2="'+y(string)+'" stroke="#a7b7a9" stroke-width="'+gauge+'"/>'+(mode==='instrument'?'<line x1="'+left+'" y1="'+(y(string)-gauge/3)+'" x2="'+right+'" y2="'+(y(string)-gauge/3)+'" stroke="#e0e7d8" stroke-width=".6" opacity=".8"/>':'');
      });
      if(mode==='connections'&&s.links&&selected.id!=='E:5'&&hasSelected&&bounds[5]&&s.strings.includes('E')){
        const ax=bounds[5].center,ay=y('E'),tx=bounds[selected.fret].center,ty=y(selected.string),cy=selected.string==='E'?ay+36:ay+28;
        svg+='<path d="M '+ax+' '+ay+' C '+ax+' '+cy+', '+tx+' '+cy+', '+tx+' '+ty+'" stroke="#a6d9ed" stroke-width="2" fill="none" stroke-linecap="round"/>';
      }
      svg+='</svg>';
      const markers=localNotes.map(n=>{
        const muted=mode==='instrument'&&s.finger!=='all'&&String(n.finger)!==s.finger;
        return '<button type="button" class="m2-dot '+(n.degree==='1'?'m2-root ':'')+(n.id===s.selected?'m2-selected ':'')+(mode==='connections'&&s.links&&n.id===s.selected?'m2-related ':'')+(muted?'m2-dim':'')+'" style="left:'+bounds[n.fret].center+'px;top:'+y(n.string)+'px" data-note="'+n.id+'" data-fret="'+n.fret+'" aria-pressed="'+(n.id===s.selected)+'" aria-label="'+n.note+', '+degreeNames[n.degree]+', струна '+n.string+', лад '+n.fret+', палец '+n.finger+'">'+(s.labels==='degrees'?n.degree:n.note.replace(/[0-9]/g,''))+(s.fingers?'<span class="m2-finger">'+n.finger+'</span>':'')+'</button>';
      }).join('');
      return '<section class="m3-part" aria-label="Часть грифа '+part.from+'–'+part.to+'">'+(parts.length>1?'<div class="m3-part-label">Лады '+part.from+'–'+part.to+(partIndex?' · продолжение':'')+'</div>':'')+'<div class="m3-segment">'+svg+markers+'</div></section>';
    }).join('')+(parts.length>1?'<p class="m3-wrap-note">Весь выбранный диапазон перенесён на '+parts.length+' строки. Размер нот сохранён.</p>':'');
  }

  root.addEventListener('click',event=>{const button=event.target.closest('button');const app=event.target.closest('[data-version]');if(!button||!app)return;const mode=app.dataset.version,s=state[mode];let focusKey=null,focusValue=null;if(button.dataset.note){s.selected=button.dataset.note;focusKey='note';focusValue=s.selected;}if(button.dataset.label){s.labels=button.dataset.label;focusKey='label';focusValue=s.labels;}if(button.dataset.action==='panel'){s.panel=!s.panel;focusKey='action';focusValue='panel';}if(button.dataset.finger){s.finger=button.dataset.finger;s.fingers=s.finger!=='all'||s.fingers;const candidate=notes.find(n=>s.strings.includes(n.string)&&n.fret>=Number(s.range.split(':')[0])&&n.fret<=Number(s.range.split(':')[1])&&String(n.finger)===s.finger);if(candidate)s.selected=candidate.id;focusKey='finger';focusValue=s.finger;}if(button.dataset.linkNote){const candidate=notes.find(n=>n.id===button.dataset.linkNote);if(s.strings.includes(candidate.string)){s.selected=candidate.id;s.links=true;}focusKey='link-note';focusValue=button.dataset.linkNote;}render(mode);if(focusKey)app.querySelector('button[data-'+focusKey+'="'+focusValue+'"]')?.focus({preventScroll:true});persist();});
  root.addEventListener('change',event=>{const app=event.target.closest('[data-version]');if(!app)return;const mode=app.dataset.version,s=state[mode],control=event.target.dataset.control,string=event.target.dataset.string;if(string)s.strings=event.target.checked?[...new Set([...s.strings,string])]:s.strings.filter(x=>x!==string);if(control==='range')s.range=event.target.value;if(control==='fingers')s.fingers=event.target.checked;if(control==='links')s.links=event.target.checked;render(mode);app.querySelector(string?'input[data-string="'+string+'"]':'[data-control="'+control+'"]')?.focus({preventScroll:true});persist();});
  root.addEventListener('keydown',event=>{const button=event.target.closest('button[data-note]');if(!button||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;const app=button.closest('[data-version]'),mode=app.dataset.version,s=state[mode],n=notes.find(n=>n.id===button.dataset.note);const candidates=notes.filter(p=>s.strings.includes(p.string));let next;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){const row=candidates.filter(p=>p.string===n.string).sort((a,b)=>a.fret-b.fret);next=row[Math.max(0,Math.min(row.length-1,row.indexOf(n)+(event.key==='ArrowRight'?1:-1)))];}else{const index=strings.indexOf(n.string)+(event.key==='ArrowDown'?1:-1);next=candidates.filter(p=>p.string===strings[index]).sort((a,b)=>Math.abs(a.fret-n.fret)-Math.abs(b.fret-n.fret))[0];}if(next){event.preventDefault();s.selected=next.id;render(mode);app.querySelector('button[data-note="'+next.id+'"]')?.focus({preventScroll:true});persist();}});
  window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent;if(next?.revision==='r3'){for(const key of Object.keys(state))if(next[key])Object.assign(state[key],next[key]);for(const key of Object.keys(state))render(key);}});
  for(const mode of Object.keys(state))render(mode);
  if(globalThis.Tweak)for(const mode of Object.keys(state)){const tweak=new Tweak({container:root.querySelector('[data-version="'+mode+'"]'),onChange:()=>render(mode)});tweak.addToggle(state[mode],'panel',{label:'Параметры справа'});tweak.addToggle(state[mode],'fingers',{label:'Показывать пальцы'});}
})();
</script>
