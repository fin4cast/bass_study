  /* Гриф и TAB */

  /* Транспорт */
  #studio-lesson .lr-transport{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--s-panel);border:1px solid var(--s-line);border-radius:12px;padding:10px 14px;}
  #studio-lesson .lr-transport .lr-play{min-width:118px;justify-content:center;}

  #studio-lesson .lr-bpm small{font-size:11px;color:var(--s-muted);}
  #studio-lesson .lr-icon-btn{width:30px;height:30px;border:1px solid var(--s-line-strong);border-radius:7px;background:var(--s-input);font-weight:700;}
  #studio-lesson .lr-toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--s-line);border-radius:7px;background:var(--s-paper);padding:5px 9px;font-size:12px;color:var(--s-muted);}
  #studio-lesson .lr-toggle[aria-pressed="true"]{border-color:var(--s-green);color:var(--s-ink);background:var(--s-green-soft);}
  #studio-lesson .lr-count{font:700 13px/1 'Segoe UI';color:var(--s-gold);min-width:64px;}
  #studio-lesson .lr-progress{flex:1;min-width:120px;}
  #studio-lesson .lr-progress small{font-size:11px;color:var(--s-muted);}
  /* Карточка понятия и самооценка */
  #studio-lesson .lr-concept{border:1px solid var(--s-info);background:var(--s-info-soft);border-radius:10px;padding:10px 12px;font-size:13px;}
  #studio-lesson .lr-concept summary{cursor:pointer;font-weight:650;color:var(--s-info);list-style:none;display:flex;gap:8px;align-items:center;}
  #studio-lesson .lr-concept summary::-webkit-details-marker{display:none;}
  #studio-lesson .lr-concept p{margin-top:6px;color:var(--s-ink);}
  #studio-lesson .lr-after{display:none;}
  #studio-lesson .lr-after.is-open{display:flex;}
  #studio-lesson .lr-rate{gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--s-gold);background:var(--s-gold-soft);border-radius:10px;padding:10px 14px;font-size:13px;}
  #studio-lesson .lr-rate strong{margin-right:4px;}
  @media (max-width:1100px){#studio-lesson .lr-app{grid-template-columns:72px minmax(0,1fr);}#studio-lesson .lr-nav{padding:18px 8px;align-items:center;}#studio-lesson .lr-brand-word,#studio-lesson .lr-nav-item span,#studio-lesson .lr-status{display:none;}#studio-lesson .lr-nav-item{justify-content:center;padding:10px;}#studio-lesson .lr-theme{grid-template-columns:1fr;}#studio-lesson .lr-main{padding:18px;}}
</style>
<script>
(() => {
  const M = BassLessonModel;
  const material = M.buildLessonMaterial();
  const NS = 'http://www.w3.org/2000/svg';
  const STRINGS = ['G', 'D', 'A', 'E'];
  const ICONS = {
    lesson: '<svg viewBox="0 0 20 20"><path d="M4 3h9l3 3v11H4z"/><path d="M7 9h6M7 12h6M7 6h3"/></svg>',
    neck: '<svg viewBox="0 0 20 20"><rect x="2" y="5" width="16" height="10" rx="2"/><path d="M6 5v10M10 5v10M14 5v10M2 8.5h16M2 11.5h16"/></svg>',
    rhythm: '<svg viewBox="0 0 20 20"><path d="M7 17 9 3h2l2 14z"/><path d="M10 11l5-6"/></svg>',
    songs: '<svg viewBox="0 0 20 20"><path d="M8 15V4l9-2v11"/><circle cx="5.5" cy="15" r="2.5"/><circle cx="14.5" cy="13" r="2.5"/></svg>',
    progress: '<svg viewBox="0 0 20 20"><path d="M3 16h14"/><path d="M5 13l4-4 3 2 4-6"/></svg>',
    settings: '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5"/><path d="M10 2v2.5M10 15.5V18M2 10h2.5M15.5 10H18M4.3 4.3l1.8 1.8M13.9 13.9l1.8 1.8M4.3 15.7l1.8-1.8M13.9 6.1l1.8-1.8"/></svg>',
  };
  const NAV = [['lesson', 'Занятие'], ['neck', 'Гриф'], ['rhythm', 'Ритм'], ['songs', 'Песни'], ['progress', 'Прогресс']];
  const esc = value => String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const deg = value => value ? String(value).replace('b', '♭').replace('#', '♯') : '';

  /** Боковое меню из пяти разделов; «Настройки» и тема — внизу. */
  function shell(current, main) {
    const items = NAV.map(([id, label]) => `<button type="button" class="lr-nav-item"${id === current ? ' aria-current="page"' : ''}>${ICONS[id]}<span>${label}</span></button>`).join('');
    return `<div class="lr-app"><nav class="lr-nav" aria-label="Разделы тренажёра"><div class="lr-brand" aria-label="bass.study"><span class="lr-brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="lr-brand-word">bass<span>.</span>study</span></div><div class="lr-nav-list">${items}</div><div class="lr-nav-bottom"><button type="button" class="lr-nav-item">${ICONS.settings}<span>Настройки</span></button><div class="lr-theme" role="group" aria-label="Тема"><button type="button" data-lr-theme="light">Светлая</button><button type="button" data-lr-theme="dark">Тёмная</button></div><span class="lr-status">● Локально · сохранено</span></div></nav><main class="lr-main">${main}</main></div>`;
  }

  /**
   * SVG грифа: строки G-D-A-E сверху вниз, лады fretMin..fretMax.
   * notes: [{id, label, kind: root|a|b|shared|plain|ghost, finger}], current/next — id позиций.
   */
  function fretboard({ fretMin = 0, fretMax = 12, notes = [], current = null, next = null, width = 1000, marker = 46, labels = true }) {
    const left = 34, right = 14, top = labels ? 26 : 10, rowGap = marker * 1.32, height = top + marker * 0.45 + rowGap * 3 + marker * 0.5 + 12;
    const span = fretMax - fretMin + 1;
    const cell = (width - left - right) / span;
    const x = fret => left + (fret - fretMin + 0.5) * cell;
    const y = string => top + marker * 0.45 + STRINGS.indexOf(string) * rowGap;
    const r = marker / 2;
    const parts = [];
    if (labels) for (let f = fretMin; f <= fretMax; f++) parts.push(`<text x="${x(f)}" y="15" text-anchor="middle" font-size="12" fill="#c3d0bf" font-family="Consolas,monospace">${f}</text>`);
    for (let f = fretMin; f <= fretMax + 1; f++) {
      const lx = left + (f - fretMin) * cell;
      parts.push(`<line x1="${lx}" x2="${lx}" y1="${y('G') - r * 0.7}" y2="${y('E') + r * 0.7}" stroke="#abbcad" stroke-opacity="${f === 1 && fretMin === 0 ? 1 : .45}" stroke-width="${f === 1 && fretMin === 0 ? 4 : 1.2}"/>`);
    }
    for (const f of [3, 5, 7, 9, 15, 17, 19, 21]) if (f >= fretMin && f <= fretMax) parts.push(`<circle cx="${x(f)}" cy="${(y('D') + y('A')) / 2}" r="4" fill="#c3d0bf" opacity=".45"/>`);
    for (const f of [12, 24]) if (f >= fretMin && f <= fretMax) { parts.push(`<circle cx="${x(f)}" cy="${(y('G') + y('D')) / 2}" r="4" fill="#c3d0bf" opacity=".45"/>`, `<circle cx="${x(f)}" cy="${(y('A') + y('E')) / 2}" r="4" fill="#c3d0bf" opacity=".45"/>`); }
    for (const s of STRINGS) {
      parts.push(`<text x="12" y="${y(s) + 5}" font-size="14" font-weight="600" fill="#e5eee0">${s}</text>`);
      parts.push(`<line x1="${left}" x2="${width - right}" y1="${y(s)}" y2="${y(s)}" stroke="#d7e2d2" stroke-width="${({ G: 1.4, D: 1.9, A: 2.4, E: 3 })[s]}" opacity=".8"/>`);
    }
    const fills = { root: ['#f3c180', '#3c2913'], a: ['#e6efdc', '#213a29'], b: ['#a4cce2', '#16303f'], shared: ['#cbb5e7', '#2a1d3d'], plain: ['#e6efdc', '#213a29'], ghost: ['transparent', '#c3d0bf'] };
    for (const note of notes) {
      const [string, fretText] = note.id.split(':');
      const fret = Number(fretText);
      if (fret < fretMin || fret > fretMax) continue;
      const cx = x(fret), cy = y(string);
      const [fill, ink] = fills[note.kind] || fills.plain;
      const isCurrent = note.id === current, isNext = note.id === next;
      if (isNext) parts.push(`<circle cx="${cx}" cy="${cy}" r="${r + 5}" fill="none" stroke="#fbdf8e" stroke-width="2.5" stroke-dasharray="5 4"/>`);
      if (isCurrent) parts.push(`<circle cx="${cx}" cy="${cy}" r="${r + 7}" fill="none" stroke="#ffffff" stroke-width="4"/>`);
      parts.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${isCurrent ? '#fbdf8e' : fill}" stroke="${note.kind === 'ghost' ? '#c3d0bf' : 'none'}" stroke-width="1.5" ${note.kind === 'ghost' ? 'stroke-dasharray="3 3"' : ''}/>`);
      if (note.root && note.kind !== 'root') parts.push(`<circle cx="${cx}" cy="${cy}" r="${r - 2.5}" fill="none" stroke="#e0a24f" stroke-width="4"/>`);
      if (note.label) parts.push(`<text x="${cx}" y="${cy + marker * 0.14}" text-anchor="middle" font-size="${Math.round(marker * 0.39)}" font-weight="700" fill="${isCurrent ? '#3c2913' : ink}" font-family="Segoe UI,Arial">${esc(note.label)}</text>`);
      if (note.finger) parts.push(`<text x="${cx + r * 0.78}" y="${cy - r * 0.62}" text-anchor="middle" font-size="${Math.max(10, Math.round(marker * 0.25))}" font-weight="700" fill="#fbdf8e" font-family="Segoe UI,Arial">${note.finger}</text>`);
    }
    return `<svg xmlns="${NS}" viewBox="0 0 ${width} ${height}" role="img" aria-label="Гриф, лады ${fretMin}–${fretMax}">${parts.join('')}</svg>`;
  }

  /** SVG табулатуры по событиям createNotationPlan: 4 линии G-D-A-E, номера ладов, такты, курсор. */
  function tab({ events, current = -1, width = 1000, perBar = 8, from = 0, count = events.length, lineGap = 20, fontSize = 15, showCount = true, dimPlayed = false }) {
    const shown = events.slice(from, from + count);
    const top = showCount ? 22 : 10, left = 30, right = 12;
    const height = top + lineGap * 3 + 22;
    const slot = (width - left - right) / shown.length;
    const parts = [];
    STRINGS.forEach((s, row) => {
      const ly = top + row * lineGap;
      parts.push(`<line x1="${left}" x2="${width - right}" y1="${ly}" y2="${ly}" stroke="currentColor" stroke-opacity=".35"/>`);
      parts.push(`<text x="6" y="${ly + 4}" font-size="11" fill="currentColor" opacity=".7" font-family="Consolas,monospace">${s}</text>`);
    });
    parts.push(`<line x1="${left}" x2="${left}" y1="${top}" y2="${top + lineGap * 3}" stroke="currentColor" stroke-opacity=".6" stroke-width="2"/>`);
    shown.forEach((event, i) => {
      const index = from + i;
      const cx = left + slot * (i + 0.5);
      if (i > 0 && index % perBar === 0) parts.push(`<line x1="${left + slot * i}" x2="${left + slot * i}" y1="${top}" y2="${top + lineGap * 3}" stroke="currentColor" stroke-opacity=".55"/>`);
      if (index === current) parts.push(`<rect x="${cx - slot * 0.42}" y="${top - lineGap * 0.6}" width="${slot * 0.84}" height="${lineGap * 4.2}" rx="6" fill="#f2c94c" fill-opacity=".22" stroke="#d9a520" stroke-width="2.5"/>`);
      const ly = top + event.tab.row * lineGap;
      const label = String(event.tab.fret);
      const w = label.length * fontSize * 0.62 + 6;
      parts.push(`<rect x="${cx - w / 2}" y="${ly - fontSize * 0.62}" width="${w}" height="${fontSize * 1.24}" style="fill:${index === current ? 'transparent' : 'var(--s-tab-bg,var(--s-paper))'}"/>`);
      parts.push(`<text x="${cx}" y="${ly + fontSize * 0.36}" text-anchor="middle" font-size="${fontSize}" font-weight="700" fill="currentColor" opacity="${dimPlayed && index < current ? .4 : 1}" font-family="Consolas,monospace">${label}</text>`);
      if (showCount) {
        const beatText = event.beatInBar % 1 === 0 ? String(event.beatInBar + 1) : 'и';
        parts.push(`<text x="${cx}" y="12" text-anchor="middle" font-size="10" fill="currentColor" opacity=".55" font-family="Segoe UI,Arial">${beatText}</text>`);
      }
    });
    parts.push(`<line x1="${width - right}" x2="${width - right}" y1="${top}" y2="${top + lineGap * 3}" stroke="currentColor" stroke-opacity=".6" stroke-width="2"/>`);
    return `<svg xmlns="${NS}" viewBox="0 0 ${width} ${height}" role="img" aria-label="Табулатура">${parts.join('')}</svg>`;
  }

  /** Ноты EX-1 для грифа: форма A, форма B, общие позиции, тоники. */
  /**
   * Общие позиции важнее тоники: они остаются сиреневыми, тоника на них — золотое кольцо.
   * Пальцы берутся из формы, которую сейчас играют (phase 'a' | 'b').
   */
  function ex1BoardNotes({ labels = 'name', fingers = false, phase = 'a' } = {}) {
    const ex = material.ex1;
    const shared = new Set(ex.shared);
    const ids = [...new Set([...ex.formA.ids, ...ex.formB.ids])];
    const byId = new Map(ex.notes.map(n => [n.id, n]));
    const fingerOf = id => {
      const own = phase === 'b' ? ex.formB.fingers : ex.formA.fingers;
      const other = phase === 'b' ? ex.formA.fingers : ex.formB.fingers;
      return own[id] ?? other[id];
    };
    return ids.map(id => {
      const note = byId.get(id);
      const inA = ex.formA.ids.includes(id);
      const isRoot = note?.degree === '1';
      const kind = shared.has(id) ? 'shared' : isRoot ? 'root' : inA ? 'a' : 'b';
      const label = labels === 'degree' ? deg(note?.degree) : labels === 'finger' ? String(fingerOf(id)) : labels === 'none' ? '' : note?.name.replace(/\d$/, '') ?? '';
      const finger = fingers ? fingerOf(id) : null;
      return { id, label, kind, finger, root: isRoot };
    });
  }

  /** Демонстрационный плеер: отсчёт 4 доли, восьмые по BPM, петля; звука нет. */
  function player({ steps, bpm = 72, countIn = true, loop = true, onStep, onCount, onFinish }) {
    let timer = null, index = -1, counting = 0, state = { bpm, countIn, loop };
    const interval = () => 60000 / state.bpm / 2;
    function tick() {
      if (counting > 0) { onCount?.(5 - counting); counting--; timer = setTimeout(tick, interval() * 2); return; }
      if (index === -1) onCount?.(null);
      index++;
      if (index >= steps) {
        if (!state.loop) { stop(); onFinish?.(); return; }
        index = 0; onFinish?.({ looped: true });
      }
      onStep?.(index);
      timer = setTimeout(tick, interval());
    }
    function start() { if (timer) return; counting = state.countIn ? 4 : 0; index = -1; tick(); }
    function stop() { clearTimeout(timer); timer = null; counting = 0; onCount?.(null); }
    return { start, stop, toggle() { timer ? stop() : start(); return !!timer; }, get playing() { return !!timer; }, get index() { return index; }, set(key, value) { state[key] = value; } };
  }

  /** Разметка транспорта; data-lr-* подключает bindTransport. */
  function transport({ bpm = 72, ladder = '72 → 96, +4', compact = false } = {}) {
    return `<div class="lr-transport" data-lr-transport>
      <button type="button" class="lr-btn lr-btn-primary lr-play" data-lr-play>▶ Играть <span class="lr-kbd">Пробел</span></button>
      <div class="lr-bpm"><button type="button" class="lr-icon-btn" data-lr-bpm="-4" aria-label="Медленнее">−</button><output data-lr-bpm-value>${bpm}</output><button type="button" class="lr-icon-btn" data-lr-bpm="4" aria-label="Быстрее">+</button><small>BPM ♩<br>играем восьмыми</small></div>
      <span class="lr-count" data-lr-count aria-live="polite"></span>
      <button type="button" class="lr-toggle" data-lr-flag="countIn" aria-pressed="true">Отсчёт 4</button>
      <button type="button" class="lr-toggle" data-lr-flag="loop" aria-pressed="true">⟲ По кругу</button>
      ${compact ? '' : `<button type="button" class="lr-toggle" data-lr-ladder aria-pressed="false" title="Лестница темпа">↗ Лестница ${esc(ladder)}</button>`}
      <div class="lr-progress"><div class="lr-meter"><i data-lr-meter style="width:0%"></i></div><small data-lr-position>Нота 0 из ${material.ex1.notes.length}</small></div>
    </div>`;
  }

  /** Подключает транспорт внутри контейнера к плееру; render(index) перерисовывает сцену. */
  function bindTransport(container, { steps, bpm = 72, render, onPass }) {
    const play = container.querySelector('[data-lr-play]');
    const out = container.querySelector('[data-lr-bpm-value]');
    const count = container.querySelector('[data-lr-count]');
    const meter = container.querySelector('[data-lr-meter]');
    const position = container.querySelector('[data-lr-position]');
    let passes = 0;
    const p = player({
      steps, bpm,
      onStep(i) { render(i); if (meter) meter.style.width = `${((i + 1) / steps) * 100}%`; if (position) position.textContent = `Нота ${i + 1} из ${steps} · проход ${passes + 1}`; },
      onCount(n) { if (count) count.textContent = n ? `Отсчёт ${n}…` : ''; },
      onFinish(info) { passes++; onPass?.(passes, info); if (!info) sync(); },
    });
    const sync = () => { play.innerHTML = p.playing ? '■ Стоп <span class="lr-kbd">Пробел</span>' : '▶ Играть <span class="lr-kbd">Пробел</span>'; };
    play.addEventListener('click', () => { p.toggle(); sync(); });
    container.querySelectorAll('[data-lr-bpm]').forEach(button => button.addEventListener('click', () => {
      const value = Math.min(200, Math.max(40, Number(out.value || out.textContent) + Number(button.dataset.lrBpm)));
      out.textContent = value; p.set('bpm', value);
    }));
    container.querySelectorAll('[data-lr-flag]').forEach(button => button.addEventListener('click', () => {
      const on = button.getAttribute('aria-pressed') !== 'true';
      button.setAttribute('aria-pressed', String(on)); p.set(button.dataset.lrFlag, on);
    }));
    container.querySelector('[data-lr-ladder]')?.addEventListener('click', event => {
      const button = event.currentTarget; button.setAttribute('aria-pressed', String(button.getAttribute('aria-pressed') !== 'true'));
    });
    document.addEventListener('keydown', event => {
      if (event.code !== 'Space' || event.target.closest?.('input,textarea,select,button')) return;
      if (getComputedStyle(container).display === 'none' || !container.offsetParent) return;
      event.preventDefault(); p.toggle(); sync();
    });
    return p;
  }

  /** Связывает переключатели темы и кандидата; поддерживает ?candidate=b&theme=dark. */
  function mount(root, { candidates }) {
    const params = new URLSearchParams(location.search);
    const setTheme = theme => {
      root.dataset.theme = theme;
      root.querySelectorAll('[data-lr-theme]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lrTheme === theme)));
      document.querySelectorAll('[data-review-theme]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.reviewTheme === theme)));
      document.documentElement.style.colorScheme = theme;
    };
    const setCandidate = id => {
      root.dataset.candidate = id;
      document.querySelectorAll('[data-review-candidate]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.reviewCandidate === id)));
    };
    root.addEventListener('click', event => { const b = event.target.closest('[data-lr-theme]'); if (b) setTheme(b.dataset.lrTheme); });
    document.querySelectorAll('[data-review-theme]').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.reviewTheme)));
    document.querySelectorAll('[data-review-candidate]').forEach(b => b.addEventListener('click', () => setCandidate(b.dataset.reviewCandidate)));
    setTheme(params.get('theme') === 'dark' ? 'dark' : 'light');
    setCandidate(candidates.includes(params.get('candidate')) ? params.get('candidate') : candidates[0]);
  }

  window.LessonRef = { material, shell, fretboard, tab, ex1BoardNotes, player, transport, bindTransport, mount, esc, deg, ICONS };
})();
</script>

<div id="studio-lesson" data-candidate="a" data-view="both"></div>
<script>
(() => {
  const L = window.LessonRef;
  const ex = L.material.ex1;
  const events = ex.notation.events;
  const steps = events.length;
  const root = document.getElementById('studio-lesson');
  const pos = id => id.replace(':', '/');
  const shift = { from: ex.notes[ex.split - 1], to: ex.notes[ex.split] };
  const fingerA = ex.formA.fingers[shift.from.id], fingerB = ex.formB.fingers[shift.to.id];
  const VIEWS = [['board', 'Гриф крупно'], ['both', 'Таб + гриф'], ['tab', 'Таб крупно'], ['memory', 'По памяти']];
  const sharedNames = ex.shared.map(id => ex.notes.find(n => n.id === id)?.name).filter(Boolean);
  const concept = `<details class="lr-concept"><summary>ⓘ Почему через общие ноты</summary><p>Соседние формы пентатоники делят общие позиции. У форм A и B это ${L.esc(sharedNames.join(', '))} (${L.esc(ex.shared.map(pos).join(', '))}). Рука переходит в новую позицию по знакомой ноте, а не прыжком. Так пентатоника складывается в одну карту грифа, а не в пять отдельных «ящиков».</p></details>`;
  const after = `<div class="lr-after lr-rate" data-after><strong data-after-title>Проход завершён.</strong><span>Как прошло?</span><button type="button" class="lr-btn" data-rate="clean">Чисто</button><button type="button" class="lr-btn" data-rate="errors">С ошибками</button><button type="button" class="lr-btn" data-rate="slow">Не успевал</button><span data-suggest class="lr-sub"></span></div>`;
  const legend = `<div class="lr-legend"><span><i style="background:#f3c180"></i>Тоника A (на общей ноте — кольцо)</span><span><i style="background:#e6efdc"></i>Форма A · 5–8</span><span><i style="background:#a4cce2"></i>Форма B · 7–10</span><span><i style="background:#cbb5e7"></i>Общие ноты</span><span><i style="background:transparent;border:2px dashed #c9a640"></i>Следующая нота</span></div>`;
  const shiftNote = (tail = true) => `<div class="b-note"><span>Переход</span><b>${L.esc(pos(shift.from.id))} (палец ${fingerA}) → сдвиг на 2 лада → ${L.esc(pos(shift.to.id))} (палец ${fingerB})</b>${tail ? '<span>дальше вниз по форме B</span>' : ''}</div>`;
  const viewSeg = `<div class="p-views"><span>Вид · от подсказки к памяти</span><div class="lr-seg" role="group" aria-label="Вид экрана игры">${VIEWS.map(([id, label], i) => `<button type="button" data-view="${id}" aria-pressed="${id === 'both'}"><i>${i + 1}</i>${label}</button>`).join('')}</div></div>`;
  const labelSeg = `<div class="lr-seg" role="group" aria-label="Подписи" data-labels><button type="button" data-label="name" aria-pressed="true">Ноты</button><button type="button" data-label="degree" aria-pressed="false">Ступени</button><button type="button" data-label="finger" aria-pressed="false">Пальцы</button></div>`;

  const main = `<section class="p-scene">
    <div class="p-head"><div class="p-head-copy"><button type="button" class="p-back">← Занятие · план на сегодня, шаг 2 из 4</button><div class="p-title-row"><h1 class="lr-h1">Связка соседних форм · Am · A → B</h1><span class="lr-sub">16 восьмых · 2 такта · лучший темп 76</span><span class="p-chips"><span class="lr-chip lr-chip-concept">Связка форм</span><span class="lr-chip lr-chip-concept">Общие ноты</span><span class="lr-chip lr-chip-concept">Ступени ♭3 · ♭7</span></span></div></div>
      <div class="p-head-tools"><button type="button" class="lr-btn lr-btn-ghost" data-listen title="Слух как опция: эталон звучит до игры">♪ Сначала услышь</button><span data-label-wrap>${labelSeg}</span></div></div>
    ${viewSeg}

    <div data-view-area="board" class="v-col">
      <div class="b-strip"><div class="b-now" aria-live="polite"><span>Сейчас</span><strong data-now>A</strong><span data-now-detail>E/5 · ступень 1</span></div><div class="lr-tab p-tabcard"><header><span>TAB · текущий такт</span><span data-bar-label-board>такт 1 из 2</span></header><div data-tab-board></div></div></div>
      <div class="lr-board"><div data-board-big></div></div>
      <div class="p-row">${shiftNote()}${concept}${after}</div>
    </div>

    <div data-view-area="both" class="v-col">
      <div class="lr-tab p-tabcard"><header><span>TAB · бас E–A–D–G</span><span>такт 1 — вверх по форме A · такт 2 — вниз по форме B</span></header><div data-tab-both></div></div>
      <div class="lr-board"><div data-board-both></div></div>
      <div class="p-row">${legend}${concept}${after}</div>
    </div>

    <div data-view-area="tab" class="v-col">
      <div class="c-grid">
        <div class="c-tab"><div class="c-bar"><span data-bar-label-tab>Такт 1 из 2 · вверх по форме A</span><span>счёт: 1 и 2 и 3 и 4 и</span></div><div class="lr-tab"><div data-tab-big></div></div><div class="lr-tab c-next"><div data-tab-next></div></div>${after}</div>
        <aside class="c-side"><div class="lr-board"><div data-board-mini></div></div>${shiftNote(false)}${concept}</aside>
      </div>
    </div>

    <div data-view-area="memory" class="v-col" style="flex:1">
      <div class="m-box"><div class="m-cell"><span>Старт</span><strong>E/5</strong><span>A1 · палец 1 · вверх по форме A</span></div><div class="m-cell"><span>Сейчас</span><strong data-mem-bar>—</strong><span data-mem-detail>отсчёт 4 доли</span></div><div class="m-cell"><span>Переход</span><strong>${L.esc(pos(shift.from.id))} → ${L.esc(pos(shift.to.id))}</strong><span>сдвиг на 2 лада третьим пальцем</span></div></div>
      <div class="p-row">${concept}${after}</div>
    </div>

    ${L.transport({ bpm: 76 })}
  </section>`;

  root.innerHTML = L.shell('lesson', main);
  L.mount(root, { candidates: ['a'] });
  const scene = root.querySelector('.p-scene');
  const params = new URLSearchParams(location.search);
  let view = VIEWS.some(([id]) => id === params.get('view')) ? params.get('view') : 'both';
  let labelMode = 'name', current = -1;
  const at = selector => scene.querySelector(selector);
  const boardNotes = () => L.ex1BoardNotes({ labels: labelMode, phase: current >= ex.split ? 'b' : 'a' });

  function render(index) {
    current = index;
    const cur = current >= 0 ? events[current].positionId : null;
    const next = current >= 0 ? events[(current + 1) % steps].positionId : events[0].positionId;
    const bar = Math.floor(Math.max(0, current) / 8);
    const barText = `такт ${bar + 1} из 2 · ${bar ? 'вниз по форме B' : 'вверх по форме A'}`;
    if (view === 'board') {
      at('[data-tab-board]').innerHTML = L.tab({ events, current, width: 900, from: bar * 8, count: 8, lineGap: 15, fontSize: 15 });
      at('[data-bar-label-board]').textContent = barText;
      const note = ex.notes[Math.max(0, current)];
      at('[data-now]').textContent = note.name.replace(/\d$/, '');
      at('[data-now-detail]').textContent = `${pos(note.id)} · ступень ${L.deg(note.degree)}`;
      at('[data-board-big]').innerHTML = L.fretboard({ fretMin: 3, fretMax: 12, notes: boardNotes(), current: cur, next, width: 1000, marker: 44 });
    } else if (view === 'both') {
      at('[data-tab-both]').innerHTML = L.tab({ events, current, width: 1000, lineGap: 18, fontSize: 17 });
      at('[data-board-both]').innerHTML = L.fretboard({ fretMin: 3, fretMax: 12, notes: boardNotes(), current: cur, next, width: 1000, marker: 40 });
    } else if (view === 'tab') {
      at('[data-tab-big]').innerHTML = L.tab({ events, current, width: 760, from: bar * 8, count: 8, lineGap: 34, fontSize: 28, dimPlayed: true });
      at('[data-tab-next]').innerHTML = L.tab({ events, current: -1, width: 760, from: ((bar + 1) % 2) * 8, count: 8, lineGap: 14, fontSize: 13, showCount: false });
      at('[data-bar-label-tab]').textContent = `Т${barText.slice(1)} · ниже — следующий`;
      at('[data-board-mini]').innerHTML = L.fretboard({ fretMin: 4, fretMax: 11, notes: L.ex1BoardNotes({ labels: 'none' }), current: cur, next, width: 280, marker: 22 });
    } else {
      at('[data-mem-bar]').textContent = current >= 0 ? `такт ${bar + 1}` : '—';
      at('[data-mem-detail]').textContent = current >= 0 ? (bar ? 'вниз по форме B' : 'вверх по форме A') : 'отсчёт 4 доли';
    }
  }
  function setView(id) {
    view = id;
    root.dataset.view = id;
    scene.querySelectorAll('button[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === id)));
    at('[data-label-wrap]').hidden = !(id === 'board' || id === 'both');
    render(current);
  }
  scene.querySelectorAll('button[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
  scene.querySelectorAll('[data-label]').forEach(b => b.addEventListener('click', () => {
    labelMode = b.dataset.label;
    scene.querySelectorAll('[data-label]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render(current);
  }));
  /* Макет: «← Занятие» возвращает в VIS-10; экран игры показывает только EX-1. */
  at('.p-back').addEventListener('click', () => { location.href = `lesson-r2-vis10.html?theme=${root.dataset.theme || 'light'}`; });
  const askedEx = params.get('ex');
  if (askedEx && !/Связка соседних форм/.test(askedEx)) { const note = document.createElement('p'); note.className = 'lr-sub'; note.textContent = `Макет: вместо «${askedEx.replace(/ · .*$/, '')}» показана связка соседних форм — в референсе рассчитано одно упражнение.`; at('.p-head-copy').append(note); }
  at('[data-listen]').addEventListener('click', event => { event.currentTarget.textContent = '♪ Эталон: в референсе без звука'; });

  const nextView = () => VIEWS[Math.min(VIEWS.length - 1, VIEWS.findIndex(([id]) => id === view) + 1)];
  scene.querySelectorAll('[data-after]').forEach(box => box.addEventListener('click', event => {
    const b = event.target.closest('[data-rate],[data-next-view]');
    if (!b) return;
    if (b.dataset.nextView) { setView(b.dataset.nextView); return; }
    const bpm = Number(at('[data-lr-bpm-value]').textContent);
    const [nid, nlabel] = nextView();
    const suggest = box.querySelector('[data-suggest]');
    suggest.innerHTML = ({
      clean: view === 'memory' ? L.esc(`Дальше: темп ${bpm + 4} или связка B → C.`) : `${L.esc(`Дальше: темп ${bpm + 4} или`)} <button type="button" class="lr-btn" data-next-view="${nid}">вид «${L.esc(nlabel)}» →</button>`,
      errors: L.esc(`Оставь ${bpm}; включи петлю на ноты 5–12 — переход между формами.`),
      slow: L.esc(`Попробуй ${bpm - 4} BPM, отсчёт оставлен.`),
    })[b.dataset.rate];
  }));
  L.bindTransport(scene, { steps, bpm: 76, render, onPass: passes => {
    scene.classList.add('is-rated');
    scene.querySelectorAll('[data-after]').forEach(box => { box.classList.add('is-open'); box.querySelector('[data-after-title]').textContent = `Проход ${passes} завершён.`; });
  } });
  setView(view);
})();
</script>
