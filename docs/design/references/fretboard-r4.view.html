<div id="studio-fretboard" aria-label="Гриф и связи — доработка выбранного экрана"></div>
<style>
  #studio-fretboard{--s-paper:light-dark(#fafaf7,#1c2420);--s-nav:light-dark(#f0f2ec,#202c25);--s-panel:light-dark(#f5f6f0,#202923);--s-input:light-dark(#ffffff,#26332b);--s-ink:light-dark(#27372e,#edf4e8);--s-muted:light-dark(#637168,#b0beb0);--s-line:light-dark(#d9e1d5,#405346);--s-hover:light-dark(#eaf0e5,#324337);--s-green:light-dark(#345d42,#bdd5ab);--s-on-green:light-dark(#ffffff,#17271c);--s-green-soft:light-dark(#e8eee1,#31482f);--s-gold:light-dark(#956124,#edbf7e);--s-focus:light-dark(#287aa7,#8ccef0);--s-error:light-dark(#9b3d2b,#ffbeaa);--s-error-bg:light-dark(#fff0e9,#432c25);--s-neck:#1a2b22;--s-neck-text:#e5eee0;--s-note:#e6efdc;--s-note-ink:#213a29;--s-root:#f3c180;--s-root-ink:#3c2913;--s-link:#a4d6e9;--s-toggle-thumb:light-dark(#ffffff,#cedac5);font:14px/1.5 'Segoe UI Variable','Segoe UI',Arial,sans-serif;color:var(--s-ink);width:100%;}

  @media(max-width:620px){#studio-fretboard .s-shell,#studio-fretboard .s-shell.panel-closed{grid-template-columns:minmax(0,1fr);}#studio-fretboard .s-nav{grid-row:auto;flex-direction:row;gap:16px;padding:17px 15px;align-items:center;border-radius:12px 12px 0 0;flex-wrap:wrap;}#studio-fretboard .s-nav-group{flex-direction:row;flex-wrap:wrap;gap:2px;}#studio-fretboard .s-nav-group>.s-overline,#studio-fretboard .s-nav-bottom{display:none;}#studio-fretboard .s-nav-button{padding:7px 9px;font-size:12px;}#studio-fretboard .s-nav-button.is-current:before{display:none;}#studio-fretboard .s-main{padding:22px 16px;}#studio-fretboard .s-settings{grid-column:1;grid-template-columns:minmax(0,1fr);border-radius:0 0 12px 12px;padding:23px 20px;}#studio-fretboard .s-position-groups{grid-template-columns:1fr;}#studio-fretboard .s-coordinate{margin-left:0;}#studio-fretboard .s-segmented button{font-size:12px;padding:6px 8px;}#studio-fretboard .s-modes{gap:15px;}#studio-fretboard h2{font-size:24px;}#studio-fretboard .s-scale-formula{margin-left:0;width:100%;margin-top:7px;}}

<script>
(() => {
  const root=document.getElementById('studio-fretboard'),M=BassReferenceMusic;
  const STRINGS=['G','D','A','E'],ROOTS=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
  const pretty=value=>String(value).replaceAll('b','♭').replaceAll('#','♯');
  const escape=value=>String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
  const boxKey=box=>box.selection.shapeId+':'+box.selection.anchorFret+':'+box.selection.anchorString;
  const initialBoxes=M.getBoxCatalogue('A','minor-pentatonic');
  const initialBox=initialBoxes.find(b=>b.selection.shapeId==='penta-a'&&b.window.fretMin===5);
  const state={root:'A',structure:'minor-pentatonic',box:boxKey(initialBox),strings:[...STRINGS],min:'0',max:'12',labels:'notes',selected:'A:7',focus:'A:7',fingers:false,links:true,neighbor:false,direction:'next',panel:true,picker:null,theme:'system',details:{positions:false,neighbor:false,theory:false,technical:false},notice:'',dialog:null};
  const saved=window.openai?.widgetState?.privateContent;if(saved?.revision==='r4'&&saved.state){const allowed=['root','structure','box','strings','min','max','labels','selected','focus','fingers','links','neighbor','direction','panel','theme','details'];for(const k of allowed)if(Object.hasOwn(saved.state,k))state[k]=saved.state[k];}
  if(!ROOTS.includes(state.root))state.root='A';if(!M.STRUCTURES.some(x=>x.id===state.structure))state.structure='minor-pentatonic';state.strings=Array.isArray(state.strings)?state.strings.filter(x=>STRINGS.includes(x)):[...STRINGS];if(!['notes','degrees','hidden'].includes(state.labels))state.labels='notes';if(!['system','light','dark'].includes(state.theme))state.theme='system';
  let current=null,rendering=false,lastWidth=0;
  const observe=new ResizeObserver(entries=>{for(const entry of entries){const width=Math.round(entry.contentRect.width);if(width>0&&width!==lastWidth){lastWidth=width;drawBoard(width);}}});
  function persist(){window.openai?.setWidgetState?.({modelContent:{screen:'VIS-01',revision:'r4',base:'Связи на грифе',baseline:'d0bb2d5',approvedNoteSize:'46/18'},privateContent:{revision:'r4',state:{...state,picker:null,dialog:null,notice:''}}})?.catch(()=>{});}
  function captureDetails(){root.querySelectorAll('details[data-detail]').forEach(el=>state.details[el.dataset.detail]=el.open);}
  function range(){const min=Number(state.min),max=Number(state.max);return{min,max,valid:state.min!==''&&state.max!==''&&Number.isInteger(min)&&Number.isInteger(max)&&min>=0&&max<=24&&min<=max};}
  function derive(){const structure=M.createStructure(state.root,state.structure),boxes=M.getBoxCatalogue(state.root,state.structure),box=boxes.find(b=>boxKey(b)===state.box)||null,r=range();const all=r.valid?M.annotatePositions(M.getPositions({strings:state.strings,fretMin:r.min,fretMax:r.max}),structure):[];const ids=new Set(box?.referencePositionIds||[]);const material=box?box.positions:all.filter(n=>n.inStructure);const selected=all.find(n=>n.id===state.selected)||null;const anchor=(box?.positions.find(n=>n.isRoot)||all.filter(n=>n.isRoot).sort((a,b)=>a.midi-b.midi)[0])||null;const index=box?boxes.indexOf(box):-1;const neighbor=index<0?null:boxes[index+(state.direction==='next'?1:-1)]||null;const shared=new Set(box&&neighbor&&state.neighbor?M.getBoxOverlap(box,neighbor):[]);return{structure,boxes,box,range:r,all,ids,material,selected,anchor,neighbor,shared};}
  function ensureSelection(){let c=derive();if(!c.range.valid||!c.all.length)return c;if(!c.selected){const candidate=c.all.find(n=>c.ids.has(n.id)&&n.isRoot)||c.all.find(n=>c.ids.has(n.id))||c.all[0];state.selected=candidate.id;c=derive();}if(!c.all.some(n=>n.id===state.focus))state.focus=state.selected;return c;}
  function formName(box){if(!box)return'Свободный диапазон';const s=box.selection;return s.shapeId.startsWith('penta-')?'Форма '+s.shapeId.slice(-1).toUpperCase()+' · '+box.window.fretMin+'–'+box.window.fretMax:box.label+' · '+s.anchorString;}
  function optionData(kind){if(kind==='root')return ROOTS.map(v=>({value:v,label:pretty(v)}));if(kind==='structure')return M.STRUCTURES.map(s=>({value:s.id,label:s.name}));if(kind==='box')return[{value:'free',label:'Свободный диапазон',sub:'Ноты структуры в выбранной области'},...current.boxes.map(b=>({value:boxKey(b),label:formName(b),sub:b.label}))];return[{value:'system',label:'Системная'},{value:'light',label:'Светлая'},{value:'dark',label:'Тёмная'}];}
  function picker(kind,label,value,display){const options=optionData(kind),open=state.picker===kind;return '<div class="s-field"><span class="s-field-label" id="s-label-'+kind+'">'+label+'</span><div class="s-picker"><button type="button" class="s-picker-button" id="s-picker-'+kind+'" data-picker="'+kind+'" aria-haspopup="listbox" aria-expanded="'+open+'" aria-controls="s-options-'+kind+'" aria-labelledby="s-label-'+kind+' s-picker-'+kind+'">'+escape(display)+'</button>'+(open?'<div class="s-popup '+(kind==='root'?'is-tonic':'')+'" id="s-options-'+kind+'" role="listbox" aria-label="'+label+'">'+options.map((o,i)=>'<button type="button" class="s-option" role="option" data-option="'+kind+'" data-value="'+escape(o.value)+'" aria-selected="'+(o.value===value)+'" data-option-index="'+i+'">'+escape(o.label)+(o.sub?'<small>'+escape(o.sub)+'</small>':'')+'</button>').join('')+'</div>':'')+'</div></div>';}
  function switchControl(key,label){const disabled=key==='fingers'&&(!current.box||!current.all.length);const hint=!current.box?'Для учебной формы':'После исправления области';return '<label class="s-switch-row"><span>'+label+(disabled?'<small class="s-switch-hint">'+hint+'</small>':'')+'</span><input class="s-switch" type="checkbox" role="switch" data-switch="'+key+'" aria-label="'+label+'" '+(state[key]?'checked':'')+(disabled?' disabled':'')+'></label>';}
  function noteLabel(n){return M.formatMidi(n.midi,n.noteName);}
  function interval(n,anchor){if(!n||!anchor)return null;const delta=n.midi-anchor.midi,d=Math.abs(delta),names=['Прима','Малая секунда','Большая секунда','Малая терция','Большая терция','Кварта','Тритон','Квинта','Малая секста','Большая секста','Малая септима','Большая септима'];const name=d===0?'Та же высота':d===12?'Октава':d%12===0?(d/12)+' октавы':names[d%12]+(d>24?' через '+Math.floor(d/12)+' октавы':d>12?' через октаву':'');return{delta,name:name+(delta<0?' вниз':''),distance:delta===0?'0':delta>0?'+'+delta:'−'+d};}
  function relationTargets(){const c=current;if(!c.anchor)return[];const third=c.structure.notes.find(n=>n.degree.endsWith('3'))?.semitones;return[[third,'Терция'],[7,'Квинта'],[12,'Октава']].map(([semitones,label])=>{const candidates=c.all.filter(n=>n.midi===c.anchor.midi+semitones);const target=candidates.find(n=>c.ids.has(n.id))||candidates[0];return{label,target};});}
  function details(id,title,body){return '<details class="s-details" data-detail="'+id+'" '+(state.details[id]?'open':'')+'><summary>'+title+'</summary><div class="s-details-content">'+body+'</div></details>';}
  function positionButtons(positions){return positions.length?'<div class="s-position-buttons">'+positions.map(n=>'<button type="button" class="s-position-button" data-position="'+n.id+'">'+escape(noteLabel(n))+' · '+n.string+'/'+n.fret+'</button>').join('')+'</div>':'<p>В выбранной области других позиций нет.</p>';}
  function inspector(){const c=current,n=c.selected;if(!c.range.valid)return'<div class="s-inspector"><span class="s-muted">Выбор недоступен: исправь диапазон.</span></div>';if(!n)return'<div class="s-inspector"><span class="s-muted">Включи струну, чтобы исследовать позиции. Все четыре строки остаются на месте.</span></div>';const relation=interval(n,c.anchor);const same=c.all.filter(p=>p.id!==n.id&&p.midi===n.midi),octaves=c.all.filter(p=>p.pitchClass===n.pitchClass&&p.midi!==n.midi);return '<div class="s-inspector" aria-live="polite"><span class="s-selected-note">'+escape(noteLabel(n))+'</span><div class="s-selected-copy"><strong>'+(n.isRoot?'Тоника':n.inStructure?'Ступень '+pretty(n.degree):'Вне структуры')+'</strong><span class="s-muted">Струна '+n.string+' · '+(n.fret===0?'открытая':'лад '+n.fret)+(c.box?.fingers[n.id]?' · палец '+c.box.fingers[n.id]:'')+'</span></div><div class="s-coordinate"><strong>'+n.string+'</strong><span>/</span><strong>'+n.fret+'</strong></div></div>'+(relation?'<div class="s-relation"><div class="s-relation-value">'+escape(noteLabel(c.anchor))+' → '+escape(noteLabel(n))+'<small>'+escape(relation.name)+' · '+relation.distance+' полутонов</small></div><div class="s-segmented" aria-label="Посмотреть интервал">'+relationTargets().map((t,i)=>'<button type="button" data-target="'+i+'" aria-pressed="'+(t.target?.id===n.id)+'" '+(!t.target?'disabled':'')+'>'+t.label+'</button>').join('')+'</div></div>':'<p class="s-notice">В выбранной области нет тоники для соединителя. Ступень указана относительно '+pretty(state.root)+'.</p>')+'<div class="s-structure-strip" aria-label="Состав структуры">'+c.structure.notes.map(p=>'<span class="s-scale-note '+(p.pitchClass===n.pitchClass?'is-current':'')+'">'+escape(p.name)+'<small>'+pretty(p.degree)+'</small></span>').join('')+'<span class="s-scale-formula">'+pretty(c.structure.formula)+'</span></div>'+details('positions','Та же нота на грифе','<div class="s-position-groups"><div><div class="s-position-group-title">Та же высота · '+same.length+'</div>'+positionButtons(same)+'</div><div><div class="s-position-group-title">Другие октавы · '+octaves.length+'</div>'+positionButtons(octaves)+'</div></div>')+details('technical','Технические сведения','MIDI '+n.midi+' · '+n.frequency.toFixed(2)+' Гц. Расчётная частота модели.');}
  function settings(){const c=current,r=c.range;const isPenta=Boolean(c.box?.selection.shapeId.startsWith('penta-'));return '<aside class="s-settings" aria-label="Параметры изучения"><div class="s-panel-title"><h3>Материал</h3><button type="button" class="s-small-action" data-action="panel">Свернуть</button></div>'+picker('root','Тоника',state.root,pretty(state.root))+picker('structure','Структура',state.structure,c.structure.name)+picker('box','Учебная форма',state.box||'free',formName(c.box))+(c.box?'<p class="s-notice">'+c.box.positions.length+' позиций · '+escape(c.box.label)+'</p>':'<p class="s-notice">Свободная область по струнам и ладам.</p>')+'<div class="s-panel-rule"></div><h3>Отображение</h3>'+switchControl('fingers','Номера пальцев')+switchControl('links','Связь с тоникой')+details('neighbor','Соседняя форма',isPenta?'<div class="s-segmented" aria-label="Направление соседней формы"><button type="button" data-direction="previous" aria-pressed="'+(state.direction==='previous')+'">Предыдущая</button><button type="button" data-direction="next" aria-pressed="'+(state.direction==='next')+'">Следующая</button></div>'+(c.neighbor?'<p class="s-notice">'+escape(formName(c.neighbor))+' · общих позиций '+M.getBoxOverlap(c.box,c.neighbor).length+'</p>'+switchControl('neighbor','Показать пересечение'):'<p class="s-notice">С этой стороны нет полной формы.</p>'):'<p>Для сравнения соседей выбери пентатонику и учебную форму.</p>')+'<div class="s-panel-rule"></div><h3>Область грифа</h3><div class="s-field"><span class="s-field-label">Показывать лады · включительно</span><div class="s-range-inputs"><label><span>От</span><input type="number" id="s-fret-min" data-range-field="min" min="0" max="24" step="1" value="'+escape(state.min)+'" aria-label="Первый видимый лад" aria-invalid="'+!r.valid+'"></label><label><span>До</span><input type="number" id="s-fret-max" data-range-field="max" min="0" max="24" step="1" value="'+escape(state.max)+'" aria-label="Последний видимый лад" aria-invalid="'+!r.valid+'"></label></div><div class="s-presets" aria-label="Быстрый диапазон">'+[['0','5'],['0','12'],['12','24']].map(([min,max])=>'<button type="button" data-range="'+min+':'+max+'" class="'+(state.min===min&&state.max===max?'is-current':'')+'">'+min+'–'+max+'</button>').join('')+'</div>'+(!r.valid?'<p class="s-error" role="alert">Укажи целые лады 0–24: первый не больше последнего.</p>':'')+'</div><div class="s-field"><span class="s-field-label">Ноты на струнах</span><div class="s-string-grid">'+STRINGS.map(s=>'<label class="s-string-choice"><input type="checkbox" data-string="'+s+'" aria-label="Ноты на струне '+s+'" '+(state.strings.includes(s)?'checked':'')+'><span>'+s+'</span></label>').join('')+'</div></div><p class="s-notice">Выключенная струна остаётся пустой. Ручной выбор струн включает свободную область.</p>'+details('theory','Ступени, пальцы и формы','<p>Ступень отсчитывается от тоники: 1 — тоника, 3 — терция, 5 — квинта. ♭ понижает ступень на полутон.</p><p style="margin-top:10px">Квадрат — рекомендуемый палец. Формы относятся к учебному каталогу bass.study; это не универсальная нумерация.</p>')+'</aside>';}
  function navigation(){return '<nav class="s-nav" aria-label="Разделы тренажёра"><div class="s-brand" aria-label="bass.study"><span class="s-brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="s-brand-word">bass<span>.</span>study</span></div><div class="s-nav-group"><span class="s-overline">ПРАКТИКА</span>'+['Гриф и практика','Слух','Аккомпанемент','Аудиодорожки','Аудиовход','Маршрут занятия'].map((label,i)=>'<button type="button" class="s-nav-button '+(i===0?'is-current':'')+'" '+(i===0?'aria-current="page"':'data-nav="'+label+'"')+'>'+label+'</button>').join('')+'</div><div class="s-nav-bottom"><button type="button" class="s-nav-button" data-nav="Мои занятия и настройки">Мои занятия</button><button type="button" class="s-nav-button" data-nav="Введение">Введение</button>'+picker('theme','Оформление',state.theme,({system:'Системное',light:'Светлое',dark:'Тёмное'})[state.theme])+'<span class="s-local">Локальный тренажёр</span></div></nav>';}
  function render(focusSelector=null){rendering=true;current=ensureSelection();root.dataset.appearance=state.theme;root.style.colorScheme=state.theme==='system'?'light dark':state.theme;const oldBoard=root.querySelector('.s-board');if(oldBoard)observe.unobserve(oldBoard);const c=current,r=c.range;const outside=Boolean(r.valid&&c.box&&(c.box.window.fretMin<r.min||c.box.window.fretMax>r.max));const renderNotice=state.notice||(outside?'Учебная форма выходит за область показа. Её материал сохраняется целиком.':'');const materialLabel=c.box?formName(c.box):'Свободный диапазон';root.innerHTML='<div class="s-app"><div class="s-shell '+(!state.panel?'panel-closed':'')+'">'+navigation()+'<main class="s-main"><div class="s-heading"><div><span class="s-overline">ИЗУЧЕНИЕ ГРИФА</span><h2>'+pretty(state.root)+' · '+escape(c.structure.name)+'</h2><p class="s-context">'+escape(materialLabel)+'</p></div><button type="button" class="s-action" data-action="panel" aria-expanded="'+state.panel+'">Параметры</button></div><div class="s-modes" aria-label="Режимы грифа"><button type="button" class="s-mode is-current" aria-current="page">Изучение</button><button type="button" class="s-mode" data-nav="Задания">Задания</button><button type="button" class="s-mode" data-nav="Последовательности">Последовательности</button></div><div class="s-board-toolbar"><span class="s-board-caption">'+(r.valid?'Лады '+r.min+'–'+r.max+' · G–D–A–E':'Диапазон требует исправления')+'</span><div class="s-segmented" aria-label="Подписи на грифе">'+[['notes','Ноты'],['degrees','Ступени'],['hidden','Без подписей']].map(([key,label])=>'<button type="button" data-labels="'+key+'" aria-pressed="'+(state.labels===key)+'">'+label+'</button>').join('')+'</div></div>'+(renderNotice?'<p class="s-notice" role="status" style="margin:0 0 12px">'+escape(renderNotice)+(outside?' <button type="button" class="s-small-action" data-action="show-form">Показать целиком ↗</button>':'')+'</p>':'')+'<div class="s-board" aria-label="'+(r.valid?'Гриф от '+r.min+' до '+r.max+' лада, четыре струны G D A E':'Гриф недоступен до исправления диапазона')+'"></div><div class="s-legend"><span><i class="s-dot"></i>Тоника</span><span><i class="s-dot is-material"></i>Материал</span><span><i class="s-dot is-link"></i>Связь</span></div>'+inspector()+'<p class="s-help-line">Стрелки — перемещение фокуса · Enter / пробел — выбрать · Home / End — края диапазона</p></main>'+settings()+'</div>'+(state.dialog?'<section class="s-info-dialog" role="dialog" aria-modal="false" aria-labelledby="s-dialog-heading"><h3 id="s-dialog-heading">'+escape(state.dialog)+'</h3><p>Этот раздел доступен в приложении 1.4.0. Здесь рассматриваем только экран грифа; его навигационный вход сохранён.</p><button type="button" class="s-action" data-action="close-dialog">Вернуться к грифу</button></section>':'')+'</div>';const area=root.querySelector('.s-board');lastWidth=Math.round(area.getBoundingClientRect().width);drawBoard(lastWidth);observe.observe(area);if(focusSelector)root.querySelector(focusSelector)?.focus({preventScroll:true});rendering=false;}
  function activeNotes(){const c=current;return c.all.filter(n=>n.id===state.selected||(c.box?c.ids.has(n.id):n.inStructure));}
  function drawBoard(width){const area=root.querySelector('.s-board');if(!area||width<1||!current)return;const c=current,r=c.range;if(!r.valid){area.innerHTML='<div class="s-view-error"><h3>Проверь диапазон ладов</h3><p>Укажи целые границы от 0 до 24: первый лад не больше последнего.</p></div>';return;}const W=Math.round(width),H=346,left=42,right=W-30,usable=right-left;const large=activeNotes();let minimumGap=Infinity;for(const string of STRINGS){const row=large.filter(n=>n.string===string).sort((a,b)=>a.fret-b.fret);for(let i=1;i<row.length;i++)minimumGap=Math.min(minimumGap,row[i].fret-row[i-1].fret);}const cell=Math.max(34,minimumGap===1?58:34),capacity=Math.max(2,Math.floor(usable/cell));const parts=[];for(let from=r.min;from<=r.max;){const rows=Math.ceil((r.max-from+1)/capacity);let to=Math.min(r.max,from+Math.ceil((r.max-from+1)/rows)-1);if(c.box&&to>=c.box.window.fretMin&&to<c.box.window.fretMax&&from<=c.box.window.fretMin){if(c.box.window.fretMax-from+1<=capacity)to=Math.min(c.box.window.fretMax,r.max);else if(from<c.box.window.fretMin)to=c.box.window.fretMin-1;}parts.push({from,to});from=to+1;}const y=string=>70+STRINGS.indexOf(string)*74;area.innerHTML=parts.map((part,index)=>{const count=part.to-part.from+1,cw=usable/count,x=f=>left+(f-part.from+.5)*cw;let svg='<svg class="s-neck-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Лады '+part.from+'–'+part.to+', струны G D A E">';for(let f=part.from;f<=part.to;f++){const inBox=c.box&&f>=c.box.window.fretMin&&f<=c.box.window.fretMax;svg+='<rect data-fret-cell="'+f+'" x="'+(left+(f-part.from)*cw)+'" y="43" width="'+cw+'" height="277" fill="'+(inBox?'#b9d0b0':'transparent')+'" opacity="'+(inBox?'.075':'1')+'"/>'+(inBox?'<line x1="'+(x(f)-cw/2)+'" y1="43" x2="'+(x(f)+cw/2)+'" y2="43" stroke="#e1b778" stroke-width="2"/>':'')+'<text data-fret-label="'+f+'" x="'+x(f)+'" y="25" text-anchor="middle" fill="#c3d0bf" font-size="13">'+f+'</text><line x1="'+(x(f)+cw/2)+'" y1="44" x2="'+(x(f)+cw/2)+'" y2="319" stroke="#718a79" stroke-width="1.2"/>';if(f===0)svg+='<line x1="'+(x(f)+cw/2)+'" y1="44" x2="'+(x(f)+cw/2)+'" y2="319" stroke="#a4b4a1" stroke-width="4"/>';if([3,5,7,9,12,15,17,19,21,24].includes(f)){const cy=181;svg+='<circle cx="'+x(f)+'" cy="'+(f%12===0?cy-10:cy)+'" r="4" fill="#bdc9ba" opacity=".28"/>'+(f%12===0?'<circle cx="'+x(f)+'" cy="'+(cy+10)+'" r="4" fill="#bdc9ba" opacity=".28"/>':'');}}
    STRINGS.forEach((string,i)=>{const gauge=[1.2,1.8,2.6,3.4][i];svg+='<text x="18" y="'+(y(string)+5)+'" data-string-label="'+string+'" text-anchor="middle" font-size="16" fill="#e4edde">'+string+'</text><line x1="'+left+'" y1="'+(y(string)+1)+'" x2="'+right+'" y2="'+(y(string)+1)+'" stroke="#0b150f" stroke-width="'+(gauge+2)+'"/><line x1="'+left+'" y1="'+y(string)+'" x2="'+right+'" y2="'+y(string)+'" stroke="#abbcad" stroke-width="'+gauge+'"/>';});if(state.links&&c.selected&&c.anchor&&c.selected.id!==c.anchor.id&&c.anchor.fret>=part.from&&c.anchor.fret<=part.to&&c.selected.fret>=part.from&&c.selected.fret<=part.to&&state.strings.includes(c.anchor.string)){const ax=x(c.anchor.fret),ay=y(c.anchor.string),tx=x(c.selected.fret),ty=y(c.selected.string),cy=Math.min(330,Math.max(ay,ty)+30);svg+='<path d="M '+ax+' '+ay+' C '+ax+' '+cy+', '+tx+' '+cy+', '+tx+' '+ty+'" fill="none" stroke="#a4d6e9" stroke-width="2" stroke-linecap="round"/>';}svg+='</svg>';const local=c.all.filter(n=>n.fret>=part.from&&n.fret<=part.to);const markers=local.map(n=>{const selected=n.id===state.selected,material=c.box?c.ids.has(n.id):n.inStructure,big=material||selected;return '<button type="button" class="s-note '+(!big?'is-quiet ':'')+(n.isRoot&&big?'is-root ':'')+(selected?'is-selected ':'')+(selected&&state.links&&c.anchor&&n.id!==c.anchor.id?'is-target ':'')+(state.neighbor&&c.shared.has(n.id)?'is-shared':'')+'" data-note="'+n.id+'" aria-label="'+escape(noteLabel(n))+', '+(n.inStructure?'ступень '+pretty(n.degree):'вне структуры')+', струна '+n.string+', лад '+n.fret+'" aria-pressed="'+selected+'" tabindex="'+(n.id===state.focus?0:-1)+'" style="left:'+x(n.fret)+'px;top:'+y(n.string)+'px">'+(big&&state.labels!=='hidden'?escape(state.labels==='degrees'?pretty(n.degree||'—'):n.noteName):'')+(state.fingers&&c.box?.fingers[n.id]&&big?'<span class="s-finger">'+c.box.fingers[n.id]+'</span>':'')+'</button>';}).join('');return '<section class="s-board-part" aria-label="Часть '+part.from+'–'+part.to+'">'+(parts.length>1?'<div class="s-part-caption">Лады '+part.from+'–'+part.to+(index?' · продолжение':'')+'</div>':'')+'<div class="s-neck">'+svg+markers+'</div></section>';}).join('');}
  function selectPosition(id){if(!current.all.some(n=>n.id===id))return;state.selected=id;state.focus=id;state.picker=null;render('button[data-note="'+id+'"]');persist();}
  function changeMaterial(kind,value){const old=current.box,oldMin=old?.window.fretMin??0;if(kind==='root')state.root=value;else state.structure=value;const boxes=M.getBoxCatalogue(state.root,state.structure);if(old){const isPenta=state.structure.endsWith('pentatonic');const shape=isPenta?(kind==='root'&&old.selection.shapeId.startsWith('penta-')?old.selection.shapeId:state.structure==='major-pentatonic'?'penta-b':'penta-a'):old.selection.shapeId.startsWith('compact-')?old.selection.shapeId:'compact-e';const candidates=boxes.filter(b=>b.selection.shapeId===shape).sort((a,b)=>Math.abs(a.window.fretMin-oldMin)-Math.abs(b.window.fretMin-oldMin));const box=candidates[0]||boxes[0];state.box=box?boxKey(box):null;if(box)state.strings=STRINGS.filter(s=>box.positions.some(n=>n.string===s));}state.notice='';state.selected=null;state.focus=null;}
  function choose(kind,value){if(kind==='root'||kind==='structure')changeMaterial(kind,value);else if(kind==='box'){state.box=value==='free'?null:value;const box=current.boxes.find(b=>boxKey(b)===state.box);if(box){state.strings=STRINGS.filter(s=>box.positions.some(n=>n.string===s));state.selected=(box.positions.find(n=>n.isRoot)||box.positions[0]).id;state.focus=state.selected;const r=range();state.notice=r.valid&&(box.window.fretMin<r.min||box.window.fretMax>r.max)?'Часть выбранной формы находится вне области показа. Расширь диапазон, чтобы увидеть её целиком.':'';}else state.notice='Включён свободный диапазон.';}else state.theme=value;state.picker=null;render('#s-picker-'+kind);persist();}
  root.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;captureDetails();if(button.dataset.note){selectPosition(button.dataset.note);return;}if(button.dataset.position){selectPosition(button.dataset.position);return;}if(button.dataset.picker){const kind=button.dataset.picker;state.picker=state.picker===kind?null:kind;render(state.picker?'button[data-option="'+kind+'"][aria-selected=true]':'#s-picker-'+kind);return;}if(button.dataset.option){choose(button.dataset.option,button.dataset.value);return;}if(button.dataset.labels){state.labels=button.dataset.labels;state.picker=null;render('button[data-labels="'+state.labels+'"]');persist();return;}if(button.dataset.range){[state.min,state.max]=button.dataset.range.split(':');state.picker=null;render('button[data-range="'+button.dataset.range+'"]');persist();return;}if(button.dataset.direction){state.direction=button.dataset.direction;render('button[data-direction="'+state.direction+'"]');persist();return;}if(button.dataset.target){const target=relationTargets()[Number(button.dataset.target)]?.target;if(target)selectPosition(target.id);return;}if(button.dataset.nav){state.dialog=button.dataset.nav;state.picker=null;render('button[data-action="close-dialog"]');return;}if(button.dataset.action==='show-form'&&current.box&&current.range.valid){state.min=String(Math.min(current.range.min,current.box.window.fretMin));state.max=String(Math.max(current.range.max,current.box.window.fretMax));state.notice='';render('button[data-action="panel"]');persist();return;}if(button.dataset.action==='close-dialog'){state.dialog=null;render('button[data-action="panel"]');return;}if(button.dataset.action==='panel'){state.panel=!state.panel;state.picker=null;render('button[data-action="panel"]');persist();}});
  root.addEventListener('input',event=>{if(!event.target.dataset.rangeField)return;captureDetails();state[event.target.dataset.rangeField]=event.target.value;state.picker=null;render('#'+event.target.id);persist();});
  root.addEventListener('change',event=>{captureDetails();if(event.target.dataset.switch){const key=event.target.dataset.switch;state[key]=event.target.checked;render('input[data-switch="'+key+'"]');persist();return;}if(event.target.dataset.string){const string=event.target.dataset.string;state.strings=event.target.checked?[...new Set([...state.strings,string])]:state.strings.filter(x=>x!==string);state.box=null;state.notice='Струны изменены вручную: включена свободная область. Прежняя форма не обрезается.';render('input[data-string="'+string+'"]');persist();}});
  root.addEventListener('keydown',event=>{if(event.key==='Escape'){if(state.picker){const key=state.picker;state.picker=null;render('#s-picker-'+key);event.preventDefault();}else if(state.dialog){state.dialog=null;render('button[data-action="panel"]');event.preventDefault();}return;}const option=event.target.closest('button[data-option]');if(option&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Home','End'].includes(event.key)){const list=[...root.querySelectorAll('button[data-option="'+option.dataset.option+'"]')],index=list.indexOf(option);let next=event.key==='Home'?0:event.key==='End'?list.length-1:index+(['ArrowDown','ArrowRight'].includes(event.key)?1:-1)*(option.dataset.option==='root'&&['ArrowUp','ArrowDown'].includes(event.key)?4:1);if(option.dataset.option==='root'&&['ArrowUp','ArrowDown'].includes(event.key)&&(next<0||next>=list.length))next=index;next=Math.max(0,Math.min(list.length-1,next));list[next]?.focus();event.preventDefault();return;}const trigger=event.target.closest('button[data-picker]');if(trigger&&['ArrowDown','ArrowUp'].includes(event.key)){state.picker=trigger.dataset.picker;render('button[data-option="'+state.picker+'"][aria-selected=true]');event.preventDefault();return;}const note=event.target.closest('button[data-note]');if(!note)return;const n=current.all.find(n=>n.id===note.dataset.note);if(!n)return;if(event.key==='Enter'||event.key===' '){event.preventDefault();captureDetails();selectPosition(n.id);return;}const r=current.range,rows=STRINGS.filter(s=>state.strings.includes(s));let string=n.string,fret=n.fret;switch(event.key){case'ArrowLeft':fret=Math.max(r.min,fret-1);break;case'ArrowRight':fret=Math.min(r.max,fret+1);break;case'ArrowUp':string=rows[Math.max(0,rows.indexOf(string)-1)];break;case'ArrowDown':string=rows[Math.min(rows.length-1,rows.indexOf(string)+1)];break;case'Home':fret=r.min;break;case'End':fret=r.max;break;default:return;}event.preventDefault();state.focus=string+':'+fret;root.querySelectorAll('button[data-note]').forEach(el=>el.tabIndex=el.dataset.note===state.focus?0:-1);root.querySelector('button[data-note="'+state.focus+'"]')?.focus({preventScroll:true});});
  root.addEventListener('focusout',event=>{if(rendering||!state.picker)return;const picker=event.target.closest('.s-picker'),kind=state.picker;if(!picker||picker.contains(event.relatedTarget))return;queueMicrotask(()=>{if(rendering||state.picker!==kind||picker.contains(document.activeElement))return;state.picker=null;root.querySelectorAll('.s-popup').forEach(el=>el.remove());root.querySelectorAll('[data-picker]').forEach(el=>el.setAttribute('aria-expanded','false'));});});
  document.addEventListener('pointerdown',event=>{if(state.picker&&!event.target.closest('#studio-fretboard .s-picker')){captureDetails();state.picker=null;root.querySelectorAll('.s-popup').forEach(el=>el.remove());root.querySelectorAll('[data-picker]').forEach(el=>el.setAttribute('aria-expanded','false'));}});
  window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent;if(next?.revision==='r4'&&next.state){Object.assign(state,next.state,{picker:null,dialog:null});render();}});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>render()});tweak.addToggle(state,'panel',{label:'Панель параметров'});tweak.addToggle(state,'links',{label:'Связь с тоникой'});tweak.addToggle(state,'fingers',{label:'Номера пальцев'});}
})();
</script>
