    qa('[data-bpm-out]').forEach(el => { el.textContent = String(S.bpm); });
    qa('[data-bpm]').forEach(b => { b.disabled = locked() || (Number(b.dataset.bpm) < 0 ? S.bpm <= 40 : S.bpm >= 200); });
    qa('[data-lock]').forEach(el => { if (!el.matches('[data-bpm]')) el.disabled = locked() || (el.matches('[data-in-connect]') && S.input !== 'off'); });
    qa('[data-demo]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.demo === (S.tabs === 'other' ? 'other' : S.failMode ? 'fail' : 'ok'))));

    const kind = S.tabs === 'other' ? 'other' : S.save === 'error' ? 'error' : S.save === 'saving' ? 'saving' : 'ok';
    const headText = { ok: 'Сохранено', saving: 'Сохраняем…', error: 'Не сохранено', other: 'Только просмотр' }[kind];
    const head = root.querySelector('[data-save-head]');
    head.className = `v09-save is-${kind}`;
    root.querySelector('[data-save-head-text]').textContent = headText;
    shellStatus.textContent = { ok: '● Локально · сохранено', saving: '● Сохраняем…', error: '● Не сохранено', other: '● Только просмотр' }[kind];
    qa('[data-save-data]').forEach(el => { el.className = `is-${kind}`; });
    qa('[data-save-data-text]').forEach(el => { el.textContent = { ok: 'Сохранено: изменения записываются сразу.', saving: 'Сохраняем…', error: 'Последнее изменение не записано — см. сообщение вверху.', other: 'Сейчас данные записывает другая вкладка.' }[kind]; });
    qa('[data-tabs-line]').forEach(el => { el.textContent = S.tabs === 'other' ? 'Здесь только просмотр.' : 'Записывает эта вкладка; во второй вкладке будет только просмотр.'; });
    const c = S.counts;
    const copyList = `<li>настройки и тема</li><li>история занятий — <b>${c.history}</b> ${plural(c.history, 'запись', 'записи', 'записей')}</li><li>свои упражнения — <b>${c.own}</b></li><li>ритм-проекты — <b>${c.rhythm}</b></li><li>незаконченная практика — <b>${c.drafts}</b></li>`;
    qa('[data-copy-list]').forEach(el => { if (el.innerHTML !== copyList) el.innerHTML = copyList; });

    const html = bannersHtml();
    if (html !== lastBanners) {
      const hadFocus = root.querySelector('[data-banners]').contains(document.activeElement);
      root.querySelector('[data-banners]').innerHTML = html; lastBanners = html;
      if (hadFocus) (root.querySelector('[data-banners] button:not(:disabled)') || root.querySelector('[data-h1]')).focus();
    }

    const sums = {
      look: theme === 'dark' ? 'Тёмная' : 'Светлая',
      lesson: `${name(VIEWS, S.view)} · отсчёт ${S.countIn ? '4' : 'выкл'}`,
      data: { ok: 'Сохранено', saving: 'Сохраняем…', error: 'Не сохранено', other: 'Только просмотр' }[kind],
      input: { off: 'Отключён', starting: 'Подключаем…', on: 'Подключён · демо' }[S.input],
      about: `Версия ${VERSION.app}`,
    };
    qa('[data-sum]').forEach(el => { el.textContent = sums[el.dataset.sum]; });
    syncInput();
  }

  /* ---------- Аудиовход: демо-уровень без микрофона ---------- */
  // Четыре открытые струны: E1 41,20 · A1 55,00 · D2 73,42 · G2 98,00 Гц; отклонение в центах — для правдоподобия.
  const PLUCKS = [['E1', 41.2, 4], ['A1', 55, -6], ['D2', 73.42, 9], ['G2', 98, -3]];
  let inputTimer = null, startTimer = null, t0 = 0;
  function inputConnect() {
    if (S.input !== 'off' || locked()) return;
    S.input = 'starting'; S.notice = ''; sync();
    root.querySelector('[data-candidate-panel="' + root.dataset.candidate + '"] [data-in-stop]')?.focus();
    startTimer = setTimeout(() => {
      if (S.input !== 'starting') return;
      S.input = 'on'; t0 = performance.now();
      inputTimer = setInterval(tickInput, 100); sync();
    }, 700);
  }
  function inputStop(notice = 'Отключено. Чтобы проверить снова, нажми «Подключить».') {
    if (S.input === 'off') return;
    clearTimeout(startTimer); clearInterval(inputTimer); inputTimer = null;
    const hadFocus = document.activeElement?.matches?.('[data-in-stop]');
    S.input = 'off'; S.notice = notice; S.level = 0; S.pitch = null; sync();
    if (hadFocus) root.querySelector('[data-candidate-panel="' + root.dataset.candidate + '"] [data-in-connect]')?.focus();
  }
  function tickInput() {
    const t = (performance.now() - t0) / 1000, period = 2.6, k = Math.floor(t / period), ph = t - k * period;
    S.level = ph < 0.06 ? (ph / 0.06) * 0.78 : 0.78 * Math.exp(-(ph - 0.06) * 1.05) + 0.012;
    S.pitch = S.level > 0.14 && ph > 0.15 ? PLUCKS[k % 4] : null;
    syncInput();
  }
  function syncInput() {
    const on = S.input === 'on';
    const status = { off: S.notice || 'Не подключено. Доступ к звуку запрашивается только по кнопке «Подключить».', starting: 'Подключаем… В настоящем приложении браузер здесь спросит разрешение.', on: 'Подключено. Сигнал идёт на анализ, на динамики ничего не выводится.' }[S.input];
    qa('[data-in-status]').forEach(el => { if (el.textContent !== status) el.textContent = status; });
    qa('[data-in-demo]').forEach(el => { el.hidden = S.input === 'off'; el.textContent = 'демо: микрофон не используется'; });
    qa('[data-in-stop]').forEach(b => { b.disabled = S.input === 'off'; b.textContent = S.input === 'starting' ? 'Отменить' : 'Отключить'; });
    qa('[data-in-device]').forEach(s => { if (s.value !== S.device) s.value = S.device; });
    const pct = Math.round(Math.min(1, S.level / 0.88) * 88);
    qa('[data-in-level]').forEach(el => { el.style.width = `${on ? pct : 0}%`; });
    const levelText = !on ? '—' : S.level < 0.05 ? 'тишина' : S.level < 0.14 ? 'тихо' : 'хорошо';
    qa('[data-in-level-text]').forEach(el => { el.textContent = levelText; });
    qa('[data-in-level-wrap]').forEach(el => el.setAttribute('aria-label', `Уровень: ${levelText}`));
    const pitchHtml = on && S.pitch ? `<small>≈</small>${esc(S.pitch[0])}` : '—';
    qa('[data-in-pitch]').forEach(el => { if (el.innerHTML !== pitchHtml) el.innerHTML = pitchHtml; });
    const help = !on ? 'Подключи вход, чтобы увидеть высоту.' : S.pitch ? 'Примерно. Сверяй на слух: возможна ошибка на октаву.' : 'Сыграй одну протяжную ноту.';
    qa('[data-in-pitch-help]').forEach(el => { el.textContent = help; });
    const db = v => v > 0 ? `${num(20 * Math.log10(v)).replace('-', '−')} dBFS` : '—';
    const hz = S.pitch ? S.pitch[1] * 2 ** (S.pitch[2] / 1200) : 0;
    const d = {
      rms: on ? db(S.level * 0.34) : '—',
      peak: on ? db(S.level) : '—',
      hz: on && S.pitch ? `${num(hz, 2)} Гц · ${S.pitch[2] >= 0 ? '+' : '−'}${Math.abs(S.pitch[2])} ${plural(Math.abs(S.pitch[2]), 'цент', 'цента', 'центов')} от ${S.pitch[0]}` : 'нет устойчивой высоты',
      conf: on && S.pitch ? `${num(0.88 + 0.02 * (PLUCKS.indexOf(S.pitch)), 2)} из 1` : '—',
      rate: on ? '48 000 Гц' : 'нет подключения',
      frame: on ? '8192 отсчёта ≈ 170,67 мс при 48 000 Гц' : '8192 отсчёта; длительность — после подключения',
    };
    qa('[data-in-d]').forEach(el => { const v = d[el.dataset.inD]; if (el.textContent !== v) el.textContent = v; });
  }

  /* ---------- Диалоги «Скачать копию» и «Восстановить из копии» ---------- */
  let opener = null, step = null, confirmChecked = false;
  const cmpRow = (label, copy, now) => `<tr><td>${esc(label)}</td><td class="n">${copy}</td><td class="n">${now}</td></tr>`;
  function dialogHtml() {
    const c = S.counts;
    const close = label => `<button type="button" class="lr-btn" data-dlg="close">${esc(label)}</button>`;
    if (step === 'download') return `<div class="v09-dlg-top"><span class="lr-eyebrow">Резервная копия</span><span class="v09-demo">демо: файл не создаётся</span></div>
      <h2 id="v09-dlg-title" tabindex="-1">Скачать копию</h2>
      <p>Файл <span class="v09-code">bass-study-backup-2026-11-12.json</span> · около 186 КБ. Сохрани его вне браузера.</p>
      <ul class="v09-list"><li>настройки и тема</li><li>история занятий — <b>${c.history}</b> ${plural(c.history, 'запись', 'записи', 'записей')}</li><li>свои упражнения — <b>${c.own}</b></li><li>ритм-проекты — <b>${c.rhythm}</b></li><li>незаконченная практика — <b>${c.drafts}</b></li></ul>
      <p class="v09-help">Аудиофайлы и партитуры в копию не входят.</p>
      ${S.save === 'error' ? `<p class="v09-warn">Последнее изменение не записано. В копию попадёт только сохранённое — сначала можно повторить сохранение.</p>` : ''}
      <div class="v09-dlg-actions">${close('Отмена')}<button type="button" class="lr-btn lr-btn-primary" data-dlg="download-go">Скачать</button></div>`;
    if (step === 'pick') return `<div class="v09-dlg-top"><span class="lr-eyebrow">Шаг 1 из 3 · выбери файл</span><span class="v09-demo">демо</span></div>
      <h2 id="v09-dlg-title" tabindex="-1">Восстановить из копии</h2>
      <p>Сначала покажем, что внутри копии. Пока ты не подтвердишь замену, ничего не меняется.</p>
      <p class="v09-help">В макете вместо окна выбора файла — два примера:</p>
      <div class="v09-files">
        <button type="button" class="v09-file" data-dlg="pick-ok"><b>${esc(COPY.file)}</b><small>${esc(COPY.date)} · ${esc(COPY.size)}</small></button>
        <button type="button" class="v09-file" data-dlg="pick-old"><b>${esc(OLD.file)}</b><small>${esc(OLD.date)} · ${esc(OLD.size)} · прежняя версия данных</small></button>
      </div>
      <div class="v09-dlg-actions">${close('Отмена')}</div>`;
    if (step === 'preview') { const k = COPY.counts; return `<div class="v09-dlg-top"><span class="lr-eyebrow">Шаг 2 из 3 · проверь</span><span class="v09-demo">демо</span></div>
      <h2 id="v09-dlg-title" tabindex="-1">Что внутри копии</h2>
      <p><span class="v09-code">${esc(COPY.file)}</span> · сделана ${esc(COPY.date)}. Копия подходит. Предпросмотр ничего не изменил.</p>
      <table class="v09-cmp"><thead><tr><th scope="col">Данные</th><th scope="col" class="n">В копии</th><th scope="col" class="n">Сейчас</th></tr></thead><tbody>
        ${cmpRow('История занятий', k.history, c.history)}${cmpRow('Свои упражнения', k.own, c.own)}${cmpRow('Ритм-проекты', k.rhythm, c.rhythm)}${cmpRow('Незаконченная практика', k.drafts, c.drafts)}${cmpRow('Настройки и тема', 'есть', 'есть')}
      </tbody></table>
      <p class="v09-warn">Копия заменит всё сохранённое целиком — объединения нет. Сейчас записей истории больше, чем в копии: ${c.history - k.history > 0 ? `${c.history - k.history} ${plural(c.history - k.history, 'запись пропадёт', 'записи пропадут', 'записей пропадут')}` : 'новых записей нет'}. Перед заменой остановим звук и текущее упражнение. <button type="button" class="v09-inline" data-dlg="save-current">Сначала скачать текущую копию</button></p>
      <label class="v09-check"><input type="checkbox" data-dlg-confirm${confirmChecked ? ' checked' : ''}><span>Понимаю, что текущие данные будут заменены</span></label>
      <div class="v09-dlg-actions"><button type="button" class="lr-btn lr-btn-ghost v09-grow" data-dlg="back">← Другой файл</button>${close('Отмена')}<button type="button" class="lr-btn lr-btn-primary" data-dlg="replace"${confirmChecked ? '' : ' disabled'}>Заменить данные</button></div>`; }
    if (step === 'replacing') return `<div class="v09-dlg-top"><span class="lr-eyebrow">Шаг 3 из 3</span><span class="v09-demo">демо</span></div><h2 id="v09-dlg-title" tabindex="-1">Заменяем данные…</h2><p>Одна операция: либо заменится всё, либо ничего.</p>`;
    if (step === 'done') { const k = c; return `<div class="v09-dlg-top"><span class="lr-eyebrow">Шаг 3 из 3 · готово</span><span class="v09-demo">демо</span></div>
      <h2 id="v09-dlg-title" tabindex="-1">Данные восстановлены</h2>
      <p class="v09-ok">Всё заменено одной операцией из копии от ${esc(COPY.date)}: история — ${k.history} ${plural(k.history, 'запись', 'записи', 'записей')}, свои упражнения — ${k.own}, ритм-проекты — ${k.rhythm}. Настройки из копии уже действуют.</p>
      <p class="v09-help">Аудиофайлы и партитуры выбери заново в «Песнях».</p>
      <div class="v09-dlg-actions"><button type="button" class="lr-btn lr-btn-primary" data-dlg="close">Готово</button></div>`; }
    if (step === 'old') return `<div class="v09-dlg-top"><span class="lr-eyebrow">Шаг 2 из 3 · проверь</span><span class="v09-demo">демо</span></div>
      <h2 id="v09-dlg-title" tabindex="-1">Эта копия не подходит</h2>
      <p>Она сделана ${esc(OLD.date)} для прежней версии данных (${OLD.version}), а сейчас версия ${VERSION.data}. <strong>Ничего не изменилось.</strong></p>
      <p class="v09-note">Старые копии не загружаются: когда меняется устройство данных, сохранённое начинается заново. Подойдёт копия, скачанная в этой версии.</p>
      <div class="v09-dlg-actions"><button type="button" class="lr-btn lr-btn-ghost v09-grow" data-dlg="back">← Другой файл</button>${close('Закрыть')}</div>`;
    return '';
  }
  function showStep(next) {
    step = next;
    dialog.innerHTML = `<div class="v09-dlg">${dialogHtml()}</div>`;
    const target = { pick: '[data-dlg="pick-ok"]', done: '[data-dlg="close"]', download: '[data-dlg="download-go"]' }[step];
    (target && dialog.querySelector(target) || dialog.querySelector('#v09-dlg-title')).focus();
  }
  function openDialog(kind, from) {
    if (locked()) return;
    opener = from; confirmChecked = false;
    dialog.showModal();
    showStep(kind === 'download' ? 'download' : 'pick');
  }
  function closeDialog() { if (dialog.open) dialog.close(); }
  dialog.addEventListener('close', () => {
    const back = opener; opener = null; step = null; dialog.innerHTML = '';
    if (back && back.isConnected) back.focus();
  });
  dialog.addEventListener('cancel', event => { if (step === 'replacing') event.preventDefault(); });
  dialog.addEventListener('change', event => {
    if (!event.target.matches('[data-dlg-confirm]')) return;
    confirmChecked = event.target.checked;
    dialog.querySelector('[data-dlg="replace"]').disabled = !confirmChecked;
  });
  dialog.addEventListener('click', event => {
    if (event.target === dialog) return; // щелчок по фону не закрывает: решение принимает кнопка
    const b = event.target.closest('[data-dlg]');
    if (!b || b.disabled) return;
    const action = b.dataset.dlg;
    if (action === 'close') closeDialog();
    else if (action === 'download-go') { closeDialog(); toast('Копия скачана бы как bass-study-backup-2026-11-12.json (демо: файл не создаётся).'); }
    else if (action === 'pick-ok') { confirmChecked = false; showStep('preview'); }
    else if (action === 'pick-old') showStep('old');
    else if (action === 'back') showStep('pick');
    else if (action === 'save-current') { b.textContent = 'Текущая копия скачана (демо)'; b.disabled = true; }
    else if (action === 'replace') {
      showStep('replacing');
      inputStop('Вход отключён перед восстановлением данных.');
      setTimeout(() => { S.counts = { ...COPY.counts }; S.save = 'ok'; S.failed = ''; sync(); showStep('done'); }, 700);
    }
  });

  /* ---------- Навигация кандидатов ---------- */
  function jumpA(id, focus = true) {
    const sec = root.querySelector(`#a-sec-${id}`);
    if (sec.tagName === 'DETAILS') sec.open = true;
    const top = main.scrollTop + sec.getBoundingClientRect().top - main.getBoundingClientRect().top - 8;
    main.scrollTo({ top, behavior: 'smooth' });
    qa('[data-jump]').forEach(b => b.setAttribute('aria-current', String(b.dataset.jump === id)));
    spyHold = performance.now() + 700;
    if (focus) (sec.querySelector('summary') || sec.querySelector('h2')).focus({ preventScroll: true });
  }
  let spyHold = 0;
  main.addEventListener('scroll', () => {
    if (root.dataset.candidate !== 'a' || performance.now() < spyHold) return;
    const mTop = main.getBoundingClientRect().top;
    let current = 'look';
    root.querySelectorAll('[data-sec]').forEach(sec => { if (sec.getBoundingClientRect().top - mTop <= 60) current = sec.dataset.sec; });
    if (main.scrollTop + main.clientHeight >= main.scrollHeight - 4) current = SECTIONS[SECTIONS.length - 1][0];
    qa('[data-jump]').forEach(b => b.setAttribute('aria-current', String(b.dataset.jump === current)));
  }, { passive: true });

  function selectB(id, focusTab = false) {
    S.bTab = id;
    qa('[data-btab]').forEach(b => { const on = b.dataset.btab === id; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; });
    qa('[data-bpane]').forEach(p => { p.hidden = p.dataset.bpane !== id; });
    main.scrollTop = 0;
    if (focusTab) root.querySelector(`#b-tab-${id}`).focus();
  }
  root.querySelector('.v09b-list').addEventListener('keydown', event => {
    const ids = SECTIONS.map(s => s[0]);
    const i = ids.indexOf(S.bTab);
    const next = { ArrowDown: ids[(i + 1) % ids.length], ArrowUp: ids[(i - 1 + ids.length) % ids.length], Home: ids[0], End: ids[ids.length - 1] }[event.key];
    if (!next) return;
    event.preventDefault(); selectB(next, true);
  });

  /* ---------- События ---------- */
  root.addEventListener('click', event => {
    const t = event.target.closest('button');
    if (!t || t.disabled || dialog.contains(t)) return;
    if (t.matches('[data-lr-theme]')) { commit('Тема'); sync(); return; }
    if (t.dataset.set) { S[t.dataset.set] = t.dataset.v; commit(t.dataset.set === 'view' ? 'Вид экрана игры' : 'Подписи на грифе'); return; }
    if (t.dataset.switch) { S[t.dataset.switch] = !S[t.dataset.switch]; commit(t.dataset.switch === 'countIn' ? 'Отсчёт перед стартом' : 'Вид нового упражнения'); return; }
    if (t.dataset.bpm) { S.bpm = Math.min(200, Math.max(40, S.bpm + Number(t.dataset.bpm))); commit('Темп нового упражнения'); return; }
    if (t.dataset.demo) {
      const d = t.dataset.demo;
      if (d === 'other') { S.tabs = 'other'; inputStop('Вход отключён: управление перешло к другой вкладке.'); }
      else { S.tabs = 'own'; S.failMode = d === 'fail'; if (d === 'fail') { S.save = 'error'; S.failed = S.failed || 'Темп нового упражнения'; } }
      sync(); return;
    }
    if (t.matches('[data-retry]')) { retry(); return; }
    if (t.matches('[data-take]')) { S.tabs = 'own'; sync(); root.querySelector('[data-h1]').focus(); toast('Теперь данные записывает эта вкладка. Та сохранила своё и перешла в просмотр.'); return; }
    if (t.matches('[data-recheck]')) { toast('Другая вкладка всё ещё открыта. Закрой её или нажми «Передать сюда».'); return; }
    if (t.dataset.open) { openDialog(t.dataset.open, t); return; }
    if (t.matches('[data-in-connect]')) { inputConnect(); return; }
    if (t.matches('[data-in-stop]')) { inputStop(S.input === 'starting' ? 'Подключение отменено.' : undefined); return; }
    if (t.dataset.jump) { jumpA(t.dataset.jump); return; }
    if (t.dataset.btab) { selectB(t.dataset.btab); return; }
    if (t.classList.contains('lr-nav-item') && !t.hasAttribute('aria-current')) {
      inputStop('Вход отключён: ты уходил со страницы настроек.');
      toast('Макет: другие разделы — в своих референсах. При уходе из «Настроек» аудиовход отключается.');
    }
  });
  root.addEventListener('change', event => {
    if (!event.target.matches('[data-in-device]')) return;
    S.device = event.target.value;
    if (S.input !== 'off') inputStop('Устройство сменено — подключение остановлено. Нажми «Подключить» снова.');
    commit('Устройство аудиовхода');
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) inputStop('Вкладка была скрыта — вход отключён.'); });
  // Смена темы из панели рецензии тоже отражается в сводке раздела B.
  new MutationObserver(() => sync()).observe(root, { attributes: true, attributeFilter: ['data-theme', 'data-candidate'] });

  L.mount(root, { candidates: ['a', 'b'] });
  selectB('look');
  sync();
})();
</script>
