<style>
  #studio-lesson .q-scene{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;}
  #studio-lesson .q-head{display:flex;flex-direction:column;gap:3px;}
  #studio-lesson .q-back{border:0;background:none;padding:0;color:var(--s-muted);font-size:12px;text-align:left;align-self:flex-start;}
  #studio-lesson .q-title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  #studio-lesson .q-chips{display:inline-flex;gap:6px;flex-wrap:wrap;align-self:center;}
  #studio-lesson .q-note{font-size:12px;color:var(--s-muted);}
  #studio-lesson .q-panel{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;}
  /* Строка прогресса и опций */
  #studio-lesson .q-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  #studio-lesson .q-progress{display:flex;align-items:center;gap:12px;}
  #studio-lesson .q-progress strong{font-size:15px;font-variant-numeric:tabular-nums;}
  #studio-lesson .q-dots{display:flex;gap:5px;list-style:none;margin:0;padding:0;}
  #studio-lesson .q-dots li{width:22px;height:8px;border-radius:4px;background:var(--s-line);}
  #studio-lesson .q-dots li.is-current{background:var(--s-line-strong);}
  #studio-lesson .q-dots li.q-st-self{background:var(--s-green);}
  #studio-lesson .q-dots li.q-st-fix{background:var(--s-gold);}
  #studio-lesson .q-dots li.q-st-shown{background:var(--s-info);}
  #studio-lesson .q-dots li.q-st-skip{background:transparent;box-shadow:inset 0 0 0 1.5px var(--s-line-strong);}
  #studio-lesson .q-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;}
  #studio-lesson .q-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  #studio-lesson .q-tools .lr-toggle{font-size:13px;padding:6px 11px;}
  #studio-lesson .q-tools .lr-toggle b{font-weight:700;}
  /* Вопрос */
  #studio-lesson .q-ask{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 18px;}

  #studio-lesson .q-question{font-size:30px;line-height:1.15;font-weight:680;letter-spacing:-.6px;}

  #studio-lesson .q-cue[hidden]{display:none;}

  #studio-lesson .q-cue small{font-size:11px;color:var(--s-muted);max-width:280px;}
  /* Действия и отклик */
  #studio-lesson .q-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  #studio-lesson .q-feedback{flex:1 1 360px;min-height:40px;display:flex;align-items:center;font-size:14px;border-left:3px solid var(--s-line);padding:2px 0 2px 12px;color:var(--s-muted);}
  #studio-lesson .q-feedback[data-tone="ok"]{border-color:var(--s-green);color:var(--s-ink);}
  #studio-lesson .q-feedback[data-tone="err"]{border-color:var(--s-gold);color:var(--s-ink);}
  #studio-lesson .q-feedback[data-tone="shown"]{border-color:var(--s-info);color:var(--s-ink);}
  #studio-lesson .q-buttons{display:flex;gap:8px;flex-wrap:wrap;}
  #studio-lesson .q-buttons .lr-btn{padding:9px 14px;font-size:14px;}
  #studio-lesson .q-buttons [hidden]{display:none;}
  #studio-lesson .lr-btn:disabled{opacity:.45;cursor:default;}
  /* Кандидат A: ответ кликом по крупному грифу */
  #studio-lesson .qa-wrap{position:relative;}
  #studio-lesson .qa-hit{position:absolute;inset:0;}
  #studio-lesson .qa-cell{position:absolute;border:0;background:none;padding:0;border-radius:12px;outline:none;}
  #studio-lesson .qa-dot{position:absolute;left:50%;top:50%;width:var(--qa-dot);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 17px/1 'Segoe UI',Arial;color:var(--s-neck-text);border:2px solid transparent;}
  #studio-lesson .qa-cell:hover .qa-dot{border-color:var(--s-neck-muted);border-style:dashed;}
  #studio-lesson .qa-cell:focus-visible .qa-dot{border:3px solid var(--s-neck-text);box-shadow:0 0 0 3px var(--s-neck),0 0 0 6px var(--s-focus);}
  #studio-lesson .qa-cell[aria-disabled="true"]{cursor:default;}
  #studio-lesson .qa-cell[aria-disabled="true"]:hover .qa-dot{border-color:transparent;}
  #studio-lesson .qa-cell.is-wrong .qa-dot{border:3px solid var(--s-neck-text);background:var(--s-neck);color:var(--s-neck-text);}
  #studio-lesson .qa-cell.is-found .qa-dot,#studio-lesson .qa-cell.is-found:hover .qa-dot{border:5px solid var(--s-playing);}
  #studio-lesson .qa-cell.is-shown .qa-dot,#studio-lesson .qa-cell.is-shown:hover .qa-dot{border:4px dashed var(--s-playing);}
  #studio-lesson .qa-cell.is-found:not(.is-final) .qa-dot{background:var(--s-playing);color:var(--s-root-ink);}
  #studio-lesson .qa-cell.is-final.is-wrong .qa-dot{background:transparent;border-color:transparent;}
  #studio-lesson .qa-cell.is-final.is-wrong .qa-dot::after{content:'✕';position:absolute;right:-8px;top:-8px;width:20px;height:20px;border-radius:50%;background:var(--s-neck);color:var(--s-neck-text);border:2px solid var(--s-neck-text);font-size:11px;display:flex;align-items:center;justify-content:center;}
  #studio-lesson .qa-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--s-muted);}
  /* Кандидат B: карточка и кнопки ступеней */
  #studio-lesson .qb-ask{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);}
  #studio-lesson .qb-board{padding:6px 8px 4px;}
  #studio-lesson .qb-pad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;}
  #studio-lesson .qb-deg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:96px;border:2px solid var(--s-line-strong);border-radius:14px;background:var(--s-input);}
  #studio-lesson .qb-deg strong{font-size:38px;line-height:1;font-weight:700;}
  #studio-lesson .qb-deg small{font-size:12px;color:var(--s-muted);}
  #studio-lesson .qb-deg:hover{background:var(--s-hover);}
  #studio-lesson .qb-deg[aria-disabled="true"]{cursor:default;opacity:.5;}
  #studio-lesson .qb-deg[aria-disabled="true"]:hover{background:var(--s-input);}
  #studio-lesson .qb-deg.is-wrong{opacity:1;border-style:dashed;border-color:var(--s-gold);background:var(--s-gold-soft);}
  #studio-lesson .qb-deg.is-wrong strong{text-decoration:line-through;text-decoration-thickness:3px;}
  #studio-lesson .qb-deg.is-right,#studio-lesson .qb-deg.is-right:hover{opacity:1;border-color:var(--s-green);background:var(--s-green);color:var(--s-on-green);}
  #studio-lesson .qb-deg.is-right small{color:inherit;}
  #studio-lesson .qb-deg.is-shown,#studio-lesson .qb-deg.is-shown:hover{opacity:1;border-style:dashed;border-color:var(--s-info);background:var(--s-info-soft);}
  /* Итог серии */
  #studio-lesson .q-summary{display:flex;flex-direction:column;gap:12px;}
  #studio-lesson .q-summary[hidden]{display:none;}
  #studio-lesson .q-panel.is-summary .q-live,#studio-lesson .q-panel.is-summary .q-tools{display:none;}
  #studio-lesson .q-sum-head h2{font-size:24px;font-weight:650;letter-spacing:-.4px;}
  #studio-lesson .q-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;}
  #studio-lesson .q-tile{border:1px solid var(--s-line);border-radius:12px;padding:10px 14px;background:var(--s-panel);display:flex;flex-direction:column;gap:2px;border-top-width:4px;}
  #studio-lesson .q-tile strong{font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums;}
  #studio-lesson .q-tile span{font-size:12px;color:var(--s-muted);}
  #studio-lesson .q-tile.q-st-self{border-top-color:var(--s-green);}
  #studio-lesson .q-tile.q-st-fix{border-top-color:var(--s-gold);}
  #studio-lesson .q-tile.q-st-err{border-top-color:var(--s-line-strong);}
  #studio-lesson .q-tile.q-st-shown{border-top-color:var(--s-info);}
  #studio-lesson .q-tile.q-st-skip,#studio-lesson .q-tile.q-st-none{border-top-style:dashed;border-top-color:var(--s-line-strong);}
  #studio-lesson .q-list{list-style:none;margin:0;padding:0;border:1px solid var(--s-line);border-radius:12px;overflow:hidden;}
  #studio-lesson .q-list li{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,auto) auto;gap:12px;align-items:center;padding:7px 14px;border-top:1px solid var(--s-line);font-size:13px;}
  #studio-lesson .q-list li:first-child{border-top:0;}
  #studio-lesson .q-list .q-num{color:var(--s-muted);font-variant-numeric:tabular-nums;}
  #studio-lesson .q-list .q-ans{font-weight:650;}
  #studio-lesson .q-tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
  #studio-lesson .q-status{display:inline-flex;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:650;border:1px solid var(--s-line-strong);color:var(--s-ink);}
  #studio-lesson .q-status.q-st-self{border-color:var(--s-green);background:var(--s-green-soft);}
  #studio-lesson .q-status.q-st-fix{border-color:var(--s-gold);background:var(--s-gold-soft);}
  #studio-lesson .q-status.q-st-shown{border-color:var(--s-info);background:var(--s-info-soft);}
  #studio-lesson .q-status.q-st-skip,#studio-lesson .q-status.q-st-none{border-style:dashed;color:var(--s-muted);}
  #studio-lesson .q-sum-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  #studio-lesson .q-sum-actions .lr-btn{padding:9px 14px;font-size:14px;}
  @media (max-width:1100px){#studio-lesson .q-question{font-size:26px;}#studio-lesson .qb-deg{min-height:84px;}#studio-lesson .qb-deg strong{font-size:32px;}}
</style>
<div id="studio-lesson" data-candidate="a"></div>
<script>
(() => {
  const L = window.LessonRef;
  const ex = L.material.ex1;
  const root = document.getElementById('studio-lesson');
  const byId = new Map(ex.notes.map(note => [note.id, note]));
  const FORM = ex.formB.ids.map(id => byId.get(id));
  const IN_FORM = new Set(ex.formB.ids);
  const FINGER = ex.formB.fingers;
  const STRINGS = ['G', 'D', 'A', 'E'];
  const DEGREES = ['1', 'b3', '4', '5', 'b7'];
  const INTERVAL = { 1: 'тоника', b3: 'малая терция, +3 полутона от A', 4: 'кварта, +5 полутонов', 5: 'квинта, +7 полутонов', b7: 'малая септима, +10 полутонов' };
  const degTitle = d => d === '1' ? 'тонику 1' : L.deg(d);
  const pos = id => id.replace(':', '/');
  const name = id => byId.get(id).name;
  const STATUS = {
    self: ['Самостоятельно', 'q-st-self'], corrected: ['С исправлением', 'q-st-fix'],
    shown: ['Показан ответ', 'q-st-shown'], skipped: ['Пропущен', 'q-st-skip'], none: ['Без ответа', 'q-st-none'],
  };
  const CUE_STEP_MS = 600; // три доли сигнала: тоника → тишина → нота (в макете без звука)

  const header = `<header class="q-head">
    <button type="button" class="q-back">← Занятие · план на сегодня, шаг 4 из 4</button>
    <div class="q-title-row"><h1 class="lr-h1">Проверь себя: ступени формы</h1><span class="lr-sub">Am · форма B · лады 7–10 · 6 вопросов · ≈3 мин</span><span class="q-chips"><span class="lr-chip lr-chip-concept">Ступени ♭3 · ♭7</span><span class="lr-chip lr-chip-concept">Форма B</span></span></div>
    <p class="q-note">Это проверка знаний на экране — игру на басу она не оценивает.</p>
  </header>`;

  const CUE = `<div class="q-cue" data-q-cue hidden><button type="button" class="lr-btn" data-q-listen>▶ Прослушать</button><ol aria-label="Сигнал"><li>Тоника A</li><li>пауза</li><li>Нота ?</li></ol><small data-q-listens>В макете звука нет: сигнал показан шагами. Ответы откроются после его конца.</small></div>`;
  /** Общая разметка кандидата: прогресс, опции, вопрос, ответ, действия, итог. */
  const panel = ({ id, kind, tools = '', askAside = '', askClass = '', cueAside = false, answer }) => `<div class="q-panel" data-quiz="${id}">
    <div class="q-bar">
      <div class="q-progress"><strong data-q-count>Вопрос 1 из 6</strong><ol class="q-dots" data-q-dots aria-label="Ход серии"></ol></div>
      <div class="q-tools"><button type="button" class="lr-toggle" data-q-ear aria-pressed="false" title="Слух — опция вопроса: сначала тоника, потом нота">♪ <b>+ слух</b></button>${tools}<button type="button" class="lr-btn lr-btn-ghost" data-q-finish title="Неотвеченные вопросы попадут в итог как «без ответа»">Завершить серию</button></div>
    </div>
    <div class="q-live">
      <div class="q-panel">
        <div class="q-ask lr-card ${askClass}">
          <div class="q-ask-copy"><span class="lr-eyebrow" data-q-kind>${kind}</span><h2 class="q-question" data-q-title></h2><p class="lr-sub" data-q-sub></p>
            ${cueAside ? '' : CUE}
          </div>
          ${cueAside ? CUE : askAside}
        </div>
        ${answer}
        <div class="q-actions">
          <p class="q-feedback" data-q-feedback aria-live="polite"></p>
          <div class="q-buttons"><button type="button" class="lr-btn" data-q-show>Показать ответ</button><button type="button" class="lr-btn" data-q-skip>Пропустить</button><button type="button" class="lr-btn lr-btn-primary" data-q-next hidden>Дальше → <span class="lr-kbd">Enter</span></button></div>
        </div>
      </div>
    </div>
    <section class="q-summary" data-q-summary hidden aria-live="polite"></section>
  </div>`;

  /* Кандидат A: крупный гриф 5–12, клик по позиции. Геометрия повторяет L.fretboard. */
  const A_WIN = { fretMin: 5, fretMax: 12 }, A_W = 1000, A_M = 48;
  const geo = (() => {
    const left = 34, right = 14, top = 26, rowGap = A_M * 1.32;
    const height = top + A_M * 0.45 + rowGap * 3 + A_M * 0.5 + 12;
    const cell = (A_W - left - right) / (A_WIN.fretMax - A_WIN.fretMin + 1);
    return { height, cell, rowGap, x: f => left + (f - A_WIN.fretMin + 0.5) * cell, y: s => top + A_M * 0.45 + STRINGS.indexOf(s) * rowGap };
  })();
  const CELLS = [];
  for (const s of STRINGS) for (let f = A_WIN.fretMin; f <= A_WIN.fretMax; f++) CELLS.push(`${s}:${f}`);
  const cellHtml = CELLS.map(id => {
    const [s, f] = id.split(':');
    const w = geo.cell * 0.9, h = geo.rowGap * 0.94;
    const style = `left:${((geo.x(+f) - w / 2) / A_W * 100).toFixed(3)}%;top:${((geo.y(s) - h / 2) / geo.height * 100).toFixed(3)}%;width:${(w / A_W * 100).toFixed(3)}%;height:${(h / geo.height * 100).toFixed(3)}%`;
    return `<button type="button" class="qa-cell" data-cell="${id}" tabindex="-1" aria-label="Струна ${s}, лад ${f}" style="${style}"><span class="qa-dot"></span></button>`;
  }).join('');
  const panelA = panel({
    id: 'a', kind: 'Найди на грифе', cueAside: true,
    tools: `<button type="button" class="lr-toggle" data-qa-hint aria-pressed="true" title="Подсказка: контуры позиций формы B без подписей">◌ Контуры формы B</button>`,
    answer: `<div class="lr-board"><div class="qa-wrap" style="--qa-dot:${(A_M / geo.cell / 0.9 * 100).toFixed(2)}%"><div data-qa-svg></div><div class="qa-hit" role="group" aria-label="Гриф для ответа, лады 5–12: стрелки — по позициям, Enter — ответ">${cellHtml}</div></div></div>
      <div class="qa-foot"><span>Клик по позиции — ответ · <span class="lr-kbd">←</span> <span class="lr-kbd">→</span> <span class="lr-kbd">↑</span> <span class="lr-kbd">↓</span> по позициям, <span class="lr-kbd">Enter</span> — ответ</span><span data-qa-legend></span></div>`,
  });

  /* Кандидат B: карточка с компактным грифом и пять кнопок ступеней. */
  const panelB = panel({
    id: 'b', kind: 'Назови ступень', askClass: 'qb-ask',
    askAside: `<div class="lr-board qb-board"><div data-qb-svg></div></div>`,
    answer: `<div class="qb-pad" role="group" aria-label="Ступени от тоники A: клавиши 1–5">${DEGREES.map((d, i) => `<button type="button" class="qb-deg" data-choice="${i}" aria-keyshortcuts="${i + 1}"><strong>${L.esc(L.deg(d))}</strong><small><span class="lr-kbd">${i + 1}</span></small></button>`).join('')}</div>`,
  });

  root.innerHTML = L.shell('lesson', `<section class="q-scene">${header}<div data-candidate-panel="a">${panelA}</div><div data-candidate-panel="b">${panelB}</div></section>`);
  L.mount(root, { candidates: ['a', 'b'] });
  const themeOf = () => root.dataset.theme || 'light';
  root.querySelector('.q-back').addEventListener('click', () => { location.href = `lesson-r2-vis10.html?theme=${themeOf()}`; });

  /**
   * Движок серии. Цель вопроса живёт только в замыкании (def + spec.targets),
   * в DOM до ответа попадают координаты и состояния выбора, но не правильный ответ.
   */
  function createQuiz(el, spec) {
    const $ = s => el.querySelector(s);
    const timers = [];
    let series = [], results = [], index = 0, cur = null, ear = false, earPending = null;
    const stopCue = () => { while (timers.length) clearTimeout(timers.pop()); if (cur) { cur.listening = false; cur.cueStep = -1; } };

    function startSeries(defs) {
      stopCue();
      series = defs;
      results = defs.map(() => ({ status: 'none', wrong: 0, listens: 0, ear: false, hint: false, done: false }));
      index = 0;
      el.classList.remove('is-summary');
      $('[data-q-summary]').hidden = true;
      begin();
    }
    function begin() {
      stopCue();
      if (earPending !== null) { ear = earPending; earPending = null; }
      cur = { def: series[index], ear, wrong: 0, wrongSet: new Set(), found: new Set(), done: false, status: null, heard: false, listening: false, listens: 0, cueStep: -1, attempts: 0, hint: false, msg: '', tone: '' };
      spec.onBegin?.(cur);
      render();
    }
    const record = () => Object.assign(results[index], { wrong: cur.wrong, listens: cur.listens, ear: cur.ear, hint: cur.hint });
    function finish(status, msg, tone) {
      stopCue();
      cur.done = true; cur.status = status; cur.msg = msg; cur.tone = tone;
      Object.assign(record(), { status, done: true });
      render();
    }
    function answer(choice) {
      if (!cur || cur.done) return;
      if (cur.ear && !cur.heard) { cur.msg = cur.listening ? 'Дослушай сигнал — ответы откроются после его конца.' : 'Сначала прослушай сигнал — ответы откроются после его конца.'; cur.tone = ''; render(); return; }
      const verdict = spec.judge(cur, choice);
      if (verdict.repeat) { cur.msg = verdict.msg; cur.tone = ''; render(); return; }
      cur.attempts++;
      if (verdict.ok && verdict.final) {
        const status = cur.wrong ? 'corrected' : 'self';
        finish(status, `${status === 'self' ? 'Верно, с первой попытки.' : `Верно, с исправлением (ошибок: ${cur.wrong}).`} ${spec.rule(cur)}`, 'ok');
      } else if (verdict.ok) {
        cur.msg = verdict.msg; cur.tone = 'ok'; render();
      } else {
        cur.wrong++; record();
        cur.msg = verdict.msg; cur.tone = 'err'; render();
      }
    }
    function show() {
      if (!cur || cur.done) return;
      finish('shown', `Ответ показан: ${spec.rule(cur)} В итоге — «показан ответ», не самостоятельно.`, 'shown');
    }
    function skip() {
      if (!cur || cur.done) return;
      stopCue(); Object.assign(record(), { status: 'skipped', done: true });
      next();
    }
    function next() {
      index++;
      if (index >= series.length) summary(); else begin();
    }
    function listen() {
      if (!cur || cur.done || !cur.ear || cur.listening) return;
      cur.listening = true; cur.cueStep = 0; cur.msg = ''; render();
      [1, 2, 3].forEach(step => timers.push(setTimeout(() => {
        if (!cur.listening) return;
        if (step < 3) { cur.cueStep = step; render(); return; }
        cur.listening = false; cur.cueStep = -1; cur.heard = true; cur.listens++; record();
        cur.msg = cur.listens > 1 ? `Повтор прослушивания (${cur.listens}) — не ошибка и не показ ответа.` : 'Сигнал закончился — отвечай.';
        cur.tone = ''; render();
      }, CUE_STEP_MS * step)));
    }
    function toggleEar() {
      const on = !(earPending ?? ear);
      if (cur && !cur.done && cur.attempts === 0 && !cur.heard) {
        stopCue(); ear = on; earPending = null;
        cur.ear = on; cur.msg = on ? 'Слух включён для этого вопроса.' : ''; cur.tone = '';
        spec.onBegin?.(cur); render();
        if (on) $('[data-q-listen]').focus(); // Пробел/Enter дальше слушают сигнал, а не переключают опцию
      } else {
        earPending = on === ear ? null : on;
        if (cur && !cur.done) { cur.msg = `${on ? 'Слух' : 'Без слуха'} — со следующего вопроса: на этот ты уже начал отвечать.`; cur.tone = ''; }
        render();
      }
    }

    function render() {
      const earOn = earPending ?? ear;
      $('[data-q-ear]').setAttribute('aria-pressed', String(earOn));
      $('[data-q-count]').textContent = el.classList.contains('is-summary') ? `Итог · ${series.length} из ${series.length}` : `Вопрос ${index + 1} из ${series.length}`;
      $('[data-q-dots]').innerHTML = results.map((r, i) => {
        const cls = r.done ? STATUS[r.status][1] : i === index && !el.classList.contains('is-summary') ? 'is-current' : '';
        const label = r.done ? STATUS[r.status][0] : i === index ? 'текущий' : 'впереди';
        return `<li class="${cls}" title="Вопрос ${i + 1}: ${L.esc(label)}"><span class="q-sr">Вопрос ${i + 1}: ${L.esc(label)}</span></li>`;
      }).join('');
      if (!cur || el.classList.contains('is-summary')) return;
      const text = spec.text(cur);
      $('[data-q-kind]').textContent = text.kind;
      $('[data-q-title]').textContent = text.title;
      $('[data-q-sub]').textContent = text.sub;
      const cue = $('[data-q-cue]');
      cue.hidden = !cur.ear || cur.done;
      cue.querySelectorAll('li').forEach((li, i) => li.classList.toggle('is-on', cur.listening && cur.cueStep === i));
      const listenBtn = $('[data-q-listen]');
      listenBtn.disabled = cur.listening;
      listenBtn.innerHTML = cur.listening ? '♪ Звучит…' : cur.heard ? `↻ Ещё раз <span class="lr-kbd">Пробел</span>` : `▶ Прослушать <span class="lr-kbd">Пробел</span>`;
      $('[data-q-listens]').textContent = cur.heard ? `Прослушано: ${cur.listens} · в макете без звука` : 'В макете звука нет: сигнал показан шагами. Ответы откроются после его конца.';
      const fb = $('[data-q-feedback]');
      fb.textContent = cur.msg || spec.idle(cur);
      fb.dataset.tone = cur.tone;
      $('[data-q-show]').disabled = cur.done;
      $('[data-q-skip]').disabled = cur.done;
      $('[data-q-next]').hidden = !cur.done;
      $('[data-q-next]').innerHTML = index + 1 >= series.length ? 'К итогу → <span class="lr-kbd">Enter</span>' : 'Дальше → <span class="lr-kbd">Enter</span>';
      spec.renderAnswer(cur, { locked: cur.done || (cur.ear && !cur.heard) });
    }

    function summary() {
      stopCue();
      el.classList.add('is-summary');
      const count = s => results.filter(r => r.status === s).length;
      const wrong = results.reduce((sum, r) => sum + r.wrong, 0);
      const hard = series.filter((_, i) => results[i].status !== 'self');
      const tiles = [['self', count('self'), 'Самостоятельно', 'верно с первой попытки, без показа'], ['fix', count('corrected'), 'С исправлением', 'верно после ошибки'], ['err', wrong, 'Ошибочных ответов', 'всего неверных нажатий'], ['shown', count('shown'), 'Показано', 'ответ открыт кнопкой'], ['skip', count('skipped'), 'Пропущено', 'вернутся в «трудные»']];
      if (count('none')) tiles.push(['none', count('none'), 'Без ответа', 'серия завершена раньше']);
      const rows = series.map((def, i) => {
        const r = results[i];
        const tags = [`<span class="q-status ${STATUS[r.status][1]}">${L.esc(STATUS[r.status][0])}</span>`];
        if (r.wrong) tags.push(`<span class="lr-chip">ошибок: ${r.wrong}</span>`);
        if (r.ear && r.listens) tags.push(`<span class="lr-chip">♪ прослушано ${r.listens}</span>`);
        if (r.hint) tags.push('<span class="lr-chip">с контуром формы</span>');
        const revealed = r.status === 'self' || r.status === 'corrected' || r.status === 'shown';
        return `<li><span class="q-num">${i + 1}</span><span>${L.esc(spec.summaryText(def, r.ear))}</span><span class="q-ans">${revealed ? L.esc(spec.summaryAnswer(def, r.ear)) : '—'}</span><span class="q-tags">${tags.join('')}</span></li>`;
      }).join('');
      const box = $('[data-q-summary]');
      box.innerHTML = `<div class="q-sum-head"><span class="lr-eyebrow">Итог серии</span><h2>${count('none') ? `Серия завершена досрочно: ${series.length - count('none')} из ${series.length}` : `Серия завершена: ${series.length} ${series.length === 1 ? 'вопрос' : series.length < 5 ? 'вопроса' : 'вопросов'}`}</h2><p class="lr-sub">Самостоятельно — только верный ответ с первой попытки без показа. Исправление, показ и пропуск считаются отдельно; повтор прослушивания — не ошибка.</p></div>
        <div class="q-tiles">${tiles.map(([cls, n, label, hint]) => `<div class="q-tile q-st-${cls}"><strong>${n}</strong><b>${L.esc(label)}</b><span>${L.esc(hint)}</span></div>`).join('')}</div>
        <ol class="q-list">${rows}</ol>
        <div class="q-sum-actions"><button type="button" class="lr-btn lr-btn-primary" data-q-plan>К следующему шагу плана →</button><button type="button" class="lr-btn" data-q-retry${hard.length ? '' : ' disabled'}>${hard.length ? `Повторить трудные (${hard.length})` : 'Трудных нет'}</button><button type="button" class="lr-btn lr-btn-ghost" data-q-again>Вся серия заново</button><span class="lr-sub">Шаг 4 из 4 — последний: вернёмся в «Сегодня», план выполнен.</span></div>`;
      box.hidden = false;
      box.querySelector('[data-q-plan]').addEventListener('click', () => { location.href = `lesson-r2-vis10.html?theme=${themeOf()}`; });
      box.querySelector('[data-q-retry]').addEventListener('click', () => { if (hard.length) startSeries(hard); });
      box.querySelector('[data-q-again]').addEventListener('click', () => startSeries(spec.defs.slice()));
      render();
      box.querySelector('[data-q-plan]').focus();
    }

    $('[data-q-ear]').addEventListener('click', toggleEar);
    $('[data-q-show]').addEventListener('click', show);
    $('[data-q-skip]').addEventListener('click', skip);
    $('[data-q-next]').addEventListener('click', () => { if (cur?.done) next(); });
    $('[data-q-listen]').addEventListener('click', listen);
    $('[data-q-finish]').addEventListener('click', () => { if (cur && !cur.done) record(); summary(); });
    const api = { answer, listen, next: () => { if (cur?.done) next(); }, get cur() { return cur; }, get summaryOpen() { return el.classList.contains('is-summary'); }, render };
    spec.bind?.(api);
    startSeries(spec.defs.slice());
    return api;
  }

  /* ---------- Кандидат A ---------- */
  const elA = root.querySelector('[data-quiz="a"]');
  let hintOn = true, focusCell = 'G:7';
  const targetsA = c => FORM.filter(n => n.degree === c.def.degree && (!c.def.string || n.string === c.def.string)).map(n => n.id);
  const quizA = createQuiz(elA, {
    defs: [{ degree: 'b7' }, { degree: '1' }, { degree: 'b3', all: true }, { degree: '5', string: 'G' }, { degree: '4', string: 'E' }, { degree: 'b3', string: 'D' }],
    onBegin(c) { c.hint = hintOn; },
    text(c) {
      const d = L.deg(c.def.degree), where = c.def.string ? `на струне ${c.def.string}` : 'в форме B';
      if (c.ear) return { kind: '♪ Услышь и покажи на грифе', title: `Какая ступень? Покажи ${where}`, sub: `Тоника A, затем нота. Засчитывается любая позиция этой ступени ${c.def.string ? 'на струне' : 'в форме'}.` };
      if (c.def.all) return { kind: 'Найди все на грифе', title: `Найди все ${degTitle(c.def.degree)} в форме B`, sub: `В форме B их ${targetsA(c).length} — отметь каждую. Тоника — A.` };
      return { kind: 'Найди на грифе', title: `Найди ${degTitle(c.def.degree)} ${where}`, sub: 'Тоника — A. Форма B — лады 7–10.' };
    },
    idle(c) {
      if (c.ear && !c.heard) return 'Нажми «Прослушать» — ответы откроются после конца сигнала.';
      return c.def.all && !c.ear && c.found.size ? `Найдено ${c.found.size} из ${targetsA(c).length}.` : 'Кликни позицию на грифе или выбери её стрелками и нажми Enter.';
    },
    judge(c, id) {
      const targets = targetsA(c), here = pos(id);
      if (c.found.has(id)) return { repeat: true, msg: `${here} уже отмечена — найди другую.` };
      if (c.wrongSet.has(id)) return { repeat: true, msg: `${here} уже проверена — это не ответ.` };
      if (targets.includes(id)) {
        c.found.add(id);
        const final = c.ear || !c.def.all || c.found.size === targets.length;
        return { ok: true, final, msg: `Верно: ${here}. Осталось найти ещё ${targets.length - c.found.size}.` };
      }
      c.wrongSet.add(id);
      if (!IN_FORM.has(id)) return { msg: `${here} — вне формы B (лады 7–10). Ищи внутри формы.` };
      const note = byId.get(id);
      if (note.degree === c.def.degree) return { msg: c.ear ? `${here} — не на струне ${c.def.string}. Попробуй ещё.` : `${here} — это ${L.deg(note.degree)}, но на струне ${note.string}. Нужна струна ${c.def.string}.` };
      return { msg: c.ear ? `${here} — это ${L.deg(note.degree)}. Прозвучала другая ступень — попробуй ещё или прослушай снова.` : `${here} — это ${L.deg(note.degree)}, не ${L.deg(c.def.degree)}. Попробуй ещё.` };
    },
    rule(c) {
      const t = targetsA(c);
      return `${L.deg(c.def.degree)} от A (${INTERVAL[c.def.degree]}) — ${t.map(id => `${pos(id)} ${name(id)}, палец ${FINGER[id]}`).join('; ')}.`;
    },
    summaryText: (def, ear) => ear ? `♪ Услышь ступень · ${def.string ? `струна ${def.string}` : 'форма B'}` : `${def.all ? 'Найди все' : 'Найди'} ${degTitle(def.degree)} ${def.string ? `на струне ${def.string}` : 'в форме B'}`,
    summaryAnswer: (def, ear) => `${ear ? `${L.deg(def.degree)} · ` : ''}${targetsA({ def }).map(pos).join(', ')}`,
    renderAnswer(c, { locked }) {
      const targets = c.done ? targetsA(c) : [];
      const notes = c.done
        ? FORM.map(n => ({ id: n.id, label: L.deg(n.degree), kind: n.degree === '1' ? 'root' : 'b' }))
        : hintOn ? FORM.map(n => ({ id: n.id, label: '', kind: 'ghost' })) : [];
      elA.querySelector('[data-qa-svg]').innerHTML = L.fretboard({ ...A_WIN, notes, width: A_W, marker: A_M, labels: true });
      elA.querySelectorAll('[data-cell]').forEach(btn => {
        const id = btn.dataset.cell;
        const found = c.found.has(id), wrong = c.wrongSet.has(id), shown = c.status === 'shown' && targets.includes(id) && !found;
        btn.classList.toggle('is-found', found);
        btn.classList.toggle('is-wrong', wrong);
        btn.classList.toggle('is-shown', shown);
        btn.classList.toggle('is-final', c.done);
        if (locked) btn.setAttribute('aria-disabled', 'true'); else btn.removeAttribute('aria-disabled');
        const dot = btn.querySelector('.qa-dot');
        dot.textContent = c.done ? '' : found ? L.deg(c.def.degree) : wrong ? (IN_FORM.has(id) ? L.deg(byId.get(id).degree) : '✕') : '';
        btn.tabIndex = id === focusCell ? 0 : -1;
      });
      elA.querySelector('[data-qa-legend]').textContent = c.done
        ? 'Подписи — ступени формы B · кольцо — ответ · ✕ — ошибка'
        : hintOn ? 'Контуры — позиции формы B, без подписей' : 'Без контуров: вся форма по памяти';
    },
    bind(api) {
      elA.querySelector('.qa-hit').addEventListener('click', event => {
        const btn = event.target.closest('[data-cell]');
        if (!btn) return;
        focusCell = btn.dataset.cell;
        api.answer(btn.dataset.cell);
      });
      elA.querySelector('[data-qa-hint]').addEventListener('click', event => {
        hintOn = !hintOn;
        event.currentTarget.setAttribute('aria-pressed', String(hintOn));
        if (api.cur && !api.cur.done && hintOn) api.cur.hint = true;
        api.render();
      });
    },
  });

  /* ---------- Кандидат B ---------- */
  const elB = root.querySelector('[data-quiz="b"]');
  const quizB = createQuiz(elB, {
    defs: ['A:10', 'E:8', 'G:9', 'D:7', 'E:10', 'D:10'].map(id => ({ id })),
    text(c) {
      if (c.ear) return { kind: '♪ Услышь и назови', title: 'Какая ступень прозвучала?', sub: 'Сначала тоника A, потом нота формы B. На грифе нота скрыта до ответа.' };
      return { kind: 'Назови ступень', title: 'Какая это ступень от A?', sub: `Отмеченная нота — ${pos(c.def.id)}, форма B. Ответь кнопкой или клавишей 1–5.` };
    },
    idle: c => c.ear && !c.heard ? 'Нажми «Прослушать» — ответы откроются после конца сигнала.' : 'Выбери ступень: кнопка или клавиша 1–5.',
    judge(c, i) {
      const d = DEGREES[i];
      if (c.wrongSet.has(i)) return { repeat: true, msg: `${L.deg(d)} уже проверена — это не ответ.` };
      if (d === byId.get(c.def.id).degree) { c.found.add(i); return { ok: true, final: true }; }
      c.wrongSet.add(i);
      return { msg: `Не ${L.deg(d)}. Попробуй ещё${c.ear ? ' или прослушай снова' : ' — считай полутоны от ближайшей A'}.` };
    },
    rule(c) {
      const n = byId.get(c.def.id);
      return `${pos(n.id)} — ${n.name}, ${L.deg(n.degree)} от A: ${INTERVAL[n.degree]}.`;
    },
    summaryText: (def, ear) => ear ? '♪ Нота формы B на слух' : `Ступень ноты ${pos(def.id)}`,
    summaryAnswer: (def, ear) => `${L.deg(byId.get(def.id).degree)}${ear ? ` · ${pos(def.id)}` : ''}`,
    renderAnswer(c, { locked }) {
      const showNote = !c.ear || c.done;
      const notes = FORM.map(n => ({ id: n.id, label: c.done ? L.deg(n.degree) : '', kind: c.done ? (n.degree === '1' ? 'root' : 'b') : 'ghost' }));
      elB.querySelector('[data-qb-svg]').innerHTML = L.fretboard({ fretMin: 6, fretMax: 11, notes, current: showNote ? c.def.id : null, width: 700, marker: 46, labels: true });
      const right = c.done ? DEGREES.indexOf(byId.get(c.def.id).degree) : -1;
      elB.querySelectorAll('[data-choice]').forEach(btn => {
        const i = Number(btn.dataset.choice);
        btn.classList.toggle('is-wrong', c.wrongSet.has(i));
        btn.classList.toggle('is-right', c.done && c.status !== 'shown' && i === right);
        btn.classList.toggle('is-shown', c.status === 'shown' && i === right);
        if (locked || c.wrongSet.has(i)) btn.setAttribute('aria-disabled', 'true'); else btn.removeAttribute('aria-disabled');
      });
    },
    bind(api) {
      elB.querySelector('.qb-pad').addEventListener('click', event => {
        const btn = event.target.closest('[data-choice]');
        if (btn) api.answer(Number(btn.dataset.choice));
      });
    },
  });

  /* Клавиатура: действует только видимый кандидат и только вне итога. */
  document.addEventListener('keydown', event => {
    if (event.ctrlKey || event.altKey || event.metaKey || event.target.closest?.('input,textarea,select')) return;
    const id = root.dataset.candidate, quiz = id === 'a' ? quizA : quizB, el = id === 'a' ? elA : elB;
    if (!quiz.cur || quiz.summaryOpen) return;
    const c = quiz.cur;
    const onChoice = event.target.closest?.('[data-cell],[data-choice]') || !event.target.closest?.('button');
    if (event.key === 'Enter' && c.done && onChoice) { event.preventDefault(); quiz.next(); return; }
    if (event.code === 'Space' && c.ear && !c.done && !c.listening && onChoice) { event.preventDefault(); quiz.listen(); return; }
    if (id === 'b') {
      const digit = /^(?:Digit|Numpad)([1-5])$/.exec(event.code);
      if (digit) { event.preventDefault(); quiz.answer(Number(digit[1]) - 1); }
      return;
    }
    const moves = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] };
    if (!moves[event.key]) return;
    event.preventDefault();
    const [s, f] = focusCell.split(':');
    if (event.target.closest?.('[data-cell]')) {
      const [ds, df] = moves[event.key];
      const si = Math.min(3, Math.max(0, STRINGS.indexOf(s) + ds));
      const fi = Math.min(A_WIN.fretMax, Math.max(A_WIN.fretMin, Number(f) + df));
      focusCell = `${STRINGS[si]}:${fi}`;
    }
    el.querySelectorAll('[data-cell]').forEach(btn => { btn.tabIndex = btn.dataset.cell === focusCell ? 0 : -1; });
    el.querySelector(`[data-cell="${focusCell}"]`).focus();
  });
})();
</script>
