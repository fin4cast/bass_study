  #studio-lesson .lr-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--s-line-strong);background:var(--s-input);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;}
  #studio-lesson .lr-btn:hover{background:var(--s-hover);}
  #studio-lesson .lr-btn-primary{background:var(--s-green);border-color:var(--s-green);color:var(--s-on-green);}
  #studio-lesson .lr-btn-primary:hover{background:var(--s-green);filter:brightness(1.08);}

  #studio-lesson .lr-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--s-line);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--s-muted);background:var(--s-paper);}

  /* Гриф и TAB */

  /* Транспорт */

  #studio-lesson .lr-bpm{display:flex;align-items:center;gap:4px;}

  #studio-lesson .lr-bpm small{font-size:11px;color:var(--s-muted);}

  #studio-lesson .lr-toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--s-line);border-radius:7px;background:var(--s-paper);padding:5px 9px;font-size:12px;color:var(--s-muted);}
  #studio-lesson .lr-toggle[aria-pressed="true"]{border-color:var(--s-green);color:var(--s-ink);background:var(--s-green-soft);}

  #studio-lesson .lr-countin{position:absolute;left:50%;bottom:calc(100% + 12px);transform:translateX(-50%);min-width:120px;padding:10px 22px;border-radius:14px;background:var(--s-gold-soft);border:2px solid var(--s-gold);color:var(--s-ink);font:800 44px/1 'Segoe UI',Arial;text-align:center;box-shadow:0 8px 24px rgb(0 0 0 / .18);z-index:5;}
  #studio-lesson .lr-countin::before{content:'Отсчёт ';font-size:14px;font-weight:600;vertical-align:middle;margin-right:8px;color:var(--s-muted);}
  #studio-lesson .lr-restart{padding:8px 10px;}
  #studio-lesson .lr-progress{flex:1;min-width:120px;}
  #studio-lesson .lr-progress small{font-size:11px;color:var(--s-muted);}
  /* Карточка понятия и самооценка */
  #studio-lesson .lr-concept{border:1px solid var(--s-info);background:var(--s-info-soft);border-radius:10px;padding:10px 12px;font-size:13px;}
  #studio-lesson .lr-concept summary{cursor:pointer;font-weight:650;color:var(--s-info);list-style:none;display:flex;gap:8px;align-items:center;}
  #studio-lesson .lr-concept summary::-webkit-details-marker{display:none;}
  #studio-lesson .lr-concept p{margin-top:6px;color:var(--s-ink);}
  #studio-lesson .lr-after{display:none;}
  #studio-lesson .lr-after.is-open{display:flex;}
  #studio-lesson .lr-rate{gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--s-gold);background:var(--s-gold-soft);border-radius:10px;padding:10px 14px;font-size:13px;}
  #studio-lesson .lr-rate strong{margin-right:4px;}
  @media (max-width:1100px){#studio-lesson .lr-app{grid-template-columns:72px minmax(0,1fr);}#studio-lesson .lr-nav{padding:18px 8px;align-items:center;}#studio-lesson .lr-brand-word,#studio-lesson .lr-nav-item span,#studio-lesson .lr-status{display:none;}#studio-lesson .lr-nav-item{justify-content:center;padding:10px;}#studio-lesson .lr-theme{grid-template-columns:1fr;}#studio-lesson .lr-main{padding:18px;}}
</style>
<script>
(() => {
  const M = BassLessonModel;
  const material = M.buildLessonMaterial();
  const NS = 'http://www.w3.org/2000/svg';
  const STRINGS = ['G', 'D', 'A', 'E'];
  const ICONS = {
    lesson: '<svg viewBox="0 0 20 20"><path d="M4 3h9l3 3v11H4z"/><path d="M7 9h6M7 12h6M7 6h3"/></svg>',
    neck: '<svg viewBox="0 0 20 20"><rect x="2" y="5" width="16" height="10" rx="2"/><path d="M6 5v10M10 5v10M14 5v10M2 8.5h16M2 11.5h16"/></svg>',
    rhythm: '<svg viewBox="0 0 20 20"><path d="M7 17 9 3h2l2 14z"/><path d="M10 11l5-6"/></svg>',
    songs: '<svg viewBox="0 0 20 20"><path d="M8 15V4l9-2v11"/><circle cx="5.5" cy="15" r="2.5"/><circle cx="14.5" cy="13" r="2.5"/></svg>',
    progress: '<svg viewBox="0 0 20 20"><path d="M3 16h14"/><path d="M5 13l4-4 3 2 4-6"/></svg>',
    settings: '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5"/><path d="M10 2v2.5M10 15.5V18M2 10h2.5M15.5 10H18M4.3 4.3l1.8 1.8M13.9 13.9l1.8 1.8M4.3 15.7l1.8-1.8M13.9 6.1l1.8-1.8"/></svg>',
  };
  const NAV = [['lesson', 'Занятие'], ['neck', 'Гриф'], ['rhythm', 'Ритм'], ['songs', 'Песни'], ['progress', 'Прогресс']];
  const esc = value => String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const deg = value => value ? String(value).replace('b', '♭').replace('#', '♯') : '';

  /** Боковое меню из пяти разделов; «Настройки» и тема — внизу. */
  function shell(current, main) {
    const items = NAV.map(([id, label]) => `<button type="button" class="lr-nav-item"${id === current ? ' aria-current="page"' : ''}>${ICONS[id]}<span>${label}</span></button>`).join('');
    return `<div class="lr-app"><nav class="lr-nav" aria-label="Разделы тренажёра"><div class="lr-brand" aria-label="bass.study"><span class="lr-brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="lr-brand-word">bass<span>.</span>study</span></div><div class="lr-nav-list">${items}</div><div class="lr-nav-bottom"><button type="button" class="lr-nav-item"${current === 'settings' ? ' aria-current="page"' : ''}>${ICONS.settings}<span>Настройки</span></button><div class="lr-theme" role="group" aria-label="Тема"><button type="button" data-lr-theme="light">Светлая</button><button type="button" data-lr-theme="dark">Тёмная</button></div><span class="lr-status">● Локально · сохранено</span></div></nav><main class="lr-main">${main}</main></div>`;
  }

  /**
   * SVG грифа: строки G-D-A-E сверху вниз, лады fretMin..fretMax.
   * notes: [{id, label, kind: root|a|b|shared|plain|ghost, finger}], current/next — id позиций.
   */
  function fretboard({ fretMin = 0, fretMax = 12, notes = [], current = null, next = null, width = 1000, marker = 46, labels = true }) {
    const left = 34, right = 14, top = labels ? 26 : 10, rowGap = marker * 1.32, height = top + marker * 0.45 + rowGap * 3 + marker * 0.5 + 12;
    const span = fretMax - fretMin + 1;
    const cell = (width - left - right) / span;
    const x = fret => left + (fret - fretMin + 0.5) * cell;
    const y = string => top + marker * 0.45 + STRINGS.indexOf(string) * rowGap;
    const r = marker / 2;
    const parts = [];
    if (labels) for (let f = fretMin; f <= fretMax; f++) parts.push(`<text x="${x(f)}" y="15" text-anchor="middle" font-size="12" fill="#c3d0bf" font-family="Consolas,monospace">${f}</text>`);
    for (let f = fretMin; f <= fretMax + 1; f++) {
      const lx = left + (f - fretMin) * cell;
      parts.push(`<line x1="${lx}" x2="${lx}" y1="${y('G') - r * 0.7}" y2="${y('E') + r * 0.7}" stroke="#abbcad" stroke-opacity="${f === 1 && fretMin === 0 ? 1 : .45}" stroke-width="${f === 1 && fretMin === 0 ? 4 : 1.2}"/>`);
    }
    for (const f of [3, 5, 7, 9, 15, 17, 19, 21]) if (f >= fretMin && f <= fretMax) parts.push(`<circle cx="${x(f)}" cy="${(y('D') + y('A')) / 2}" r="4" fill="#c3d0bf" opacity=".45"/>`);
    for (const f of [12, 24]) if (f >= fretMin && f <= fretMax) { parts.push(`<circle cx="${x(f)}" cy="${(y('G') + y('D')) / 2}" r="4" fill="#c3d0bf" opacity=".45"/>`, `<circle cx="${x(f)}" cy="${(y('A') + y('E')) / 2}" r="4" fill="#c3d0bf" opacity=".45"/>`); }
    for (const s of STRINGS) {
      parts.push(`<text x="12" y="${y(s) + 5}" font-size="14" font-weight="600" fill="#e5eee0">${s}</text>`);
      parts.push(`<line x1="${left}" x2="${width - right}" y1="${y(s)}" y2="${y(s)}" stroke="#d7e2d2" stroke-width="${({ G: 1.4, D: 1.9, A: 2.4, E: 3 })[s]}" opacity=".8"/>`);
    }
    const fills = { root: ['#f3c180', '#3c2913'], a: ['#e6efdc', '#213a29'], b: ['#a4cce2', '#16303f'], shared: ['#cbb5e7', '#2a1d3d'], plain: ['#e6efdc', '#213a29'], ghost: ['transparent', '#c3d0bf'] };
    for (const note of notes) {
      const [string, fretText] = note.id.split(':');
      const fret = Number(fretText);
      if (fret < fretMin || fret > fretMax) continue;
      const cx = x(fret), cy = y(string);
      const [fill, ink] = fills[note.kind] || fills.plain;
      const isCurrent = note.id === current, isNext = note.id === next;
      if (isNext) parts.push(`<circle cx="${cx}" cy="${cy}" r="${r + 5}" fill="none" stroke="#fbdf8e" stroke-width="2.5" stroke-dasharray="5 4"/>`);
      if (isCurrent) parts.push(`<circle cx="${cx}" cy="${cy}" r="${r + 7}" fill="none" stroke="#ffffff" stroke-width="4"/>`);
      parts.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${isCurrent ? '#fbdf8e' : fill}" stroke="${note.kind === 'ghost' ? '#c3d0bf' : 'none'}" stroke-width="1.5" ${note.kind === 'ghost' ? 'stroke-dasharray="3 3"' : ''}/>`);
      if (note.root && note.kind !== 'root') parts.push(`<circle cx="${cx}" cy="${cy}" r="${r - 2.5}" fill="none" stroke="#e0a24f" stroke-width="4"/>`);
      if (note.label) parts.push(`<text x="${cx}" y="${cy + marker * 0.14}" text-anchor="middle" font-size="${Math.round(marker * 0.39)}" font-weight="700" fill="${isCurrent ? '#3c2913' : ink}" font-family="Segoe UI,Arial">${esc(note.label)}</text>`);
      if (note.finger) parts.push(`<text x="${cx + r * 0.78}" y="${cy - r * 0.62}" text-anchor="middle" font-size="${Math.max(10, Math.round(marker * 0.25))}" font-weight="700" fill="#fbdf8e" font-family="Segoe UI,Arial">${note.finger}</text>`);
    }
    return `<svg xmlns="${NS}" viewBox="0 0 ${width} ${height}" role="img" aria-label="Гриф, лады ${fretMin}–${fretMax}">${parts.join('')}</svg>`;
  }

  /** SVG табулатуры по событиям createNotationPlan: 4 линии G-D-A-E, номера ладов, такты, курсор. */
  function tab({ events, current = -1, width = 1000, perBar = 8, from = 0, count = events.length, lineGap = 20, fontSize = 15, showCount = true, dimPlayed = false }) {
    const shown = events.slice(from, from + count);
    const top = showCount ? 22 : 10, left = 30, right = 12;
    const height = top + lineGap * 3 + 22;
    const slot = (width - left - right) / shown.length;
    const parts = [];
    STRINGS.forEach((s, row) => {
      const ly = top + row * lineGap;
      parts.push(`<line x1="${left}" x2="${width - right}" y1="${ly}" y2="${ly}" stroke="currentColor" stroke-opacity=".35"/>`);
      parts.push(`<text x="6" y="${ly + 4}" font-size="11" fill="currentColor" opacity=".7" font-family="Consolas,monospace">${s}</text>`);
    });
    parts.push(`<line x1="${left}" x2="${left}" y1="${top}" y2="${top + lineGap * 3}" stroke="currentColor" stroke-opacity=".6" stroke-width="2"/>`);
    shown.forEach((event, i) => {
      const index = from + i;
      const cx = left + slot * (i + 0.5);
      if (i > 0 && index % perBar === 0) parts.push(`<line x1="${left + slot * i}" x2="${left + slot * i}" y1="${top}" y2="${top + lineGap * 3}" stroke="currentColor" stroke-opacity=".55"/>`);
      if (index === current) parts.push(`<rect x="${cx - slot * 0.42}" y="${top - lineGap * 0.6}" width="${slot * 0.84}" height="${lineGap * 4.2}" rx="6" fill="#f2c94c" fill-opacity=".22" stroke="#d9a520" stroke-width="2.5"/>`);
      const ly = top + event.tab.row * lineGap;
      const label = String(event.tab.fret);
      const w = label.length * fontSize * 0.62 + 6;
      parts.push(`<rect x="${cx - w / 2}" y="${ly - fontSize * 0.62}" width="${w}" height="${fontSize * 1.24}" style="fill:${index === current ? 'transparent' : 'var(--s-tab-bg,var(--s-paper))'}"/>`);
      parts.push(`<text x="${cx}" y="${ly + fontSize * 0.36}" text-anchor="middle" font-size="${fontSize}" font-weight="700" fill="currentColor" opacity="${dimPlayed && index < current ? .4 : 1}" font-family="Consolas,monospace">${label}</text>`);
      if (showCount) {
        const beatText = event.beatInBar % 1 === 0 ? String(event.beatInBar + 1) : 'и';
        parts.push(`<text x="${cx}" y="12" text-anchor="middle" font-size="10" fill="currentColor" opacity=".55" font-family="Segoe UI,Arial">${beatText}</text>`);
      }
    });
    parts.push(`<line x1="${width - right}" x2="${width - right}" y1="${top}" y2="${top + lineGap * 3}" stroke="currentColor" stroke-opacity=".6" stroke-width="2"/>`);
    return `<svg xmlns="${NS}" viewBox="0 0 ${width} ${height}" role="img" aria-label="Табулатура">${parts.join('')}</svg>`;
  }

  /** Ноты EX-1 для грифа: форма A, форма B, общие позиции, тоники. */
  /**
   * Общие позиции важнее тоники: они остаются сиреневыми, тоника на них — золотое кольцо.
   * Пальцы берутся из формы, которую сейчас играют (phase 'a' | 'b').
   */
  function ex1BoardNotes({ labels = 'name', fingers = false, phase = 'a' } = {}) {
    const ex = material.ex1;
    const shared = new Set(ex.shared);
    const ids = [...new Set([...ex.formA.ids, ...ex.formB.ids])];
    const byId = new Map(ex.notes.map(n => [n.id, n]));
    const fingerOf = id => {
      const own = phase === 'b' ? ex.formB.fingers : ex.formA.fingers;
      const other = phase === 'b' ? ex.formA.fingers : ex.formB.fingers;
      return own[id] ?? other[id];
    };
    return ids.map(id => {
      const note = byId.get(id);
      const inA = ex.formA.ids.includes(id);
      const isRoot = note?.degree === '1';
      const kind = shared.has(id) ? 'shared' : isRoot ? 'root' : inA ? 'a' : 'b';
      const label = labels === 'degree' ? deg(note?.degree) : labels === 'finger' ? String(fingerOf(id)) : labels === 'none' ? '' : note?.name.replace(/\d$/, '') ?? '';
      const finger = fingers ? fingerOf(id) : null;
      return { id, label, kind, finger, root: isRoot };
    });
  }

  /**
   * Демонстрационный плеер: отсчёт 4 доли только при старте с начала, восьмые по BPM, петля; звука нет.
   * Пауза сохраняет позицию: «Продолжить» играет следующую ноту без повторного отсчёта.
   */
  function player({ steps, bpm = 72, countIn = true, loop = true, onStep, onCount, onFinish, onState }) {
    let timer = null, index = -1, counting = 0, state = { bpm, countIn, loop };
    const interval = () => 60000 / state.bpm / 2;
    const status = () => timer ? 'playing' : index >= 0 ? 'paused' : 'stopped';
    function tick() {
      if (counting > 0) { onCount?.(5 - counting); counting--; timer = setTimeout(tick, interval() * 2); return; }
      onCount?.(null);
      index++;
      if (index >= steps) {
        if (!state.loop) { index = -1; halt(); onFinish?.(); return; }
        index = 0; onFinish?.({ looped: true });
      }
      onStep?.(index);
      timer = setTimeout(tick, interval());
    }
    function halt() { clearTimeout(timer); timer = null; counting = 0; onCount?.(null); onState?.(status()); }
    function play() {
      if (timer) return;
      counting = index < 0 && state.countIn ? 4 : 0;
      timer = setTimeout(tick, 0); onState?.('playing');
    }
    const pause = () => { if (timer) halt(); };
    function restart() { halt(); index = -1; onStep?.(-1); onState?.('stopped'); }
    return { play, pause, restart, toggle() { timer ? pause() : play(); }, get status() { return status(); }, get index() { return index; }, set(key, value) { state[key] = value; } };
  }

  /** Разметка транспорта; data-lr-* подключает bindTransport. */
  function transport({ bpm = 72, ladder = '72 → 96, +4', compact = false } = {}) {
    return `<div class="lr-transport" data-lr-transport>
      <button type="button" class="lr-btn lr-btn-primary lr-play" data-lr-play>▶ Играть <span class="lr-kbd">Пробел</span></button>
      <button type="button" class="lr-btn lr-restart" data-lr-restart title="Вернуться к первой ноте; следующий старт — с отсчётом">⏮ С начала <span class="lr-kbd">Esc</span></button>
      <div class="lr-bpm"><button type="button" class="lr-icon-btn" data-lr-bpm="-4" aria-label="Медленнее">−</button><output data-lr-bpm-value>${bpm}</output><button type="button" class="lr-icon-btn" data-lr-bpm="4" aria-label="Быстрее">+</button><small>BPM ♩<br>играем восьмыми</small></div>
      <button type="button" class="lr-toggle" data-lr-flag="countIn" aria-pressed="true">Отсчёт 4</button>
      <button type="button" class="lr-toggle" data-lr-flag="loop" aria-pressed="true">⟲ По кругу</button>
      ${compact ? '' : `<button type="button" class="lr-toggle" data-lr-ladder aria-pressed="false" title="Лестница темпа">↗ Лестница ${esc(ladder)}</button>`}
      <div class="lr-progress"><div class="lr-meter"><i data-lr-meter style="width:0%"></i></div><small data-lr-position>Нота 0 из ${material.ex1.notes.length}</small></div>
      <div class="lr-countin" data-lr-count aria-live="assertive" hidden></div>
    </div>`;
  }

  /** Подключает транспорт внутри контейнера к плееру; render(index) перерисовывает сцену (−1 — до первой ноты). */
  function bindTransport(container, { steps, bpm = 72, render, onPass }) {
    const playButton = container.querySelector('[data-lr-play]');
    const out = container.querySelector('[data-lr-bpm-value]');
    const count = container.querySelector('[data-lr-count]');
    const meter = container.querySelector('[data-lr-meter]');
    const position = container.querySelector('[data-lr-position]');
    let passes = 0;
    const labels = { playing: '❚❚ Пауза', paused: '▶ Продолжить', stopped: '▶ Играть' };
    const sync = status => { playButton.innerHTML = `${labels[status]} <span class="lr-kbd">Пробел</span>`; container.dataset.lrStatus = status; };
    const p = player({
      steps, bpm,
      onStep(i) {
        render(i);
        if (meter) meter.style.width = `${i < 0 ? 0 : ((i + 1) / steps) * 100}%`;
        if (position) position.textContent = i < 0 ? `Нота 0 из ${steps} · с начала` : `Нота ${i + 1} из ${steps} · проход ${passes + 1}`;
      },
      onCount(n) { if (!count) return; count.hidden = !n; count.textContent = n ? String(n) : ''; },
      onFinish(info) { passes++; onPass?.(passes, info); },
      onState: sync,
    });
    playButton.addEventListener('click', () => p.toggle());
    container.querySelector('[data-lr-restart]').addEventListener('click', () => { passes = 0; p.restart(); });
    container.querySelectorAll('[data-lr-bpm]').forEach(button => button.addEventListener('click', () => {
      const value = Math.min(200, Math.max(40, Number(out.value || out.textContent) + Number(button.dataset.lrBpm)));
      out.textContent = value; p.set('bpm', value);
    }));
    container.querySelectorAll('[data-lr-flag]').forEach(button => button.addEventListener('click', () => {

<script>
(() => {
  const L = window.LessonRef;
  const esc = L.esc;
  const root = document.getElementById('studio-lesson');

  /* ---------- Даты: ключи YYYY-MM-DD, расчёт в UTC, чтобы часовой пояс макета не сдвигал дни ---------- */
  const DAY = 864e5;
  const TODAY = '2026-11-12';
  const START = '2026-10-22';
  const utc = key => { const [y, m, d] = key.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const keyOf = time => new Date(time).toISOString().slice(0, 10);
  const addDays = (key, n) => keyOf(utc(key) + n * DAY);
  const PERIOD = Math.round((utc(TODAY) - utc(START)) / DAY);
  const idx = key => Math.round((utc(key) - utc(START)) / DAY);
  const MON = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  const MONL = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  const d = key => new Date(utc(key));
  const short = key => `${d(key).getUTCDate()} ${MON[d(key).getUTCMonth()]}`;
  const long = key => `${WD[d(key).getUTCDay()]}, ${d(key).getUTCDate()} ${MONL[d(key).getUTCMonth()]}`;
  const monday = key => addDays(key, -((d(key).getUTCDay() + 6) % 7));
  const range = mon => { const sun = addDays(mon, 6); return d(mon).getUTCMonth() === d(sun).getUTCMonth() ? `${d(mon).getUTCDate()}–${short(sun)}` : `${short(mon)} – ${short(sun)}`; };
  const plural = (n, one, few, many) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many; };
  const nDays = n => `${n} ${plural(n, 'день', 'дня', 'дней')}`;

  /* ---------- Демонстрационные данные: ~3 недели, 13 дней занятий ---------- */
  const EX = {
    link: { title: 'Связка соседних форм', mat: 'пентатоника Am · формы A → B · восьмыми', src: 'play' },
    chrom: { title: 'Хроматика 1-2-3-4', mat: 'позиция V · палец на лад', src: 'play' },
    arp: { title: 'Арпеджио 1–3–5–8', mat: 'C мажор · от E/8, туда и обратно', src: 'play' },
    penta: { title: 'Форма пентатоники вверх-вниз', mat: 'Am · форма A', src: 'play' },
    scale: { title: 'Гамма в позиции «палец на лад»', mat: 'C мажор · II позиция', src: 'play' },
    checkB: { title: 'Проверь себя: ступени формы B', mat: 'пентатоника Am · форма B · 6 вопросов', src: 'check' },
  };
  const P = (ex, bpm, mark, min, note = '') => ({ src: 'play', ex, bpm, mark, min, note });
  const C = (ex, res, min, errors) => ({ src: 'check', ex, res, min, errors });
  const NOTE_LINK = 'переход G/7 → G/9';
  const HISTORY = [
    ['2026-10-22', [P('link', 60, 'clean', 6), P('chrom', 72, 'clean', 5)]],
    ['2026-10-23', [P('arp', 60, 'clean', 6)]],
    ['2026-10-25', [P('chrom', 76, 'clean', 5), P('penta', 76, 'clean', 7)]],
    ['2026-10-27', [P('link', 64, 'clean', 7), P('penta', 80, 'clean', 6)]],
    ['2026-10-28', [C('checkB', { self: 3, fixed: 2, shown: 1, skipped: 0 }, 4, ['♭7', '4'])]],
    ['2026-10-30', [P('chrom', 80, 'clean', 5), P('arp', 65, 'clean', 6)]],
    ['2026-11-01', [P('penta', 84, 'clean', 7), P('link', 68, 'clean', 8)]],
    ['2026-11-03', [P('chrom', 84, 'clean', 4), P('chrom', 88, 'late', 3)]],
    ['2026-11-04', [P('link', 72, 'err', 8, NOTE_LINK), P('arp', 69, 'clean', 6)]],
    ['2026-11-06', [P('penta', 88, 'clean', 6), P('link', 72, 'clean', 6), C('checkB', { self: 4, fixed: 1, shown: 0, skipped: 1 }, 4, ['♭7'])]],
    ['2026-11-08', [P('chrom', 88, 'late', 3), P('scale', 60, 'err', 7, 'растяжка мизинцем на струне G')]],
    ['2026-11-10', [P('link', 76, 'err', 7, NOTE_LINK), P('chrom', 84, 'clean', 4)]],
    ['2026-11-11', [P('link', 76, 'clean', 7), P('penta', 88, 'clean', 6)]],
  ].map(([date, entries]) => ({ date, entries: entries.map(e => ({ ...e, date })) }));
  const BY_DATE = new Map(HISTORY.map(day => [day.date, day.entries]));
  const HARD = [
    { id: 'h1', src: 'play', title: 'Переход G/7 → G/9 в связке A→B', why: `2 отметки «С ошибками» · ${short('2026-11-04')} и ${short('2026-11-10')}`, plan: 'петля на переход G/7 → G/9, 68 BPM' },
    { id: 'h2', src: 'check', title: '♭7 в форме B', why: `2 ошибки в ответах · ${short('2026-10-28')} и ${short('2026-11-06')}`, plan: 'Проверь себя: ♭7 и тоника в форме B' },
    { id: 'h3', src: 'play', title: 'Темп 88 в хроматике — не успевал', why: `«Не успевал» ${d('2026-11-03').getUTCDate()} и ${short('2026-11-08')} · чисто — 84`, plan: 'хроматика, лестница 80 → 88, +2' },
  ];
  const MARK = { clean: 'Чисто', err: 'С ошибками', late: 'Не успевал' };
  const SRC = { play: 'Игра · самооценка', check: 'Проверь себя · экран' };

  const state = { demo: 'hist', src: 'all', open: null, day: '2026-11-11', hiEx: null, planned: new Set() };
  const hasHistory = () => state.demo === 'hist';
  const okSrc = src => state.src === 'all' || state.src === src;
  const entries = () => hasHistory() ? HISTORY.flatMap(day => day.entries).filter(e => okSrc(e.src)) : [];
  const dayEntries = key => hasHistory() ? (BY_DATE.get(key) || []).filter(e => okSrc(e.src)) : [];
  const minutesOf = list => list.reduce((sum, e) => sum + e.min, 0);

  /** Сводка упражнения: проходы по дате, лучший комфортный темп = самый быстрый проход с отметкой «Чисто». */
  function summary(id) {
    const list = HISTORY.flatMap(day => day.entries).filter(e => e.ex === id);
    const last = list[list.length - 1];
    if (EX[id].src === 'check') return { id, list, last, best: Math.max(...list.map(e => e.res.self)) };
    const clean = list.filter(e => e.mark === 'clean').map(e => e.bpm);
    return { id, list, last, first: list[0]?.bpm, best: clean.length ? Math.max(...clean) : null };
  }
  const total = res => res.self + res.fixed + res.shown + res.skipped;

  /* ---------- Маркеры и графики (inline SVG, только классы с токенами) ---------- */
  function marker(mark, px, py, s = 4) {
    const x = Number(px), y = Number(py);
    if (mark === 'clean') return `<circle class="m-clean" cx="${x}" cy="${y}" r="${s}"/>`;
    if (mark === 'err') return `<path class="m-err" d="M${x} ${y - s - 1}L${x + s + 1} ${y}L${x} ${y + s + 1}L${x - s - 1} ${y}Z"/>`;
    return `<path class="m-late" d="M${x - s} ${y - s}L${x + s} ${y + s}M${x + s} ${y - s}L${x - s} ${y + s}"/>`;
  }
  const markIcon = mark => `<svg viewBox="-6 -6 12 12" aria-hidden="true">${marker(mark, 0, 0, 4)}</svg>`;
  const markChip = mark => `<span class="v8-mark is-${mark}">${markIcon(mark)}${MARK[mark]}</span>`;
  const checkChip = res => `<span class="v8-mark is-check">${res.self} из ${total(res)} самостоятельно</span>`;
  const legend = () => `<div class="v8-legend" aria-label="Обозначения отметок">${['clean', 'err', 'late'].map(m => `<span>${markIcon(m)}${MARK[m]}</span>`).join('')}</div>`;

  /** Мини-график темпа: общая ось X — весь период, ось Y — собственный диапазон упражнения с подписями min/max. */
  function spark(s, w = 180, h = 44) {
    const x0 = 30, x1 = w - 5, y0 = 7, y1 = h - 7;
    const X = key => x0 + (idx(key) / PERIOD) * (x1 - x0);
    if (EX[s.id].src === 'check') {
      const parts = [`<line class="g-axis" x1="${x0}" x2="${x1}" y1="${y1 + 0.5}" y2="${y1 + 0.5}"/>`, `<text class="g-text" x="${x0 - 6}" y="${y0 + 8}" text-anchor="end">6</text>`];
      for (const e of s.list) {
        const n = total(e.res), unit = (y1 - y0) / n, x = X(e.date) - 4;
        let y = y1;
        for (const [k, cls] of [['self', 'b-self'], ['fixed', 'b-fixed'], ['shown', 'b-shown'], ['skipped', 'b-skip']]) {
          if (!e.res[k]) continue;
          y -= unit * e.res[k];
          parts.push(`<rect class="${cls}" x="${x}" y="${y}" width="8" height="${unit * e.res[k] - 0.5}"/>`);
        }
        parts.push(`<text class="g-text-ink" x="${x + 12}" y="${y1 - 2}">${e.res.self}</text>`);
      }
      return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${parts.join('')}</svg>`;
    }
    const bpms = s.list.map(e => e.bpm), lo = Math.min(...bpms), hi = Math.max(...bpms);
    const Y = bpm => hi === lo ? (y0 + y1) / 2 : y1 - ((bpm - lo) / (hi - lo)) * (y1 - y0);
    const seen = {};
    const pts = s.list.map(e => { const k = seen[e.date] = (seen[e.date] || 0) + 1; return { e, x: X(e.date) + (k - 1) * 6, y: Y(e.bpm) }; });
    const parts = [
      `<line class="g-grid" x1="${x0}" x2="${x1}" y1="${y0}" y2="${y0}"/>`, `<line class="g-grid" x1="${x0}" x2="${x1}" y1="${y1}" y2="${y1}"/>`,
      `<text class="g-text" x="${x0 - 5}" y="${(hi === lo ? (y0 + y1) / 2 : y0) + 4}" text-anchor="end">${hi}</text>`,
    ];
    if (hi !== lo) parts.push(`<text class="g-text" x="${x0 - 5}" y="${y1 + 4}" text-anchor="end">${lo}</text>`);
    if (pts.length > 1) parts.push(`<polyline class="g-path" points="${pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')}"/>`);
    for (const p of pts) parts.push(marker(p.e.mark, p.x.toFixed(1), p.y.toFixed(1), 3.5));
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${parts.join('')}</svg>`;
  }
  const sparkText = s => EX[s.id].src === 'check'
    ? `Самостоятельно по датам: ${s.list.map(e => `${short(e.date)} — ${e.res.self} из ${total(e.res)}`).join('; ')}`
    : `Темп по датам: ${s.list.map(e => `${short(e.date)} — ${e.bpm}, ${MARK[e.mark]}`).join('; ')}`;

  /** Крупный график темпа с подписанными осями: BPM ♩ по вертикали, даты по горизонтали. */
  function bigChart(s, w) {
    const h = 176, x0 = 44, x1 = w - 18, y0 = 26, y1 = h - 28;
    const bpms = s.list.map(e => e.bpm);
    const step = Math.max(...bpms) - Math.min(...bpms) > 24 ? 8 : 4;
    const lo = Math.floor((Math.min(...bpms) - 2) / step) * step, hi = Math.ceil((Math.max(...bpms) + 2) / step) * step;
    const X = key => x0 + (idx(key) / PERIOD) * (x1 - x0);
    const Y = bpm => y1 - ((bpm - lo) / (hi - lo)) * (y1 - y0);
    const parts = [`<text class="g-text" x="${x0 - 36}" y="14">BPM ♩</text>`];
    for (let v = lo; v <= hi; v += step) parts.push(`<line class="g-grid" x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}"/>`, `<text class="g-text" x="${x0 - 8}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`);
    parts.push(`<line class="g-axis" x1="${x0}" x2="${x1}" y1="${y1}" y2="${y1}"/>`);
    const ticks = [START, '2026-10-26', '2026-11-02', '2026-11-09', TODAY];
    ticks.forEach((key, i) => {
      const anchor = i === 0 ? 'start' : i === ticks.length - 1 ? 'end' : 'middle';
      parts.push(`<line class="g-axis" x1="${X(key)}" x2="${X(key)}" y1="${y1}" y2="${y1 + 4}"/>`, `<text class="g-text" x="${X(key)}" y="${y1 + 18}" text-anchor="${anchor}">${key === TODAY ? 'сегодня' : short(key)}</text>`);
    });
    const seen = {};
    const pts = s.list.map(e => { const k = seen[e.date] = (seen[e.date] || 0) + 1; return { e, x: X(e.date) + (k - 1) * 8, y: Y(e.bpm) }; });
    parts.push(`<polyline class="g-path" points="${pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')}"/>`);
    for (const p of pts) parts.push(marker(p.e.mark, p.x.toFixed(1), p.y.toFixed(1), 5));
    const best = pts.filter(p => p.e.mark === 'clean' && p.e.bpm === s.best).pop();
    if (best) parts.push(`<text class="g-text-ink" x="${Math.min(best.x, x1 - 40)}" y="${best.y - 10}" text-anchor="middle">лучший ${s.best}</text>`);
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(sparkText(s))}">${parts.join('')}</svg>`;
  }
  const stack = res => `<span class="v8-stack" aria-hidden="true">${[['self', 'b-self'], ['fixed', 'b-fixed'], ['shown', 'b-shown'], ['skipped', 'b-skip']].filter(([k]) => res[k]).map(([k, c]) => `<i class="${c}" style="flex:${res[k]}"></i>`).join('')}</span>`;
  const resText = res => [['self', 'самостоятельно'], ['fixed', 'с исправлением'], ['shown', 'показано'], ['skipped', 'пропущено']].filter(([k]) => res[k]).map(([k, t]) => `${t} ${res[k]}`).join(' · ');

  /* ---------- Каркас ---------- */
  const seg = (attr, items, current, label) => `<div class="lr-seg" role="group" aria-label="${esc(label)}">${items.map(([id, t]) => `<button type="button" data-${attr}="${id}" aria-pressed="${id === current}">${esc(t)}</button>`).join('')}</div>`;
  root.innerHTML = L.shell('progress', `
    <header class="v8-top">
      <h1>Прогресс</h1>
      <p class="lr-sub">Что получается и что стоит повторить.</p>
      <div class="v8-ctl" data-src-ctl><span>Источник:</span>${seg('src', [['play', 'Игра (самооценка)'], ['check', 'Проверь себя'], ['all', 'Всё']], state.src, 'Источник результата')}</div>
      <div class="v8-ctl"><span class="v8-demo">Демо</span>${seg('demo', [['hist', 'Есть история'], ['first', 'Первый запуск']], state.demo, 'Демо-состояние')}</div>
    </header>
    <p class="v8-note" data-note></p>
    <div data-candidate-panel="a">
      <div class="v8a-grid">
        <div class="v8a-main" style="display:contents" data-a-main></div>
        <aside class="v8-side" aria-label="Трудные места и неделя">
          <section class="lr-card" aria-labelledby="v8a-hard-h"><h2 class="v8-h2" id="v8a-hard-h">Трудные места <small>повтори сегодня</small></h2><div data-hard="a"></div></section>
          <section class="lr-card" aria-labelledby="v8a-week-h" data-week></section>
        </aside>
      </div>
    </div>
    <div data-candidate-panel="b">
      <div class="v8b-grid">
        <div class="v8b-left">
          <section class="lr-card v8b-calcard" aria-labelledby="v8b-cal-h" data-cal-card></section>
          <section class="lr-card v8b-daycard" aria-live="polite" data-day-card></section>
        </div>
        <aside class="v8-side v8b-side" aria-label="Лучший темп и трудные места">
          <section class="lr-card" aria-labelledby="v8b-hard-h"><h2 class="v8-h2" id="v8b-hard-h">Трудные места <small>повтори сегодня</small></h2><div data-hard="b"></div></section>
          <section class="lr-card" data-best-card></section>
        </aside>
      </div>
    </div>
  `) + '<div class="v8-toast" role="status" aria-live="polite" data-toast-box></div>';

  const $ = (sel, scope = root) => scope.querySelector(sel);
  const $$ = (sel, scope = root) => [...scope.querySelectorAll(sel)];
  const toastBox = $('[data-toast-box]');
  let toastTimer = null;
  function toast(text) {
    toastBox.textContent = text; toastBox.classList.add('is-on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastBox.classList.remove('is-on'), 2600);
  }

  /* ---------- Общие блоки ---------- */
  function renderNote() {
    $('[data-note]').innerHTML = hasHistory()
      ? `<span><b>Демонстрационные данные</b> · ${short(START)} — ${short(TODAY)} 2026</span><span>Темп и отметку «Чисто / С ошибками / Не успевал» ставишь ты после прохода; ответы «Проверь себя» записывает экран. Время — активное, без пауз.</span>`
      : `<span><b>Демо: первый запуск</b> · записей ещё нет</span><span>Здесь будут твои отметки после прохода и ответы «Проверь себя». Приложение игру не оценивает.</span>`;
    $('[data-src-ctl]').hidden = !hasHistory();
  }
  function renderHard() {
    const items = HARD.filter(h => okSrc(h.src));
    const html = !hasHistory()
      ? `<p class="v8-quiet">Сюда попадут места с отметками «С ошибками» и «Не успевал», а также ошибки в «Проверь себя». Каждое можно добавить в план одной кнопкой.</p>`
      : !items.length ? `<p class="v8-quiet">Для этого источника трудных мест нет.</p>`
      : `<ul class="v8-hard">${items.map(h => {
        const on = state.planned.has(h.id);
        return `<li class="${h.src === 'check' ? 'is-check' : ''}"><span class="v8-src${h.src === 'check' ? ' is-check' : ''}">${esc(SRC[h.src])}</span><b>${esc(h.title)}</b><p>${esc(h.why)}</p><button type="button" class="lr-btn v8-btn-s v8-plan" data-plan="${h.id}" aria-pressed="${on}" aria-label="${esc(`${on ? 'Убрать из плана на сегодня' : 'Повторить: добавить в план на сегодня'} — ${h.plan}`)}">${on ? '✓ в плане' : 'Повторить'}</button></li>`;
      }).join('')}</ul>`;
    $$('[data-hard]').forEach(box => { box.innerHTML = html; });
  }

  /* ---------- A · Упражнения ---------- */
  function renderA() {
    const host = $('[data-a-main]');
    if (!hasHistory()) {
      host.innerHTML = `<section class="lr-card v8-empty" aria-label="Пока нет записей">
        <p class="lr-eyebrow">Пока пусто — так и должно быть</p>
        <h2>Здесь появится то, что у тебя получается</h2>
        <ul>
          <li><span>1</span><span><b>Лучший темп упражнения.</b> После прохода ты ставишь отметку «Чисто», «С ошибками» или «Не успевал». Самый быстрый проход с отметкой «Чисто» станет лучшим темпом.</span></li>
          <li><span>2</span><span><b>Трудные места.</b> Отметки «С ошибками», «Не успевал» и ошибки в «Проверь себя» собираются справа — их можно повторить одной кнопкой.</span></li>
          <li><span>3</span><span><b>Время занятий.</b> Считается только активное время, паузы не входят.</span></li>
        </ul>
        <div class="v8-sample" aria-label="Пример строки упражнения"><span>Пример:</span><b>Связка соседних форм</b>${spark(summary('link'))}<span>лучший темп</span><b>76</b>${markChip('clean')}</div>
        <div class="v8-empty-act"><button type="button" class="lr-btn lr-btn-primary" data-toast="Откроется раздел «Занятие» — вкладка «Сегодня»">Перейти к занятию →</button><span>Первое упражнение появится здесь сразу после отметки.</span></div>
      </section>`;
      return;
    }
    const ids = Object.keys(EX).filter(id => okSrc(EX[id].src)).map(summary).sort((a, b) => utc(b.last.date) - utc(a.last.date));
    host.innerHTML = `<section class="lr-card v8a-list" aria-labelledby="v8a-list-h">
      <div class="v8a-head"><h2 class="v8-h2" id="v8a-list-h">Упражнения <small>${ids.length} · сначала недавние · нажми, чтобы открыть историю</small></h2>${state.src === 'check' ? `<div class="v8-legend"><span><svg viewBox="0 0 10 10" aria-hidden="true"><rect class="b-self" width="10" height="10"/></svg>самостоятельно</span><span><svg viewBox="0 0 10 10" aria-hidden="true"><rect class="b-fixed" width="10" height="10"/></svg>с исправлением</span><span><svg viewBox="0 0 10 10" aria-hidden="true"><rect class="b-shown" width="10" height="10"/></svg>показано</span><span><svg viewBox="0 0 10 10" aria-hidden="true"><rect class="b-skip" width="10" height="10"/></svg>пропущено</span></div>` : legend()}</div>
      <div class="v8a-cols" aria-hidden="true"><span>Упражнение</span><span>Темп по датам · ${short(START)} — ${short(TODAY)}</span><span>Лучший</span><span>Последняя отметка</span><span></span></div>
      <ul class="v8a-items">${ids.map(s => {
        const open = state.open === s.id, ex = EX[s.id], isCheck = ex.src === 'check';
        const n = s.list.length;
        const best = isCheck ? `<b>${s.best}/6</b><small>самост.</small>`
          : s.best ? `<b>${s.best}</b><small>было ${s.first}</small>` : `<b aria-hidden="true">—</b><small>ещё нет «Чисто»</small>`;
        const last = isCheck ? `<span class="v8-mark is-check">${s.last.res.self} из ${total(s.last.res)}</span>` : markChip(s.last.mark);
        return `<li class="v8a-item${open ? ' is-open' : ''}">
          <button type="button" class="v8a-row" data-open="${s.id}" aria-expanded="${open}" aria-controls="v8a-d-${s.id}">
            <span class="v8a-name"><b>${esc(ex.title)}</b><span>${esc(ex.mat)} · ${n} ${isCheck ? plural(n, 'проверка', 'проверки', 'проверок') : plural(n, 'проход', 'прохода', 'проходов')}</span></span>
            <span class="v8a-spark">${spark(s)}<span class="v8-sr">${esc(sparkText(s))}</span></span>
            <span class="v8a-best">${best}${!isCheck && !s.best ? '<span class="v8-sr">Лучшего темпа пока нет</span>' : ''}</span>
            <span class="v8a-last">${last}<small>${short(s.last.date)}${isCheck ? ' · самостоятельно' : ` · ${s.last.bpm} BPM`}</small></span>
            <span class="v8a-chev" aria-hidden="true">▸</span>
          </button>
          <div class="v8a-detail" id="v8a-d-${s.id}" data-detail="${s.id}"${open ? '' : ' hidden'}></div>
        </li>`;
      }).join('')}</ul>
    </section>`;
    if (state.open) fillDetail(state.open);
  }
  function fillDetail(id) {
    const box = $(`[data-detail="${id}"]`);
    if (!box) return;
    const s = summary(id), ex = EX[id];
    const rows = [...s.list].reverse();
    if (ex.src === 'check') {
      box.innerHTML = `<div class="v8a-dtop"><span>${esc(SRC.check)} · первый ответ без подсказки считается «самостоятельно»</span><button type="button" class="lr-btn v8-btn-s" data-toast="${esc(`Откроется «${ex.title}»`)}">Проверить снова</button></div>
        <table class="v8-table"><thead><tr><th>Дата</th><th>Результат</th><th>Ответы</th><th>Ошибки</th><th>Время</th></tr></thead><tbody>${rows.map(e => `<tr><td>${short(e.date)}</td><td class="num">${e.res.self} из ${total(e.res)}</td><td><span class="v8b-res">${stack(e.res)}${esc(resText(e.res))}</span></td><td>${esc(e.errors.join(', '))}</td><td>${e.min} мин</td></tr>`).join('')}</tbody></table>`;
      return;
    }
    box.innerHTML = `<div class="v8a-dtop"><span>${esc(SRC.play)} · ♩ = BPM${id === 'link' ? ', играешь восьмыми' : ''}</span><button type="button" class="lr-btn lr-btn-primary v8-btn-s" data-toast="${esc(`Откроется экран игры: ${ex.title} · ${s.best || s.last.bpm} BPM`)}">▶ Играть с ${s.best || s.last.bpm}</button></div>
      <div class="v8a-chart" data-chart></div>
      <table class="v8-table"><thead><tr><th>Дата</th><th>Темп</th><th>Отметка</th><th>Заметка</th><th>Время</th></tr></thead><tbody>${rows.map(e => `<tr><td>${short(e.date)}</td><td class="num">${e.bpm}</td><td>${markChip(e.mark)}</td><td>${esc(e.note || '—')}</td><td>${e.min} мин</td></tr>`).join('')}</tbody></table>`;
    const chart = $('[data-chart]', box);
    chart.innerHTML = bigChart(s, Math.max(320, Math.floor(chart.clientWidth || box.clientWidth - 24)));
  }
  function renderWeek() {
    const mon = monday(TODAY), prev = addDays(mon, -7);
    const days = Array.from({ length: 7 }, (_, i) => addDays(mon, i));
    const mins = days.map(k => minutesOf(dayEntries(k)));
    const max = Math.max(20, ...mins);
    const stat = m => { const list = Array.from({ length: 7 }, (_, i) => minutesOf(dayEntries(addDays(m, i)))); return { min: list.reduce((a, b) => a + b, 0), days: list.filter(Boolean).length }; };
    const now = stat(mon), before = stat(prev);
    const scope = state.src === 'all' ? '' : state.src === 'play' ? ' · только игра' : ' · только «Проверь себя»';
    $('[data-week]').innerHTML = `<h2 class="v8-h2" id="v8a-week-h">Эта неделя <small>${range(mon)}${scope}</small></h2>
      <div class="v8-week" role="img" aria-label="${esc(`Активные минуты по дням: ${days.map((k, i) => `${WD[d(k).getUTCDay()]} ${utc(k) > utc(TODAY) ? 'впереди' : mins[i] ? `${mins[i]} мин` : 'без занятий'}`).join(', ')}`)}">${days.map((k, i) => {
        const future = utc(k) > utc(TODAY), today = k === TODAY;
        return `<div class="v8-wd${future ? ' is-future' : ''}${today ? ' is-today' : ''}">${mins[i] ? `<span class="v8-wv">${mins[i]}</span><i style="height:${Math.round(mins[i] / max * 64)}px"></i>` : future ? '<i></i>' : ''}<span class="v8-wl">${WD[d(k).getUTCDay()]}</span></div>`;
      }).join('')}</div>
      ${!hasHistory() ? `<p class="v8-quiet">Первое занятие отметится здесь — минуты активного времени по дням.</p>`
        : `<div class="v8-wtot"><span><b>${now.min} мин</b> активного времени · ${nDays(now.days)} занятий${utc(TODAY) < utc(addDays(mon, 6)) ? ' (неделя идёт)' : ''}</span><span>Прошлая неделя: ${before.min} мин · ${nDays(before.days)}</span></div>`}`;
  }

  /* ---------- B · Календарь ---------- */
  const level = m => !m ? '' : m < 8 ? 'lvl-1' : m < 13 ? 'lvl-2' : m < 16 ? 'lvl-3' : 'lvl-4';
  function renderCal() {
    const last = monday(TODAY);
    const weeks = hasHistory() ? [addDays(last, -21), addDays(last, -14), addDays(last, -7), last] : [last];
    const head = `<span class="v8b-hd">Неделя</span>${['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map(w => `<span class="v8b-hd">${w}</span>`).join('')}<span class="v8b-hd">Итог</span>`;
    const rows = weeks.map(mon => {
      let wMin = 0, wDays = 0;
      const cells = Array.from({ length: 7 }, (_, i) => {
        const k = addDays(mon, i), n = d(k).getUTCDate();
        if (utc(k) > utc(TODAY)) return `<span class="v8b-day is-future" aria-hidden="true"><span class="v8b-dn">${n}</span></span>`;
        if (hasHistory() && utc(k) < utc(START)) return `<span class="v8b-day is-out" title="До начала записей"><span class="v8b-dn">${n}</span></span>`;
        const list = dayEntries(k), m = minutesOf(list);
        if (m) { wMin += m; wDays++; }
        const kinds = [...new Set(list.map(e => e.src))];
        const hi = state.hiEx && list.some(e => e.ex === state.hiEx);
        const sel = state.day === k;
        const label = `${long(k)}${k === TODAY ? ', сегодня' : ''}: ${m ? `${m} мин, ${list.length} ${plural(list.length, 'запись', 'записи', 'записей')}` : 'без занятий'}${hi ? `, есть «${EX[state.hiEx].title}»` : ''}`;
        return `<button type="button" class="v8b-day ${level(m)}${k === TODAY ? ' is-today' : ''}${hi ? ' is-hi' : ''}" data-day="${k}" aria-pressed="${sel}" tabindex="${sel ? 0 : -1}" aria-label="${esc(label)}"><span class="v8b-dn">${n}</span>${m ? `<span class="v8b-dm">${m} мин</span>` : '<span></span>'}${kinds.length ? `<span class="v8b-dk" aria-hidden="true">${kinds.map(s => `<i class="is-${s}"></i>`).join('')}</span>` : ''}</button>`;
      }).join('');
      const tot = !hasHistory() ? '' : wMin ? `<b>${wMin} мин</b><br>${nDays(wDays)}` : '—';
      return `<span class="v8b-wk">${range(mon)}</span>${cells}<span class="v8b-tot">${tot}</span>`;
    }).join('');
    const scope = state.src === 'all' ? 'всё' : state.src === 'play' ? 'только игра' : 'только «Проверь себя»';
    $('[data-cal-card]').innerHTML = `<h2 class="v8-h2" id="v8b-cal-h">Календарь <small>${hasHistory() ? `активные минуты · ${scope}` : 'эта неделя'}</small></h2>
      <div class="v8b-cal" data-cal>${head}${rows}</div>
      ${hasHistory() ? `<div class="v8b-legend"><span>Число в клетке — минуты.</span><span class="v8b-scale" aria-hidden="true">меньше <i class="lvl-1"></i><i class="lvl-2"></i><i class="lvl-3"></i><i class="lvl-4"></i> больше</span><span><span class="v8b-dk"><i class="is-play"></i></span> игра</span><span><span class="v8b-dk"><i class="is-check"></i></span> проверь себя</span>${state.hiEx ? `<span>▬ дни с «${esc(EX[state.hiEx].title)}» <button type="button" class="lr-btn lr-btn-ghost v8-btn-s" data-hi-clear>Снять</button></span>` : ''}</div>` : ''}`;
  }
  function renderDay() {
    const box = $('[data-day-card]');
    box.style.flex = hasHistory() ? '' : '0 0 auto';
    if (!hasHistory()) {
      box.innerHTML = `<div class="v8-empty" style="border:0;padding:4px 2px;background:none;gap:10px"><h2>Календарь заполнится после первого занятия</h2><p class="lr-sub">Каждый день покажет активные минуты, а по клику — что ты играл, в каком темпе, какую отметку поставил и как ответил в «Проверь себя».</p><div class="v8-empty-act"><button type="button" class="lr-btn lr-btn-primary" data-toast="Откроется раздел «Занятие» — вкладка «Сегодня»">Перейти к занятию →</button></div></div>`;
      return;
    }
    const list = dayEntries(state.day), all = BY_DATE.get(state.day) || [];
    const title = `<h2 class="v8-h2">${esc(long(state.day)[0].toUpperCase() + long(state.day).slice(1))}${state.day === TODAY ? ' · сегодня' : ''} <small>${list.length ? `${minutesOf(list)} мин активного времени · ${list.length} ${plural(list.length, 'запись', 'записи', 'записей')}` : ''}</small></h2>`;
    if (!list.length) {
      box.innerHTML = `${title}<p class="v8-quiet">${all.length ? 'В этот день были только записи другого источника — переключи фильтр на «Всё».' : state.day === TODAY ? 'Сегодня ещё не занимался. Трудные места справа можно добавить в план.' : 'В этот день занятий не было.'}</p>`;
      return;
    }
    box.innerHTML = `${title}<ul class="v8b-entries">${list.map(e => {
      const ex = EX[e.ex];
      if (e.src === 'check') return `<li class="v8b-entry"><div><span class="v8-src is-check">${esc(SRC.check)}</span><br><b>${esc(ex.title)}</b><p>${esc(ex.mat)}</p><span class="v8b-res">${stack(e.res)}${esc(resText(e.res))}${e.errors.length ? ` · ошибки: ${esc(e.errors.join(', '))}` : ''}</span></div><span>${checkChip(e.res)}</span><span class="v8b-min">${e.min} мин</span></li>`;
      return `<li class="v8b-entry"><div><span class="v8-src">${esc(SRC.play)}</span><br><b>${esc(ex.title)}</b><p>${esc(ex.mat)}${e.note ? ` · заметка: ${esc(e.note)}` : ''}</p></div><span style="display:flex;align-items:center;gap:12px">${markChip(e.mark)}<span class="v8b-bpm">${e.bpm}<small>BPM ♩</small></span></span><span class="v8b-min">${e.min} мин</span></li>`;
    }).join('')}</ul>`;
  }
  function renderBest() {
    const box = $('[data-best-card]');
    const onlyCheck = state.src === 'check';
    const head = `<h2 class="v8-h2" title="Нажми упражнение — дни с ним отметятся в календаре">${onlyCheck ? 'Проверь себя: лучший результат' : 'Лучший темп'} <small>${onlyCheck ? 'самостоятельно' : 'BPM ♩ · «Чисто»'}</small></h2>`;
    if (!hasHistory()) { box.innerHTML = `${head}<p class="v8-quiet">Появится, когда отметишь первый проход «Чисто». Темп выбираешь ты — от удобного, без спешки.</p>`; return; }
    const ids = Object.keys(EX).filter(id => okSrc(EX[id].src)).map(summary);
    box.innerHTML = `${head}<ul class="v8-best">${ids.map(s => {
      const ex = EX[s.id], on = state.hiEx === s.id;
      const val = ex.src === 'check' ? `${s.best} из 6<small>сам.</small>` : s.best ? `${s.best}<small>было ${s.first}</small>` : `—<small>нет «Чисто»</small>`;
      return `<li><button type="button" data-hi="${s.id}" aria-pressed="${on}" title="${esc(`${ex.mat} · отметить дни в календаре`)}"><b>${esc(ex.title)}</b><strong>${val}</strong></button></li>`;
    }).join('')}</ul>`;
  }

  function renderAll() {
    renderNote(); renderHard(); renderA(); renderWeek(); renderCal(); renderDay(); renderBest();
    $$('[data-src]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.src === state.src)));
    $$('[data-demo]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.demo === state.demo)));
  }

  /* ---------- События ---------- */
  root.addEventListener('click', event => {
    const t = event.target;
    const src = t.closest('[data-src]'); if (src) { state.src = src.dataset.src; if (state.hiEx && !okSrc(EX[state.hiEx].src)) state.hiEx = null; renderAll(); return; }
    const demo = t.closest('[data-demo]'); if (demo) { state.demo = demo.dataset.demo; state.open = null; state.hiEx = null; state.day = hasHistory() ? '2026-11-11' : TODAY; renderAll(); return; }
    const open = t.closest('[data-open]');
    if (open) {
      const id = open.dataset.open;
      state.open = state.open === id ? null : id;
      renderA();
      const again = $(`[data-open="${id}"]`); again.focus();
      if (state.open) again.closest('.v8a-item').scrollIntoView({ block: 'nearest' });
      return;
    }
    const plan = t.closest('[data-plan]');
    if (plan) {
      const h = HARD.find(x => x.id === plan.dataset.plan);
      if (state.planned.has(h.id)) { state.planned.delete(h.id); toast(`Убрано из плана на сегодня: ${h.plan}`); }
      else { state.planned.add(h.id); toast(`Добавлено в план на сегодня: ${h.plan}`); }
      const focusId = h.id; renderHard();
      const target = $$(`[data-plan="${focusId}"]`).find(b => b.offsetParent); target?.focus();
      return;
    }
    const day = t.closest('[data-day]'); if (day) { state.day = day.dataset.day; renderCal(); renderDay(); $(`[data-day="${state.day}"]`).focus(); return; }
    const hi = t.closest('[data-hi]'); if (hi) { state.hiEx = state.hiEx === hi.dataset.hi ? null : hi.dataset.hi; renderBest(); renderCal(); $(`[data-hi="${hi.dataset.hi}"]`).focus(); return; }
    if (t.closest('[data-hi-clear]')) { state.hiEx = null; renderBest(); renderCal(); return; }
    const tt = t.closest('[data-toast]'); if (tt) toast(tt.dataset.toast);
  });
  /* Календарь: стрелки — соседний день и неделя, Home/End — начало и конец недели. */
  root.addEventListener('keydown', event => {
    const cell = event.target.closest?.('[data-day]');
    if (!cell) return;
    const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[event.key];
    let next = null;
    if (step) next = addDays(cell.dataset.day, step);
    if (event.key === 'Home') next = monday(cell.dataset.day);
    if (event.key === 'End') next = addDays(monday(cell.dataset.day), 6);
    if (!next) return;
    event.preventDefault();
    if (!$(`[data-day="${next}"]`)) return;
    state.day = next; renderCal(); renderDay(); $(`[data-day="${next}"]`).focus();
  });
  window.addEventListener('resize', () => { if (state.open && root.dataset.candidate === 'a') fillDetail(state.open); });

  L.mount(root, { candidates: ['a', 'b'] });
  renderAll();
  new MutationObserver(() => { if (state.open) fillDetail(state.open); }).observe(root, { attributes: true, attributeFilter: ['data-candidate'] });
})();
</script>
