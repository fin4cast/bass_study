<div id="studio-lesson" data-candidate="a" aria-label="VIS-12 r1 — Справочник"></div>
<script>
(() => {
  const L = window.LessonRef;
  const esc = L.esc;
  const ex = L.material.ex1;
  const root = document.getElementById('studio-lesson');
  const params = new URLSearchParams(location.search);

  /* ---------- Самопроверка высоты: MIDI = E 28, A 33, D 38, G 43 + лад; C2 = 36 ---------- */
  const OPEN = { E: 28, A: 33, D: 38, G: 43 };
  const PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const midiOfPos = id => { const [s, f] = id.split(/[:/]/); if (!(s in OPEN)) throw new Error(`VIS-12: неизвестная струна в ${id}`); return OPEN[s] + Number(f); };
  function midiOfName(name) {
    const m = /^([A-G])([♯♭]?)(\d)$/.exec(name);
    if (!m) throw new Error(`VIS-12: не разобрана нота ${name}`);
    return (Number(m[3]) + 1) * 12 + PC[m[1]] + (m[2] === '♯' ? 1 : m[2] === '♭' ? -1 : 0);
  }
  function assertPitch(id, pitch) {
    if (midiOfPos(id) !== midiOfName(pitch)) throw new Error(`VIS-12: позиция ${id} звучит как MIDI ${midiOfPos(id)}, а подписана ${pitch} (MIDI ${midiOfName(pitch)}).`);
  }
  if (midiOfName('C2') !== 36 || midiOfName('E1') !== 28) throw new Error('VIS-12: сбита научная нумерация октав.');

  /* ---------- Разметка текста: экранирование, затем токены ---------- */
  // {p:E/5} или {p:E/5|A1} — позиция (высота сверяется), {d:♭3} — ступень, {r:vi} — римская цифра аккорда,
  // {f:1} — палец, {t:id|подпись} — термин-ссылка, **…** — жирный.
  function rich(text) {
    return esc(text)
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/\{([pdrft]):([^{}]+)\}/g, (_, kind, body) => {
        if (kind === 'p') {
          const [pos, pitch] = body.split('|');
          if (pitch) assertPitch(pos, pitch); else midiOfPos(pos);
          return `<span class="r-pos">${pos}</span>${pitch ? ` <span class="r-pitch">${pitch}</span>` : ''}`;

        <button type="button" class="r-tab" data-toast="Вкладка «Сегодня» — VIS-10">Сегодня</button>
        <button type="button" class="r-tab" data-toast="Вкладка «Библиотека» — VIS-10">Библиотека</button>
        <button type="button" class="r-tab" data-toast="Вкладка «Основы» — VIS-10">Основы</button>
        <button type="button" class="r-tab r-tab-ref" aria-current="page">${TAB_ICON}Справочник</button>
      </nav></div>
    <div class="r-ctx"><div class="r-ctx-left"><button type="button" class="r-back" data-toast="Вернёт в «Основы»: уровень 2, шаг «Общие ноты соседних форм»">← Основы · уровень 2</button><span class="lr-sub">Понятия по уровням: сначала звук и пальцы, потом термин. Ничего не закрыто.</span></div>
      <div class="r-count"><span data-count></span><div class="lr-meter"><i data-count-meter></i></div></div></div>
    <div class="r-grid">
      <aside class="r-side" aria-label="Понятия">
        <label class="r-search">${SEARCH_ICON}<input type="search" data-q placeholder="Найти: октава, ♭3, H, кварта…" aria-label="Поиск понятий" autocomplete="off"></label>
        <nav class="r-list" data-list aria-label="Понятия по уровням"></nav>
        <p class="r-side-note">✓ — отметил сам «освоено». Отметка ничего не открывает и не закрывает.</p>
      </aside>
      <div class="r-cardwrap" data-card-host="a"></div>
    </div>`;

  /* ---------- B · Панель поверх экрана игры ---------- */
  const events = ex.notation.events;
  const pausedAt = 5;
  const bgBoard = L.fretboard({ fretMin: 3, fretMax: 12, notes: L.ex1BoardNotes({ labels: 'name' }), current: events[pausedAt].positionId, width: 1000, marker: 38 });
  const termChip = (id, label) => `<button type="button" class="lr-chip lr-chip-concept r-term" data-term="${id}"><span>${esc(label)}</span></button>`;
  const mainB = `
    <div class="r-hint">ⓘ Подчёркнутое — термин: клик открывает справочник сбоку, игра ждёт на паузе. Esc — назад к термину.</div>
    <section class="r-bg" data-bg>
      <div class="r-bg-head"><button type="button" class="r-back" data-toast="Вернёт в «Занятие» · план на сегодня">← Занятие · план на сегодня, шаг 2 из 4</button>
        <div class="r-bg-title"><h1>Связка соседних форм · Am · A → B</h1><span class="lr-sub">16 восьмых · 2 такта</span></div>
        <div class="r-bg-chips"><span>Понятия:</span>${termChip('shared', 'Общие ноты')}${termChip('degree', 'Ступени ♭3 · ♭7')}${termChip('penta', 'Пентатоника')}</div></div>
      <div class="lr-concept"><p>${rich(`Соседние формы {t:penta|пентатоники} делят {t:shared|общие ноты}: ${sharedText}. Тоника A звучит в двух {t:octnum|октавах} — A1 и A2 ({t:octave|октава}: +2 струны, +2 лада). Опорные {t:degree|ступени ♭3 и ♭7} — C и G.`)}</p></div>
      <div class="lr-tab"><header><span>${rich('{t:tab|TAB} · бас E–A–D–G')}</span><span>${rich('счёт {t:count|1 и 2 и 3 и 4 и} · такт 1 — вверх по форме A')}</span></header>${L.tab({ events, current: pausedAt, width: 1000, lineGap: 16, fontSize: 15 })}</div>
      <div class="lr-board">${bgBoard}</div>
      <div class="r-bg-row">
        <div class="lr-legend"><span><i style="background:var(--s-root)"></i>Тоника A</span><span><i style="background:var(--s-note)"></i>Форма A · 5–8</span><span><i style="background:var(--s-form-b)"></i>Форма B · 7–10</span><span><i style="background:var(--s-shared)"></i>Общие ноты</span></div>
      </div>
      <div class="lr-transport"><button type="button" class="lr-btn lr-btn-primary" data-toast="Фон упрощён: игра — в VIS-11">▶ Продолжить <span class="lr-kbd">Пробел</span></button><span class="lr-sub">Пауза на ноте ${pausedAt + 1} из ${events.length} · 76 BPM · продолжится со следующей ноты без отсчёта</span></div>
    </section>`;
  const drawer = `
    <div class="r-scrim" data-scrim hidden></div>
    <aside class="r-drawer" data-drawer role="dialog" aria-modal="true" aria-labelledby="r-d-title" hidden>
      <header class="r-d-head"><button type="button" class="r-d-icon" data-d-back aria-label="Назад к предыдущему понятию" hidden>←</button><strong id="r-d-title">Справочник</strong><span class="lr-sub" data-d-from></span>
        <button type="button" class="r-d-close" data-d-close aria-label="Закрыть справочник">✕ <span class="lr-kbd">Esc</span></button></header>
      <div class="r-d-search"><label class="r-search">${SEARCH_ICON}<input type="search" data-dq placeholder="Другое понятие: кварта, E1, H…" aria-label="Поиск по справочнику" autocomplete="off"></label></div>
      <ul class="r-d-hits" data-d-hits hidden></ul>
      <div class="r-d-body" data-card-host="b"></div>
      <footer class="r-d-foot"><span>Игра на паузе под панелью</span><button type="button" data-d-full>Весь справочник →</button></footer>
    </aside>`;

  root.innerHTML = `<div data-candidate-panel="a">${L.shell('lesson', mainA)}</div><div data-candidate-panel="b">${L.shell('lesson', mainB).replace(/<\/div>$/, `${drawer}</div>`)}</div><div class="r-toast" role="status" aria-live="polite" data-toast-box></div>`;
  L.mount(root, { candidates: ['a', 'b'] });

  const $ = (sel, scope = root) => scope.querySelector(sel);
  const $$ = (sel, scope = root) => [...scope.querySelectorAll(sel)];
  const panelA = $('[data-candidate-panel="a"]'), panelB = $('[data-candidate-panel="b"]');
  const toastBox = $('[data-toast-box]');
  let toastTimer = null;
  function toast(text) {
    toastBox.textContent = text; toastBox.classList.add('is-on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastBox.classList.remove('is-on'), 2600);
  }

  /* A: список, поиск, выбор */
  const A = { id: asked ?? 'octnum', q: '' };
  const qA = $('[data-q]', panelA), listA = $('[data-list]', panelA), hostA = $('[data-card-host="a"]', panelA);
  function renderList() {
    const groups = LEVELS.map(l => {
      const own = CONCEPTS.filter(c => c.lv === l.id && matches(c, A.q));
      const alias = CONCEPTS.filter(c => c.alsoLv === l.id && matches(c, A.q));
      const total = CONCEPTS.filter(c => c.lv === l.id);
      if (!own.length && !alias.length) return '';
      return `<section class="r-group"><h3><span class="r-lvl" aria-hidden="true">${esc(l.mark)}</span>${esc(l.title)}<small>${total.filter(c => mastered.has(c.id)).length} из ${total.length}</small></h3><ul>${own.map(c => listItem(c)).join('')}${alias.map(c => listItem(c, true)).join('')}</ul></section>`;
    }).join('');
    listA.innerHTML = groups || `<p class="r-empty">Ничего не нашлось по «${esc(A.q)}». Попробуй «октава», «ступень», «H» или «доля».</p>`;
    $$('.r-item', listA).forEach(b => b.setAttribute('aria-current', String(b.dataset.concept === A.id)));
    const done = CONCEPTS.filter(c => mastered.has(c.id)).length;
    $('[data-count]', panelA).textContent = `Освоено ${done} из ${CONCEPTS.length}`;
    $('[data-count-meter]', panelA).style.width = `${Math.round(done / CONCEPTS.length * 100)}%`;
  }
  function selectA(id, { focus = false } = {}) {
    A.id = id;
    hostA.innerHTML = cardHtml(BY.get(id), 'a');
    hostA.scrollTop = 0;
    renderList();
    if (focus) $('h2', hostA).focus();
  }
  qA.addEventListener('input', () => { A.q = qA.value.trim(); renderList(); });
  qA.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const first = $('.r-item', listA); if (first) { selectA(first.dataset.concept); first.focus(); } }
    if (e.key === 'ArrowDown') { e.preventDefault(); $('.r-item', listA)?.focus(); }
    if (e.key === 'Escape' && qA.value) { e.preventDefault(); qA.value = ''; A.q = ''; renderList(); }
  });
  listA.addEventListener('keydown', e => {
    if (!['ArrowDown', 'ArrowUp'].includes(e.key)) return;
    const items = $$('.r-item', listA), i = items.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    if (e.key === 'ArrowUp' && i === 0) { qA.focus(); return; }
    items[Math.max(0, Math.min(items.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))].focus();
  });

  /* B: панель поверх, история внутри панели, поиск, Esc и возврат фокуса */
  const appB = $('.lr-app', panelB), drawerEl = $('[data-drawer]', panelB), scrim = $('[data-scrim]', panelB);
  const hostB = $('[data-card-host="b"]', panelB), qB = $('[data-dq]', panelB), hitsB = $('[data-d-hits]', panelB);
  const B = { stack: [], opener: null };
  function renderB({ focus = true } = {}) {
    const id = B.stack[B.stack.length - 1];
    hostB.innerHTML = cardHtml(BY.get(id), 'b');
    hostB.scrollTop = 0;
    $('[data-d-back]', panelB).hidden = B.stack.length < 2;
    $('[data-d-from]', panelB).textContent = B.opener ? `из экрана игры · «${B.opener.textContent.trim()}»` : '';
    if (focus) $('h2', hostB).focus();
  }
  function setInert(on) { [$('.lr-nav', appB), $('.lr-main', appB)].forEach(el => { if (on) el.setAttribute('inert', ''); else el.removeAttribute('inert'); }); }
  function openPanel(id, opener, { focus = true } = {}) {
    B.opener?.classList.remove('is-open');
    B.stack = [id]; B.opener = opener; opener?.classList.add('is-open');
    qB.value = ''; hitsB.hidden = true;
    drawerEl.hidden = false; scrim.hidden = false; setInert(true);
    renderB({ focus });
  }
  function closePanel() {
    if (drawerEl.hidden) return;
    drawerEl.hidden = true; scrim.hidden = true; setInert(false);
    B.opener?.classList.remove('is-open');
    B.opener?.focus();
  }
  const goB = id => { B.stack.push(id); qB.value = ''; hitsB.hidden = true; renderB(); };
  function searchB() {
    const q = qB.value.trim();
    if (!q) { hitsB.hidden = true; return; }
    const hits = CONCEPTS.filter(c => matches(c, q)).slice(0, 6);
    hitsB.innerHTML = hits.length ? hits.map(c => `<li><button type="button" data-d-hit="${c.id}"><span>${esc(c.title)}</span><small>${esc(levelOf(c.lv).title)}</small></button></li>`).join('') : `<li class="r-empty">Ничего не нашлось по «${esc(q)}».</li>`;
    hitsB.hidden = false;
  }
  qB.addEventListener('input', searchB);
  qB.addEventListener('keydown', e => { if (e.key === 'Enter') { const first = $('[data-d-hit]', hitsB); if (first) goB(first.dataset.dHit); } });
  document.addEventListener('keydown', e => {
    if (root.dataset.candidate !== 'b' || drawerEl.hidden) return;
    if (e.key === 'Escape') { e.preventDefault(); closePanel(); return; }
    if (e.key !== 'Tab') return;
    const focusable = $$('button:not([hidden]),input,[tabindex="0"]', drawerEl).filter(el => el.offsetParent !== null);
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (!drawerEl.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && (document.activeElement === first || document.activeElement === $('h2', hostB))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  /* Общие действия: делегирование по корню */
  root.addEventListener('click', e => {
    const t = e.target;
    const inB = panelB.contains(t);
    const item = t.closest('[data-concept]');
    if (item) { selectA(item.dataset.concept); return; }
    const term = t.closest('[data-term]');
    if (term) {
      const id = term.dataset.term;
      if (!inB) selectA(id, { focus: true });
      else if (drawerEl.contains(term)) goB(id);
      else openPanel(id, term);
      return;
    }
    const hit = t.closest('[data-d-hit]'); if (hit) { goB(hit.dataset.dHit); return; }
    if (t.closest('[data-d-close]') || t.closest('[data-scrim]')) { closePanel(); return; }
    if (t.closest('[data-d-back]')) { B.stack.pop(); renderB(); return; }
    if (t.closest('[data-d-full]')) { toast(`Откроется страница справочника на понятии «${BY.get(B.stack[B.stack.length - 1]).title}» (кандидат A)`); return; }
    const master = t.closest('[data-master]');
    if (master) {
      const id = master.dataset.master;
      mastered.has(id) ? mastered.delete(id) : mastered.add(id);
      const on = mastered.has(id);
      $$(`[data-master="${id}"]`).forEach(b => { b.setAttribute('aria-pressed', String(on)); b.textContent = on ? '✓ Освоено' : '○ Отметить: освоено'; });
      renderList();
      toast(on ? 'Отмечено «освоено» — только для тебя, ничего не закрывается' : 'Отметка снята');
      return;
    }
    const lens = t.closest('[data-lens]');
    if (lens) {
      const c = BY.get(lens.dataset.lensCard), scope = inB ? 'b' : 'a', card = lens.closest('.r-card');
      lensOf[`${scope}:${c.id}`] = lens.dataset.lens;
      $(`[data-board-host="${c.id}"]`, card).innerHTML = boardHtml(c, scope);
      $$('[data-lens]', card).forEach(b => b.setAttribute('aria-pressed', String(b === lens)));
      return;
    }
    const opt = t.closest('[data-opt]');
    if (opt) {
      const box = opt.closest('[data-check]'), c = BY.get(box.dataset.check), i = Number(opt.dataset.opt);
      const right = i === c.check.a;
      opt.dataset.state = right ? 'right' : 'wrong';
      if (right) $$('[data-opt]', box).forEach(b => { b.disabled = b !== opt; });
      $('[data-verdict]', box).innerHTML = `${right ? '<b>Верно.</b>' : '<b>Не то — попробуй ещё.</b>'} ${right ? rich(c.check.why) : ''}`;
      return;
    }
    const listen = t.closest('[data-listen]'); if (listen) { toast(`♪ В макете звука нет. В приложении прозвучит: ${listen.dataset.listen}`); return; }
    const rel = t.closest('[data-rel]'); if (rel) { toast(`Откроется экран игры: ${rel.dataset.rel}`); return; }
    const tb = t.closest('[data-toast]'); if (tb) toast(tb.dataset.toast);
  });

  selectA(A.id);
  // B открыт на термине, чтобы референс показывал панель; Esc закрывает и возвращает фокус к чипу.
  const opener = (asked && $(`.r-bg [data-term="${asked}"]`, panelB)) || $('.r-bg-chips [data-term="shared"]', panelB);
  openPanel(asked ?? 'shared', opener, { focus: false });
  if (root.dataset.candidate === 'b' && !params.has('capture')) $('h2', hostB).focus();
})();
</script>
