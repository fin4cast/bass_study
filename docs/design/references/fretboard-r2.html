<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>VIS-01 r2 — UX-референсы грифа bass.study</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 24px; font: 14px/1.5 'Segoe UI', Arial, sans-serif; background: light-dark(#e8ebe4, #141817); color: light-dark(#252d2b, #edf0e9); }
    .review-shell { max-width: 1440px; margin: auto; }
    .review-header { display: flex; justify-content: space-between; gap: 18px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
    .review-header p { margin: 0; font-size: 12px; }
    .review-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .review-tabs button { font: inherit; padding: 9px 14px; border: 1px solid light-dark(#c5cdc1, #4a564d); border-radius: 6px; background: light-dark(#f7f8f3, #242d28); color: inherit; cursor: pointer; }
    .review-tabs button[aria-pressed=true] { background: light-dark(#28392e, #dde7da); color: light-dark(#f7f8f3, #242d28); }
    .review-header select { font: inherit; padding: 6px; background: light-dark(#f7f8f3, #242d28); color: inherit; border: 1px solid light-dark(#c5cdc1, #4a564d); border-radius: 4px; }
    .review-footnote { font-size: 12px; margin: 17px 0; color: light-dark(#536355, #b7c5b7); }
    @media (max-width: 600px) { body { padding: 10px; } }
  </style>
</head>
<body>
<div class="review-shell">
  <div class="review-header">
    <div><strong>VIS-01 · Гриф · r2</strong><p>Мастерская · три исполнения грифа · ни один не утверждён</p></div>
    <nav class="review-tabs" aria-label="Кандидаты UX">
      <button type="button" data-ref-choice="0" aria-pressed="true">Точный гриф</button>
      <button type="button" data-ref-choice="1" aria-pressed="false">Инструментальный</button>
      <button type="button" data-ref-choice="2" aria-pressed="false">Связи на грифе</button>
    </nav>
    <label>Тема <select id="review-theme"><option value="light dark">Системная</option><option value="light">Светлая</option><option value="dark">Тёмная</option></select></label>
  </div>
<div id="fretboard-material-study" class="viz-carousel" aria-label="Три исполнения грифа в Мастерской" data-previous-label="Предыдущее исполнение" data-next-label="Следующее исполнение">
  <section data-variant="Точный гриф" aria-label="VIS-01-A1 — Точный гриф"><div class="m2-app" data-version="precise"></div></section>
  <section data-variant="Инструментальный" aria-label="VIS-01-A2 — Инструментальный" hidden><div class="m2-app" data-version="instrument"></div></section>
  <section data-variant="Связи на грифе" aria-label="VIS-01-A3 — Связи на грифе" hidden><div class="m2-app" data-version="connections"></div></section>
</div>
<style>
  #fretboard-material-study{--m2-paper:light-dark(#faf9f6,#1d2221);--m2-side:light-dark(#f0f1eb,#242c27);--m2-ink:light-dark(#26352d,#ecf1e8);--m2-muted:light-dark(#5c6b62,#afbbb0);--m2-line:light-dark(#d9dfd5,#3c4a40);--m2-soft:light-dark(#f3e5cf,#4c3a25);--m2-accent:light-dark(#8b5524,#e9b67d);--m2-neck:light-dark(#1b2923,#14201a);--m2-neck-text:light-dark(#e9f1e6,#e9f1e6);--m2-steel:light-dark(#a8b7aa,#a8b7aa);--m2-wire:light-dark(#6d8375,#6d8375);--m2-note:light-dark(#e4eddb,#e4eddb);--m2-note-ink:light-dark(#193123,#193123);--m2-root:light-dark(#f1bd76,#f1bd76);--m2-root-ink:light-dark(#35230d,#35230d);--m2-link:light-dark(#a6d9ed,#a6d9ed);font-family:'Segoe UI Variable','Segoe UI',Arial,sans-serif;color:var(--m2-ink);font-size:14px;line-height:1.5;}
  #fretboard-material-study *{box-sizing:border-box;}
  #fretboard-material-study [hidden]{display:none!important;}
  #fretboard-material-study .m2-app{background:var(--m2-paper);border:1px solid var(--m2-line);border-radius:12px;overflow:hidden;min-height:850px;}
  #fretboard-material-study button,#fretboard-material-study input{font:inherit;color:inherit;}
  #fretboard-material-study button,#fretboard-material-study summary{cursor:var(--cursor-interaction,pointer);}
  #fretboard-material-study h2,#fretboard-material-study h3,#fretboard-material-study p{margin:0;}
  #fretboard-material-study h2{font-size:25px;font-weight:600;letter-spacing:-.7px;line-height:1.25;}
  #fretboard-material-study h3{font-size:14px;font-weight:600;}
  #fretboard-material-study button:focus-visible,#fretboard-material-study input:focus-visible,#fretboard-material-study summary:focus-visible{outline:3px solid #4a99c3;outline-offset:3px;}
  #fretboard-material-study .m2-layout{display:grid;grid-template-columns:145px minmax(0,1fr) 205px;min-height:848px;}
  #fretboard-material-study .m2-nav{padding:26px 15px 21px;background:var(--m2-side);display:flex;flex-direction:column;gap:35px;}
  #fretboard-material-study .m2-brand{font-size:21px;font-weight:700;letter-spacing:-.8px;white-space:nowrap;}
  #fretboard-material-study .m2-brand span{color:var(--m2-accent);}
  #fretboard-material-study .m2-nav-section{display:flex;flex-direction:column;gap:5px;}
  #fretboard-material-study .m2-nav-caption{font-size:10px;letter-spacing:.13em;color:var(--m2-muted);margin:0 10px 10px;}
  #fretboard-material-study .m2-nav-item{padding:10px 11px;font-size:13px;color:var(--m2-muted);border-left:2px solid transparent;}
  #fretboard-material-study .m2-nav-current{background:var(--m2-paper);border-left-color:var(--m2-accent);color:var(--m2-ink);font-weight:600;}
  #fretboard-material-study .m2-nav-bottom{margin-top:auto;}
  #fretboard-material-study .m2-main{padding:28px 25px 22px;min-width:0;}
  #fretboard-material-study .m2-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:13px;}
  #fretboard-material-study .m2-kicker{font-size:11px;color:var(--m2-muted);letter-spacing:.11em;display:block;margin-bottom:8px;}
  #fretboard-material-study .m2-subtitle{color:var(--m2-muted);font-size:13px;margin-top:8px;}
  #fretboard-material-study .m2-button{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--m2-line);border-radius:5px;background:transparent;padding:8px 10px;font-size:12px;white-space:nowrap;}
  #fretboard-material-study .m2-button:hover{background:var(--m2-side);}
  #fretboard-material-study .m2-modes{display:flex;align-items:center;gap:20px;margin-top:24px;border-bottom:1px solid var(--m2-line);font-size:12px;color:var(--m2-muted);}
  #fretboard-material-study .m2-mode{padding-bottom:12px;}
  #fretboard-material-study .m2-mode-current{border-bottom:2px solid var(--m2-ink);color:var(--m2-ink);font-weight:600;}
  #fretboard-material-study .m2-board-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:19px 0 11px;flex-wrap:wrap;}
  #fretboard-material-study .m2-board-caption{font-size:12px;color:var(--m2-muted);}
  #fretboard-material-study .m2-switch{display:flex;gap:3px;flex-wrap:wrap;}
  #fretboard-material-study .m2-switch button{background:transparent;border:0;border-radius:4px;padding:6px 8px;color:var(--m2-muted);font-size:12px;}
  #fretboard-material-study .m2-switch button[aria-pressed=true]{background:var(--m2-side);color:var(--m2-ink);font-weight:600;}
  #fretboard-material-study .m2-board-area{position:relative;width:100%;height:286px;min-width:0;isolation:isolate;border-radius:9px;background:var(--m2-neck);overflow:hidden;}
  #fretboard-material-study .m2-board-svg{position:absolute;inset:0;width:100%;height:100%;}
  #fretboard-material-study .m2-dot{position:absolute;transform:translate(-50%,-50%);width:25px;height:25px;border:0;border-radius:50%;background:var(--m2-note);color:var(--m2-note-ink);font-size:14px;font-weight:650;line-height:1;padding:0;z-index:2;box-shadow:0 1px 3px #00000050;}
  #fretboard-material-study .m2-dot.m2-root{background:var(--m2-root);color:var(--m2-root-ink);}
  #fretboard-material-study .m2-dot.m2-selected{outline:2px solid #f8fff3;outline-offset:3px;}
  #fretboard-material-study .m2-dot:focus-visible{outline:3px solid #83cbff;outline-offset:7px;}
  #fretboard-material-study .m2-dot.m2-related{background:var(--m2-link);color:#15303d;}
  #fretboard-material-study .m2-dot.m2-dim{background:#415447;color:#d1ddcd;box-shadow:none;}
  #fretboard-material-study .m2-finger{position:absolute;right:-7px;top:-10px;display:flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:2px;background:#f5f0e4;color:#273c2c;font-size:10px;font-weight:600;border:1px solid #1c2b24;}
  #fretboard-material-study .m2-board-area.m2-dense .m2-dot{width:18px;height:18px;font-size:12px;}
  #fretboard-material-study .m2-board-area.m2-tiny .m2-dot{width:13px;height:13px;font-size:11px;box-shadow:none;}
  #fretboard-material-study .m2-board-area.m2-tiny .m2-finger{display:none;}
  #fretboard-material-study .m2-legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--m2-muted);margin:11px 0 0;}
  #fretboard-material-study .m2-legend>span{display:flex;align-items:center;gap:6px;}
  #fretboard-material-study .m2-swatch{display:inline-block;width:8px;height:8px;background:var(--m2-root);border-radius:50%;}
  #fretboard-material-study .m2-swatch-note{background:light-dark(#617a62,#d9e6d0);}
  #fretboard-material-study .m2-swatch-selected{background:transparent;border:1px solid var(--m2-muted);}
  #fretboard-material-study .m2-selection{display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--m2-line);padding:18px 0 16px;min-height:85px;}
  #fretboard-material-study .m2-selection-note{font-size:34px;line-height:1;letter-spacing:-1px;font-weight:500;}
  #fretboard-material-study .m2-selection-copy{display:flex;flex-direction:column;gap:3px;font-size:12px;}
  #fretboard-material-study .m2-selection-copy strong{font-weight:600;font-size:14px;}
  #fretboard-material-study .m2-muted{color:var(--m2-muted);}
  #fretboard-material-study .m2-coordinate{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--m2-muted);font-size:12px;}
  #fretboard-material-study .m2-coordinate strong{background:var(--m2-side);color:var(--m2-ink);font-size:17px;font-weight:500;padding:5px 9px;border-radius:4px;}
  #fretboard-material-study .m2-detail-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;min-height:35px;flex-wrap:wrap;}
  #fretboard-material-study .m2-detail-label{font-size:12px;color:var(--m2-muted);}
  #fretboard-material-study .m2-interval{font-size:15px;font-weight:500;}
  #fretboard-material-study .m2-pitch-strip{display:flex;align-items:baseline;justify-content:space-between;gap:7px;margin-top:20px;padding-top:16px;border-top:1px solid var(--m2-line);}
  #fretboard-material-study .m2-pitch{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:16px;font-weight:500;min-width:29px;}
  #fretboard-material-study .m2-pitch small{font-size:11px;font-weight:400;color:var(--m2-muted);}
  #fretboard-material-study .m2-pitch.is-current{color:var(--m2-accent);}
  #fretboard-material-study .m2-pitch-distance{font-size:11px;color:var(--m2-muted);align-self:center;}
  #fretboard-material-study .m2-footnote{font-size:11px;color:var(--m2-muted);margin-top:16px;}
  #fretboard-material-study .m2-settings{border-left:1px solid var(--m2-line);padding:29px 20px 22px;}
  #fretboard-material-study .m2-settings h3{margin-bottom:23px;}
  #fretboard-material-study .m2-field{margin-top:20px;}
  #fretboard-material-study .m2-field-label{display:block;color:var(--m2-muted);font-size:11px;margin-bottom:7px;}
  #fretboard-material-study .m2-field-value{font-size:14px;}
  #fretboard-material-study .m2-divider{border-top:1px solid var(--m2-line);margin:25px 0 20px;}
  #fretboard-material-study .m2-string-switches{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
  #fretboard-material-study .m2-string-switch{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;min-width:28px;}
  #fretboard-material-study input[type=checkbox]{accent-color:var(--m2-accent);margin:0;}
  #fretboard-material-study .m2-check{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:18px;}
  #fretboard-material-study .m2-settings details{font-size:12px;color:var(--m2-muted);margin-top:24px;}
  #fretboard-material-study .m2-settings details p{margin-top:11px;line-height:1.6;}
  #fretboard-material-study .m2-layout.is-closed{grid-template-columns:145px minmax(0,1fr);}
  #fretboard-material-study .m2-layout.is-closed .m2-settings{display:none;}
  @media(max-width:850px){#fretboard-material-study .m2-app{min-height:915px;}#fretboard-material-study .m2-layout{grid-template-columns:118px minmax(0,1fr) 180px;min-height:913px;}#fretboard-material-study .m2-layout.is-closed{grid-template-columns:118px minmax(0,1fr);}#fretboard-material-study .m2-nav{padding:25px 11px 20px;}#fretboard-material-study .m2-brand{font-size:18px;}#fretboard-material-study .m2-nav-item{padding:10px 8px;font-size:12px;}#fretboard-material-study .m2-main{padding:25px 19px 20px;}#fretboard-material-study .m2-settings{padding:27px 15px 20px;}#fretboard-material-study .m2-heading{flex-wrap:wrap;}#fretboard-material-study h2{font-size:23px;}#fretboard-material-study .m2-modes{gap:12px;font-size:11px;}}
  @media(max-width:620px){#fretboard-material-study .m2-app{min-height:1660px;}#fretboard-material-study .m2-layout,#fretboard-material-study .m2-layout.is-closed{grid-template-columns:minmax(0,1fr);min-height:1658px;}#fretboard-material-study .m2-nav{padding:16px;gap:14px;flex-direction:row;align-items:center;flex-wrap:wrap;}#fretboard-material-study .m2-nav-section{flex-direction:row;gap:2px;flex-wrap:wrap;}#fretboard-material-study .m2-nav-caption,#fretboard-material-study .m2-nav-bottom{display:none;}#fretboard-material-study .m2-nav-item{padding:6px 7px;border-left:0;border-bottom:2px solid transparent;}#fretboard-material-study .m2-nav-current{border-bottom-color:var(--m2-accent);}#fretboard-material-study .m2-main{padding:22px 16px;}#fretboard-material-study .m2-settings{border-left:0;border-top:1px solid var(--m2-line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 18px;padding:22px 18px;}#fretboard-material-study .m2-settings h3,#fretboard-material-study .m2-settings .m2-divider,#fretboard-material-study .m2-settings details{grid-column:1/-1;margin:0;}#fretboard-material-study .m2-settings .m2-field{margin:0;}#fretboard-material-study .m2-board-caption{font-size:11px;}#fretboard-material-study .m2-coordinate{margin-left:0;}#fretboard-material-study .m2-selection{flex-wrap:wrap;}#fretboard-material-study .m2-pitch-strip{gap:2px;}#fretboard-material-study .m2-pitch{min-width:20px;font-size:14px;}#fretboard-material-study .m2-pitch-distance{font-size:10px;}#fretboard-material-study .m2-modes{gap:11px;flex-wrap:wrap;}#fretboard-material-study .m2-layout.is-closed .m2-settings{display:none;}#fretboard-material-study .m2-link-label{display:none;}}
  @media(prefers-reduced-motion:reduce){#fretboard-material-study *{transition:none!important;}}
</style>
<script>
(() => {
  const root=document.getElementById('fretboard-material-study');
  const strings=['G','D','A','E'];
  const open={G:43,D:38,A:33,E:28};
  const notes=[['E',5,'A1','1',1],['E',8,'C2','♭3',4],['A',5,'D2','4',1],['A',7,'E2','5',3],['D',5,'G2','♭7',1],['D',7,'A2','1',3],['G',5,'C3','♭3',1],['G',7,'D3','4',3]].map(([string,fret,note,degree,finger])=>({id:string+':'+fret,string,fret,note,degree,finger,midi:open[string]+fret}));
  const degreeNames={'1':'Тоника','♭3':'Малая терция','4':'Кварта','5':'Квинта','♭7':'Малая септима'};
  const intervalNames={0:'Тоника',3:'Малая терция',5:'Кварта',7:'Квинта',10:'Малая септима',12:'Октава',15:'Малая терция через октаву',17:'Кварта через октаву'};
  const state=Object.fromEntries(['precise','instrument','connections'].map(mode=>[mode,{selected:'A:7',labels:'notes',panel:true,fingers:false,finger:'all',strings:[...strings],links:true}]));
  const saved=window.openai?.widgetState?.privateContent;if(saved?.revision==='r2')for(const key of Object.keys(state))if(saved[key])Object.assign(state[key],saved[key]);
  for(const s of Object.values(state)){s.strings=Array.isArray(s.strings)?s.strings.filter(x=>strings.includes(x)):[...strings];if(!notes.some(n=>n.id===s.selected))s.selected='A:7';s.labels=s.labels==='degrees'?'degrees':'notes';}
  const observed=new WeakMap();
  function persist(){window.openai?.setWidgetState?.({modelContent:{screen:'VIS-01',base:'Мастерская',revision:'r2',fretboard:'0–24, четыре струны, фильтруются маркеры'},privateContent:{revision:'r2',...state}})?.catch(()=>{});}
  function menu(){return '<nav class="m2-nav" aria-label="Разделы приложения"><span class="m2-brand">bass<span>.</span>study</span><div class="m2-nav-section"><span class="m2-nav-caption">ПРАКТИКА</span><span class="m2-nav-item m2-nav-current" aria-current="page">Гриф</span><span class="m2-nav-item">Слух</span><span class="m2-nav-item">Играть</span><span class="m2-nav-item">Занятия</span></div><div class="m2-nav-section m2-nav-bottom"><span class="m2-nav-item">Инструменты</span><span class="m2-nav-item">Помощь</span></div></nav>';}
  function pitchStrip(selected){return '<div class="m2-pitch-strip" role="img" aria-label="Минорная пентатоника A: 1, малая терция, кварта, квинта, малая септима; промежутки 3, 2, 2, 3, 2 полутона">'+[['A','1'],['C','♭3'],['D','4'],['E','5'],['G','♭7'],['A','1']].map(([n,d],i)=>'<span class="m2-pitch '+(selected.degree===d?'is-current':'')+'">'+n+'<small>'+d+'</small></span>'+(i<5?'<span class="m2-pitch-distance">'+[3,2,2,3,2][i]+'</span>':'')).join('')+'</div>';}
  function detail(mode,s,n){if(mode==='instrument')return '<div class="m2-detail-row"><span class="m2-detail-label">Аппликатура по пальцам</span><div class="m2-switch" aria-label="Выделить палец">'+['all','1','3','4'].map(f=>'<button type="button" data-finger="'+f+'" aria-pressed="'+(s.finger===f)+'">'+(f==='all'?'Все':f)+'</button>').join('')+'</div></div>';if(mode==='connections')return '<div class="m2-detail-row"><span class="m2-detail-label">Связь с A1 на E/5</span><div class="m2-switch" aria-label="Рассмотреть связь">'+[['E:8','Терция'],['A:7','Квинта'],['D:7','Октава']].map(([id,label])=>'<button type="button" data-link-note="'+id+'" aria-pressed="'+(s.selected===id)+'">'+label+'</button>').join('')+'</div></div><div class="m2-detail-row" style="margin-top:5px;min-height:24px"><span class="m2-interval">A1 → '+n.note+'</span><span class="m2-detail-label">'+intervalNames[n.midi-33]+' · '+(n.midi===33?'0':'+'+(n.midi-33))+' полутонов</span></div>';return '<div class="m2-detail-row"><span class="m2-detail-label">Полный гриф 0–24 · форма выделена на ладах 5–8</span><span class="m2-detail-label">Струны и лады остаются на месте</span></div>';}
  const observer=new ResizeObserver(entries=>{for(const entry of entries){const width=Math.round(entry.contentRect.width);if(width<1||observed.get(entry.target)===width)continue;observed.set(entry.target,width);draw(entry.target,width);}});
  function render(mode){const app=root.querySelector('[data-version="'+mode+'"]');const s=state[mode];let n=notes.find(n=>n.id===s.selected);const visible=notes.filter(n=>s.strings.includes(n.string));if(visible.length&&!s.strings.includes(n.string)){n=visible[0];s.selected=n.id;}
    const lastArea=app.querySelector('.m2-board-area');if(lastArea)observer.unobserve(lastArea);

ide class="m2-settings" aria-label="Параметры материала"><h3>Материал</h3><div class="m2-field"><span class="m2-field-label">Тоника</span><span class="m2-field-value">A · ля</span></div><div class="m2-field"><span class="m2-field-label">Структура</span><span class="m2-field-value">Минорная пентатоника</span></div><div class="m2-field"><span class="m2-field-label">Учебная область</span><span class="m2-field-value">Форма A · лады 5–8</span></div><div class="m2-divider"></div><h3>Маркеры</h3><div class="m2-field"><span class="m2-field-label">Показывать ноты на струнах</span><div class="m2-string-switches">'+strings.map(string=>'<label class="m2-string-switch"><span>'+string+'</span><input type="checkbox" data-string="'+string+'" aria-label="Ноты на струне '+string+'" '+(s.strings.includes(string)?'checked':'')+'></label>').join('')+'</div></div><label class="m2-check"><input type="checkbox" data-control="fingers" '+(s.fingers?'checked':'')+'><span>Показывать пальцы</span></label>'+(mode==='connections'?'<label class="m2-check"><input type="checkbox" data-control="links" '+(s.links?'checked':'')+'><span>Показывать связь</span></label>':'')+'<details><summary>Форма и полный гриф</summary><p>На грифе всегда видны открытые струны и все 24 лада. Форма заполняет только свои позиции. Фильтр струн убирает маркеры, оставляя сами струны.</p></details></aside></div>';
    const area=app.querySelector('.m2-board-area');draw(area,area.getBoundingClientRect().width);observer.observe(area);

  function draw(area,width){if(width<1)return;const mode=area.dataset.mode,s=state[mode],n=notes.find(n=>n.id===s.selected);const W=Math.round(width),H=286,left=34,right=W-12,inner=right-left;const zero=Math.max(15,inner*.033),start=left+zero,length=right-start;const wires=Array.from({length:25},(_,f)=>f===0?start:mode==='instrument'?start+length*(1-Math.pow(2,-f/12))/.75:start+length*f/24);const center=f=>f===0?left+zero/2:(wires[f-1]+wires[f])/2;const y=string=>58+strings.indexOf(string)*57;const x=center(n.fret),selectedY=y(n.string);const activeLeft=wires[4],activeRight=wires[8];const shown=notes.filter(n=>s.strings.includes(n.string));
    area.classList.toggle('m2-dense',W<720);area.classList.toggle('m2-tiny',W<440);
    let svg='<svg class="m2-board-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Четыре струны G D A E. Открытые струны и лады 1–24. Материал формы на ладах 5–8."><defs><linearGradient id="m2-metal-'+mode+'" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#526255"/><stop offset=".5" stop-color="#c7d0c0"/><stop offset="1" stop-color="#586b5e"/></linearGradient></defs><rect x="'+activeLeft+'" y="33" width="'+(activeRight-activeLeft)+'" height="230" fill="#c2d7b4" opacity=".07"/><line x1="'+activeLeft+'" y1="33" x2="'+activeRight+'" y2="33" stroke="#e1b778" stroke-width="2"/>';
    if(mode==='precise'&&shown.some(p=>p.id===n.id))svg+='<rect x="'+(n.fret===0?left:wires[n.fret-1])+'" y="34" width="'+(n.fret===0?zero:wires[n.fret]-wires[n.fret-1])+'" height="228" fill="#d8e5cd" opacity=".075"/><rect x="'+left+'" y="'+(selectedY-20)+'" width="'+inner+'" height="40" fill="#d8e5cd" opacity=".035"/>';
    for(const fret of [3,5,7,9,12,15,17,19,21,24]){const cy=(y('D')+y('A'))/2;svg+='<circle cx="'+center(fret)+'" cy="'+(fret%12===0?cy-9:cy)+'" r="3.3" fill="#bdc9ba" opacity=".28"/>'+(fret%12===0?'<circle cx="'+center(fret)+'" cy="'+(cy+9)+'" r="3.3" fill="#bdc9ba" opacity=".28"/>':'');}
    for(let fret=0;fret<=24;fret++){const label=fret===0?0:fret;const show=W>=720||fret===0||(fret>=5&&fret<=8)||[3,9,12,15,17,19,21,24].includes(fret);if(show)svg+='<text x="'+center(fret)+'" y="21" text-anchor="middle" font-size="'+(W<440?11:12)+'" fill="'+(fret===n.fret?'#f2c689':'#c0ccbc')+'" font-weight="'+(fret===n.fret?600:400)+'">'+label+'</text>';svg+='<line x1="'+wires[fret]+'" y1="34" x2="'+wires[fret]+'" y2="262" stroke="'+(mode==='instrument'?'#839787':'#687f70')+'" stroke-width="'+(fret===0?3:mode==='instrument'?2.4:1)+'"/>';}
    strings.forEach((string,i)=>{const gauge=mode==='instrument'?[1.5,2.1,3,4][i]:[1,1.5,2,2.6][i];svg+='<text x="15" y="'+(y(string)+5)+'" text-anchor="middle" fill="#e1eadb" font-size="14" font-weight="'+(string===n.string?650:400)+'" data-string-label="'+string+'">'+string+'</text><line x1="'+left+'" y1="'+(y(string)+1)+'" x2="'+right+'" y2="'+(y(string)+1)+'" stroke="#0b150f" stroke-width="'+(gauge+2)+'"/><line x1="'+left+'" y1="'+y(string)+'" x2="'+right+'" y2="'+y(string)+'" stroke="#a7b7a9" stroke-width="'+gauge+'"/>'+(mode==='instrument'?'<line x1="'+left+'" y1="'+(y(string)-gauge/3)+'" x2="'+right+'" y2="'+(y(string)-gauge/3)+'" stroke="#e0e7d8" stroke-width=".6" opacity=".8"/>':'');});
    if(mode==='connections'&&s.links&&n.id!=='E:5'&&s.strings.includes('E')&&s.strings.includes(n.string)){const ax=center(5),ay=y('E');const cy=n.string==='E'?ay+38:Math.min(H-12,ay+27);svg+='<path d="M '+ax+' '+ay+' C '+ax+' '+cy+', '+x+' '+cy+', '+x+' '+selectedY+'" stroke="#a6d9ed" stroke-width="2" fill="none" stroke-linecap="round"/>';}
    svg+='</svg>';
    area.innerHTML=svg+shown.map(p=>{const muted=mode==='instrument'&&s.finger!=='all'&&String(p.finger)!==s.finger;return '<button type="button" class="m2-dot '+(p.degree==='1'?'m2-root ':'')+(p.id===s.selected?'m2-selected ':'')+(mode==='connections'&&s.links&&p.id===s.selected?'m2-related ':'')+(muted?'m2-dim':'')+'" style="left:'+center(p.fret)+'px;top:'+y(p.string)+'px" data-note="'+p.id+'" data-fret="'+p.fret+'" aria-pressed="'+(p.id===s.selected)+'" aria-label="'+p.note+', '+degreeNames[p.degree]+', струна '+p.string+', лад '+p.fret+', палец '+p.finger+'">'+(s.labels==='degrees'?p.degree:p.note.replace(/[0-9]/g,''))+(s.fingers?'<span class="m2-finger">'+p.finger+'</span>':'')+'</button>';}).join('');
  }
  root.addEventListener('click',event=>{const button=event.target.closest('button');const app=event.target.closest('[data-version]');if(!button||!app)return;const mode=app.dataset.version,s=state[mode];let focusKey=null,focusValue=null;if(button.dataset.note){s.selected=button.dataset.note;focusKey='note';focusValue=s.selected;}if(button.dataset.label){s.labels=button.dataset.label;focusKey='label';focusValue=s.labels;}if(button.dataset.action==='panel'){s.panel=!s.panel;focusKey='action';focusValue='panel';}if(button.dataset.finger){s.finger=button.dataset.finger;s.fingers=s.finger!=='all'||s.fingers;const candidate=notes.find(n=>s.strings.includes(n.string)&&String(n.finger)===s.finger);if(candidate)s.selected=candidate.id;focusKey='finger';focusValue=s.finger;}if(button.dataset.linkNote){const candidate=notes.find(n=>n.id===button.dataset.linkNote);if(s.strings.includes(candidate.string)){s.selected=candidate.id;s.links=true;}focusKey='link-note';focusValue=button.dataset.linkNote;}render(mode);if(focusKey)app.querySelector('button[data-'+focusKey+'="'+focusValue+'"]')?.focus({preventScroll:true});persist();});
  root.addEventListener('change',event=>{const app=event.target.closest('[data-version]');if(!app)return;const mode=app.dataset.version,s=state[mode],control=event.target.dataset.control,string=event.target.dataset.string;if(string)s.strings=event.target.checked?[...new Set([...s.strings,string])]:s.strings.filter(x=>x!==string);if(control==='fingers')s.fingers=event.target.checked;if(control==='links')s.links=event.target.checked;render(mode);app.querySelector(string?'input[data-string="'+string+'"]':'input[data-control="'+control+'"]')?.focus({preventScroll:true});persist();});
  root.addEventListener('keydown',event=>{const button=event.target.closest('button[data-note]');if(!button||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;const app=button.closest('[data-version]'),mode=app.dataset.version,s=state[mode],n=notes.find(n=>n.id===button.dataset.note);const candidates=notes.filter(p=>s.strings.includes(p.string));let next;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){const row=candidates.filter(p=>p.string===n.string).sort((a,b)=>a.fret-b.fret);next=row[Math.max(0,Math.min(row.length-1,row.indexOf(n)+(event.key==='ArrowRight'?1:-1)))];}else{const index=strings.indexOf(n.string)+(event.key==='ArrowDown'?1:-1);next=candidates.filter(p=>p.string===strings[index]).sort((a,b)=>Math.abs(a.fret-n.fret)-Math.abs(b.fret-n.fret))[0];}if(next){event.preventDefault();s.selected=next.id;render(mode);app.querySelector('button[data-note="'+next.id+'"]')?.focus({preventScroll:true});persist();}});
  window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent;if(next?.revision==='r2'){for(const key of Object.keys(state))if(next[key])Object.assign(state[key],next[key]);for(const key of Object.keys(state))render(key);}});
  for(const mode of Object.keys(state))render(mode);
  if(globalThis.Tweak)for(const mode of Object.keys(state)){const tweak=new Tweak({container:root.querySelector('[data-version="'+mode+'"]'),onChange:()=>render(mode)});tweak.addToggle(state[mode],'panel',{label:'Параметры справа'});tweak.addToggle(state[mode],'fingers',{label:'Показывать пальцы'});}
})();

<script>
(() => {

  const ids = ["A1","A2","A3"];
  const buttons = Array.from(document.querySelectorAll('[data-ref-choice]'));
  const show = index => {

  buttons.forEach((button, i) => button.addEventListener('click', () => {

  document.getElementById('review-theme').addEventListener('change', event => {
